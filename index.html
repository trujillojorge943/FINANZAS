<style>
:root{
  --bg:#E8ECEF; --surface:#FFFFFF; --surface2:#F3F5F7; --line:#D9DEE3;
  --ink:#16233A; --ink2:#55627A; --ink3:#8B95A7;

  --bbva:#1464A5; --nx:#EF6A24; --mp:#009EE3; --ahorro:#6B4FBB;

  color-scheme:light;
}
@media (prefers-color-scheme: dark){

    --bg:#0F1724; --surface:#18233A; --surface2:#1F2C46; --line:#2C3A57;
    --ink:#E9EEF6; --ink2:#AAB5C8; --ink3:#77839A;
    --pos:#43C59A; --pos-bg:#123A30; --neg:#F07A70; --neg-bg:#3D1C1C; --warn:#F0B94D; --warn-bg:#3A2E12;

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

button{cursor:pointer}

.top{display:flex;justify-content:space-between;align-items:center;padding:6px 4px 14px}
.top h1{font-size:19px;font-weight:800;letter-spacing:-.01em}

.card{background:var(--surface);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;border:1px solid var(--line)}

.muted{color:var(--ink3);font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--surface2)}

.amt{font-weight:700;white-space:nowrap}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px}
.btn.pri{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.sm{padding:5px 11px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}

.chip.est{background:var(--warn-bg);color:var(--warn)}

.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
/* hero */
.hero{background:var(--ink);color:var(--surface);border-radius:22px;padding:18px 18px 16px;margin-bottom:12px}
.hero .lbl{font-size:12px;opacity:.7}

.split{display:flex;height:10px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.12);margin-bottom:12px}

.accs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.acc .n{font-size:11px;opacity:.75;display:flex;align-items:center}

/* bars */

.alert{border-radius:var(--r);padding:12px;margin-bottom:8px;border:1px solid var(--line);background:var(--surface)}

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

// ================= FECHAS =================
const pad = n => String(n).padStart(2,'0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => new Date(s+'T12:00:00');
const hoyStr = () => ds(new Date());
const addD = (s,n) => { const d=pd(s); d.setDate(d.getDate()+n); return ds(d); };
const addM = (s,n) => { const d=pd(s); const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(day,last)); return ds(d); };
const dow = s => pd(s).getDay();
const diffD = (a,b) => Math.round((pd(b)-pd(a))/864e5);
const viernesDe = s => { let d=s; while(dow(d)!==5) d=addD(d,-1); return d; }; // inicio de semana (vie)
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
const fC = s => s ? `${pd(s).getDate()}/${pd(s).getMonth()+1}` : '';
const fL = s => s ? `${DIAS[dow(s)]} ${pd(s).getDate()} ${MESES[pd(s).getMonth()]}` : '';
const $ = n => { const v=Math.round(n||0); return (v<0?'−$':'$')+Math.abs(v).toLocaleString('es-AR'); };
const $s = n => (n>0?'+':'')+$(n);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

// ================= DATOS INICIALES =================
const STORAGE_KEY = 'jorge-finanzas-v13';
const OLD_KEY = 'jorge-finanzas-v11';

const CATS_OTRAS = ['Comida mediodía','Corte de pelo','Vivienda','Patente','Auto','Salud','Trabajo','Imprevisto','Otro'];

      {id:'c5', previo:true, tarjeta:'tbbva', fecha:'2026-09-25', desc:'Despegar', cat:'Otro', montoCuota:1519.5, cuotas:1, cuotasPagadas:0},
      {id:'c6', previo:true, tarjeta:'tbbva', fecha:'2026-10-10', desc:'PedidosYa Quincho Milan', cat:'PedidosYa', montoCuota:10770, cuotas:1, cuotasPagadas:0},

      {id:'expc', tipo:'gasto', nombre:'Expensas cochera', grupo:'vivienda', frec:'mensual', dia:10, pagoViernes:true, estim:'ultimo', montos:[{desde:ini,monto:55000}], medio:'bbva'},

      {id:'varios', tipo:'presupuesto', nombre:'Gastos varios', usaCatsVarios:true, frec:'semanal', montos:[{desde:ini,monto:100000}], medio:'bbva', compensa:true},
      {id:'turbo', tipo:'gasto', nombre:'Plan Turbo Naranja', frec:'mensual', dia:27, pagoViernes:false, estim:'ultimo', montos:[{desde:ini,monto:11240}], medio:'tnx', cat:'Otro'},
      {id:'subs', tipo:'gasto', nombre:'Spotify + Google One (USD)', frec:'mensual', dia:13, pagoViernes:false, estim:'ultimo', montos:[{desde:'2026-11-01',monto:6000}], medio:'tbbva', cat:'Otro'},
    ],

      {id:'e1', tipo:'gasto', fecha:'2026-10-23', monto:850000, desc:'Renovación alquiler (depósito 190.000 + comisión 555.000 + firmas 105.000)', cuenta:'bbva', tentativo:true, cat:'Vivienda'},
      {id:'e2', tipo:'ingreso', subtipo:'Evento musical', fecha:'2026-10-25', monto:40000, desc:'Evento musical', cuenta:'bbva', ahorro:false},
      {id:'e3', tipo:'ingreso', subtipo:'Evento musical', fecha:'2026-10-23', monto:50000, desc:'Evento musical (me deben)', cuenta:'bbva', ahorro:false, tentativo:true},
    ],

}

// ================= MOTOR =================
const esTarjeta = (db,id) => db.tarjetas.some(t=>t.id===id);
const nombreMedio = (db,id) => (db.cuentas.find(c=>c.id===id)||db.tarjetas.find(t=>t.id===id)||{nombre:id}).nombre;
const esFeriado = (db,s) => (db.feriados||[]).includes(s);
const habilAntes = (db,s) => { let d=s; while(dow(d)===0||dow(d)===6||esFeriado(db,d)) d=addD(d,-1); return d; };
const montoVigente = (rec,fecha) => { const ms=[...(rec.montos||[])].sort((a,b)=>a.desde.localeCompare(b.desde)); let m=ms.length?ms[0].monto:0; ms.forEach(x=>{ if(x.desde<=fecha) m=x.monto; }); return m; };

// Fechas programadas de un recurrente entre a y b (inclusive)
function programadas(rec,a,b){
  const out=[];
  if(rec.frec==='semanal'||rec.frec==='quincenal'){
    let f=a; while(dow(f)!==5) f=addD(f,1);
    for(;f<=b;f=addD(f,7)){
      if(rec.frec==='quincenal'){ const w=Math.round(diffD(rec.ancla||a,f)/7); if(w%2!==0) continue; }
      out.push(f);
    }
  } else if(rec.frec==='mensual'){
    let m=a.slice(0,8)+'01';
    for(let k=0;k<24;k++){
      const venc=addM(m,k).slice(0,8)+pad(Math.min(rec.dia||10,28));
      if(venc>addD(b,40)) break;
      out.push(venc);
    }
  }
  return out;
}
// Fecha efectiva de pago de una programada
function fechaEfectiva(db,rec,prog){
  if(rec.frec==='mensual'){
    if(rec.pagoViernes){ return habilAntes(db,viernesDe(prog)); }
    return prog;
  }
  return habilAntes(db,prog);
}
function estimado(db,rec,fecha){
  if(rec.estim==='ultimo'){
    const hechos=Object.entries(db.ocurr).filter(([k,o])=>k.startsWith(rec.id+'|')&&o.estado==='hecho'&&o.monto).sort((x,y)=>x[0].localeCompare(y[0]));
    if(hechos.length) return hechos[hechos.length-1][1].monto;
  }
  return montoVigente(rec,fecha);
}
// Ocurrencias de recurrentes (no presupuestos) en [a,b], con estado
function ocurrencias(db,a,b){
  const out=[];
  db.recurrentes.filter(r=>r.activo!==false&&r.tipo!=='presupuesto').forEach(rec=>{
    programadas(rec,addD(a,-45),addD(b,10)).forEach(prog=>{
      if(prog<=db.fechaInicio && rec.frec!=='mensual') return;
      const key=rec.id+'|'+prog; const o=db.ocurr[key]||{};
      let fecha=o.fecha||fechaEfectiva(db,rec,prog);
      if(prog<db.fechaInicio && rec.frec==='mensual' && fecha<=db.fechaInicio) return;
      if(fecha<=db.fechaInicio && !o.estado) return;
      const monto=o.monto??estimado(db,rec,prog);
      out.push({key,rec,prog,fecha,monto,estado:o.estado||'pendiente',ajustada:!!o.fecha});
    });
  });
  return out.filter(x=>x.fecha>=a&&x.fecha<=b);
}

// Resúmenes de una tarjeta (conocidos + estimados) hasta n
function resumenesDe(t,n=10){
  const rs=[...t.resumenes].sort((a,b)=>a.cierre.localeCompare(b.cierre));
  while(rs.length<n){ const l=rs[rs.length-1]; const c=addM(l.cierre,1), v=addM(l.vencimiento,1); rs.push({id:t.id+'-'+c, cierre:c, vencimiento:v, estimado:true}); }
  return rs;
}
// Items (cuotas) de cada tarjeta asignados a resúmenes
function itemsTarjeta(db,t,hasta){
  const rs=resumenesDe(t,14);
  const idx=f=>{ const i=rs.findIndex(r=>r.cierre>=f); return i<0?rs.length-1:i; };
  const items=[];
  db.consumos.filter(c=>c.tarjeta===t.id).forEach(c=>{
    const rest=(c.cuotas||1)-(c.cuotasPagadas||0); const i0=idx(c.fecha);
    for(let k=0;k<rest;k++){ const r=rs[i0+k]; if(!r) break;
      items.push({previo:!!c.previo, fechaCompra:c.fecha, desc:c.desc+((c.cuotas||1)>1?` (${(c.cuotasPagadas||0)+k+1}/${c.cuotas})`:''), monto:c.montoCuota, tercero:!!c.tercero, resumenId:r.id, consumoId:c.id, cat:c.cat, cuotaN:k, real:true});
    }
  });
  // recurrentes con tarjeta todavía no registrados
  ocurrencias(db,db.fechaInicio,hasta).filter(o=>o.rec.medio===t.id&&o.estado==='pendiente').forEach(o=>{
    const r=rs[idx(o.fecha)]; items.push({fechaCompra:o.fecha, desc:o.rec.nombre, monto:o.monto, resumenId:r.id, cat:o.rec.cat||'Otro', proyectado:true});
  });
  // ajustes de resúmenes confirmados y saldos impagos
  rs.forEach((r,i)=>{
    if(r.ajuste) items.push({fechaCompra:r.cierre, desc:'Ajuste al confirmar (impuestos, intereses, diferencias)', monto:r.ajuste, resumenId:r.id, ajuste:true});
    if(r.pagado && r.saldoImpago>0 && rs[i+1]) items.push({fechaCompra:r.vencimiento, desc:'Saldo impago del resumen anterior', monto:r.saldoImpago, resumenId:rs[i+1].id, arrastre:true});
  });
  return {rs,items};
}
function totalesResumen(items,rid){
  const it=items.filter(x=>x.resumenId===rid);
  return {propio:it.filter(x=>!x.tercero).reduce((a,b)=>a+b.monto,0), terceros:it.filter(x=>x.tercero).reduce((a,b)=>a+b.monto,0), items:it};
}

// Saldos reales
function saldosReales(db,hasta){
  const s={}; const ah={};
  db.cuentas.forEach(c=>{ s[c.id]=c.saldoInicial; ah[c.id]=c.ahorroInicial||0; });
  db.movs.filter(m=>!hasta||m.fecha<=hasta).forEach(m=>{
    const mo=m.monto;
    if(m.tipo==='ingreso'){ s[m.cuenta]+=mo; if(m.ahorro) ah[m.cuenta]+=mo; }
    else if(m.tipo==='gasto'||m.tipo==='pagoResumen'){ s[m.cuenta]-=mo; }
    else if(m.tipo==='reintegro'){ s[m.cuenta]+=mo; }
    else if(m.tipo==='ajuste'){ s[m.cuenta]+=mo; }
    else if(m.tipo==='transfer'){ s[m.cuenta]-=mo; s[m.cuentaDestino]+=mo; if(m.ahorro){ ah[m.cuenta]-=mo; ah[m.cuentaDestino]+=mo; } }
    else if(m.tipo==='apartar'){ ah[m.cuenta]+=mo; }
    else if(m.tipo==='liberar'){ ah[m.cuenta]-=mo; }
  });
  return {s,ah};
}

// Gasto registrado por categorías en una semana (cuentas + tarjetas)
function gastadoSemana(db,cats,ini){
  const fin=addD(ini,6);
  const m=db.movs.filter(x=>x.tipo==='gasto'&&cats.includes(x.cat)&&x.fecha>=ini&&x.fecha<=fin).reduce((a,b)=>a+b.monto,0);
  const t=db.consumos.filter(x=>!x.tercero&&!x.previo&&cats.includes(x.cat)&&x.fecha>=ini&&x.fecha<=fin).reduce((a,b)=>a+b.montoCuota*((b.cuotas||1)-(b.cuotasPagadas||0)),0);
  return m+t;
}
const catsDe = (db,rec) => rec.usaCatsVarios ? db.catsVarios : (rec.cats||[]);
// Presupuesto semanal con compensación de excesos: devuelve mapa semana -> {base,descuento,presupuesto,gastado,exceso,sobrante}
function presupuestoSemanas(db,rec,hastaIni){
  const res={}; let carry=0; const hoyIni=viernesDe(hoyStr());
  for(let w=viernesDe(db.fechaInicio); w<=hastaIni; w=addD(w,7)){
    let base=montoVigente(rec,w);
    if(w<db.fechaInicio) base=Math.round(base*(diffD(db.fechaInicio,addD(w,6))+1)/7);
    const desc=rec.compensa?Math.min(carry,base*0.5):0; carry-=desc;
    const pres=base-desc;
    const gast=w<=hoyIni?gastadoSemana(db,catsDe(db,rec),w):0;
    const exceso=w<=hoyIni?Math.max(0,gast-pres):0;
    if(rec.compensa) carry+=exceso;
    res[w]={base,descuento:desc,presupuesto:pres,gastado:gast,exceso,sobrante:w<hoyIni?Math.max(0,pres-gast):0,pendienteCarry:carry};
  }
  return res;
}

// ================= PROYECCIÓN =================
// Eventos futuros (desde hoy). Los vencidos sin registrar se ubican hoy.
function eventosFuturos(db,hasta){
  const hoy=hoyStr(); const ev=[]; const at=f=>f<hoy?hoy:f;
  // recurrentes (ingresos y gastos)
  ocurrencias(db,db.fechaInicio,hasta).filter(o=>o.estado==='pendiente').forEach(o=>{
    const f=at(o.fecha); if(f>hasta) return;
    if(o.rec.tipo==='ingreso') ev.push({fecha:f, tipo:'ingreso', cuenta:o.rec.medio, monto:o.monto, desc:o.rec.nombre+(o.ajustada?` (cobro movido del ${fC(o.prog)})`:''), vencido:o.fecha<hoy, key:o.key});
    else if(esTarjeta(db,o.rec.medio)) ev.push({fecha:f, tipo:'compraTarjeta', tarjeta:o.rec.medio, monto:o.monto, desc:o.rec.nombre+' ('+nombreMedio(db,o.rec.medio)+')', key:o.key});
    else ev.push({fecha:f, tipo:'gasto', grupo:o.rec.grupo==='vivienda'?'vivienda':'fijo', cuenta:o.rec.medio, monto:o.monto, desc:o.rec.nombre+(o.rec.frec==='mensual'?` (vence ${fC(o.prog)})`:''), vencido:o.fecha<hoy, key:o.key, estimado:o.rec.estim==='ultimo'});
  });
  // esperados
  db.esperados.filter(e=>!e.hecho).forEach(e=>{
    const f=at(e.fecha); if(f>hasta) return;
    if(e.tipo==='ingreso') ev.push({fecha:f, tipo:'ingreso', cuenta:e.cuenta, monto:e.monto, desc:e.desc, tentativo:e.tentativo, ahorro:e.ahorro, vencido:e.fecha<hoy, esperado:e.id});
    else ev.push({fecha:f, tipo:'gasto', grupo:'unico', cuenta:e.cuenta, monto:e.monto, desc:e.desc, tentativo:e.tentativo, vencido:e.fecha<hoy, esperado:e.id});
  });
  // presupuestos (lo que falta gastar de la semana actual + semanas futuras)
  const hoyIni=viernesDe(hoy);
  db.recurrentes.filter(r=>r.tipo==='presupuesto'&&r.activo!==false).forEach(rec=>{
    const ps=presupuestoSemanas(db,rec,viernesDe(hasta));
    Object.entries(ps).forEach(([w,p])=>{
      if(w<hoyIni) return;
      const resto=w===hoyIni?Math.max(0,p.presupuesto-p.gastado):p.presupuesto;
      const f=w===hoyIni?hoy:w;
      if(resto>0&&f<=hasta) ev.push({fecha:f, tipo:'gasto', grupo:'presupuesto', cuenta:rec.medio, monto:resto, desc:`${rec.nombre}${w===hoyIni?' (lo que queda de la semana)':''}${p.descuento?` — compensa ${$(p.descuento)}`:''}`, estimado:true});
    });
  });
  // pagos de resúmenes (parte propia)
  db.tarjetas.forEach(t=>{
    const {rs,items}=itemsTarjeta(db,t,hasta);
    rs.filter(r=>!r.pagado).forEach(r=>{
      const f=at(r.vencimiento); if(f>hasta) return;
      const tot=totalesResumen(items,r.id).propio; if(tot<=0) return;
      ev.push({fecha:f, tipo:'pagoResumen', cuenta:t.cuentaPago, tarjeta:t.id, resumenId:r.id, monto:tot, desc:`Resumen ${t.nombre} (vence ${fC(r.vencimiento)})`, estimado:r.estimado||!r.confirmado, vencido:r.vencimiento<hoy});
    });
  });
  return ev.sort((a,b)=>a.fecha.localeCompare(b.fecha));
}

function deudaTarjetas(db,D,hasta){
  const hoy=hoyStr(); let total=0; const por={};
  db.tarjetas.forEach(t=>{
    const {rs,items}=itemsTarjeta(db,t,hasta||addD(D,1));
    const pagado=id=>{ const r=rs.find(x=>x.id===id); if(!r) return false; if(r.pagado) return (r.fechaPago||r.vencimiento)<=D; return D>=hoy && (r.vencimiento<hoy?hoy:r.vencimiento)<=D; };
    const v=items.filter(x=>!x.tercero&&x.fechaCompra<=D&&!pagado(x.resumenId)).reduce((a,b)=>a+b.monto,0);
    por[t.id]=v; total+=v;
  });
  return {total,por};
}

function cashflow(db,nSem=12){
  const hoy=hoyStr(); const ini=viernesDe(hoy);
  const sems=Array.from({length:nSem},(_,i)=>{const a=addD(ini,i*7);return {a,b:addD(a,6)};});
  const hasta=sems[nSem-1].b;
  const fut=eventosFuturos(db,hasta);
  const real=saldosReales(db,hoy);
  const realTotal=Object.values(real.s).reduce((a,b)=>a+b,0);
  const ahorroReal=Object.values(real.ah).reduce((a,b)=>a+b,0);
  const cols=sems.map((w,i)=>{
    const enW=f=>f>=w.a&&f<=w.b;
    const det={ingresos:[],vivienda:[],fijos:[],unicos:[],presup:[],tarjeta:[],gastosReales:[],pagos:[]};
    // reales de la semana (hasta hoy)
    db.movs.filter(m=>enW(m.fecha)&&m.fecha<=hoy).forEach(m=>{
      if(m.tipo==='ingreso') det.ingresos.push({fecha:m.fecha,desc:m.desc+(m.ahorro?' (ahorro)':''),monto:m.monto,real:true,cuenta:m.cuenta});
      if(m.tipo==='gasto') det.gastosReales.push({fecha:m.fecha,desc:m.desc,monto:m.monto,real:true,cuenta:m.cuenta});
      if(m.tipo==='pagoResumen') det.pagos.push({fecha:m.fecha,desc:m.desc,monto:m.montoPropio??m.monto,real:true,cuenta:m.cuenta});
      if(m.tipo==='ajuste') (m.monto>=0?det.ingresos:det.gastosReales).push({fecha:m.fecha,desc:m.desc,monto:Math.abs(m.monto),real:true,cuenta:m.cuenta});
    });
    // compras con tarjeta de la semana (reales: por fecha de compra)
    db.tarjetas.forEach(t=>{
      itemsTarjeta(db,t,hasta).items.filter(x=>!x.tercero&&!x.arrastre&&!x.proyectado&&!x.previo&&enW(x.fechaCompra)).forEach(x=>{
        det.tarjeta.push({fecha:x.fechaCompra,desc:`${x.desc} · ${t.nombre}`,monto:x.monto,real:x.fechaCompra<=hoy});
      });
    });
    // proyectados
    fut.filter(e=>enW(e.fecha)).forEach(e=>{
      const it={fecha:e.fecha,desc:e.desc,monto:e.monto,tentativo:e.tentativo,estimado:e.estimado,vencido:e.vencido,cuenta:e.cuenta};
      if(e.tipo==='ingreso') det.ingresos.push(it);
      else if(e.tipo==='compraTarjeta') det.tarjeta.push(it);
      else if(e.tipo==='pagoResumen') det.pagos.push(it);
      else if(e.grupo==='vivienda') det.vivienda.push(it);
      else if(e.grupo==='unico') det.unicos.push(it);
      else if(e.grupo==='presupuesto') det.presup.push(it);
      else det.fijos.push(it);
    });
    const S=a=>a.reduce((x,y)=>x+y.monto,0);
    const ingresos=S(det.ingresos), egresos=S(det.vivienda)+S(det.fijos)+S(det.unicos)+S(det.presup)+S(det.gastosReales)+S(det.tarjeta);
    const balance=ingresos-egresos;
    // proyectado por cuenta al cierre de la semana
    const porCuenta={...real.s};
    fut.filter(e=>e.fecha<=w.b).forEach(e=>{
      if(!e.cuenta||porCuenta[e.cuenta]===undefined) return;
      if(e.tipo==='ingreso') porCuenta[e.cuenta]+=e.monto; else if(e.tipo!=='compraTarjeta') porCuenta[e.cuenta]-=e.monto;
    });
    const proyectado=Object.values(porCuenta).reduce((a,b)=>a+b,0);
    const ahorro=ahorroReal+fut.filter(e=>e.tipo==='ingreso'&&e.ahorro&&e.fecha<=w.b).reduce((a,b)=>a+b.monto,0);
    const deuda=deudaTarjetas(db,w.b,hasta);
    return {...w,i,det,ingresos,egresos,balance,proyectado,porCuenta,deuda,ahorro,pagosResumen:S(det.pagos),real:i===0?realTotal:null};
  });
  return {cols,real,realTotal,ahorroReal,fut};
}

// Saldo proyectado de una cuenta justo antes de una fecha (sin contar un evento)
function saldoCuentaAntes(db,cuenta,fecha,excluirResumen){
  const hoy=hoyStr(); const real=saldosReales(db,hoy).s[cuenta]||0;
  return real+eventosFuturos(db,fecha).filter(e=>e.cuenta===cuenta&&e.fecha<=fecha&&e.resumenId!==excluirResumen).reduce((a,e)=>a+(e.tipo==='ingreso'?e.monto:(e.tipo==='compraTarjeta'?0:-e.monto)),0);
}

// Tareas automáticas al abrir: registrar sueldos y cargos recurrentes con tarjeta que ya ocurrieron
function autoRegistrar(db){
  const hoy=hoyStr(); let cambio=false; const ocurr={...db.ocurr}; const movs=[...db.movs]; const consumos=[...db.consumos];
  ocurrencias(db,db.fechaInicio,hoy).filter(o=>o.estado==='pendiente'&&o.fecha<=hoy&&o.fecha>db.fechaInicio).forEach(o=>{
    if(o.rec.tipo==='ingreso'&&o.rec.auto){
      const id=uid(); movs.push({id,fecha:o.fecha,tipo:'ingreso',subtipo:'Sueldo',monto:o.monto,cuenta:o.rec.medio,desc:o.rec.nombre,recKey:o.key,auto:true});
      ocurr[o.key]={...(ocurr[o.key]||{}),estado:'hecho',monto:o.monto,fecha:o.fecha,movId:id}; cambio=true;
    } else if(o.rec.tipo==='gasto'&&esTarjeta(db,o.rec.medio)){
      const id=uid(); consumos.push({id,tarjeta:o.rec.medio,fecha:o.fecha,desc:o.rec.nombre,cat:o.rec.cat||'Otro',montoCuota:o.monto,cuotas:1,cuotasPagadas:0,recKey:o.key,auto:true});
      ocurr[o.key]={...(ocurr[o.key]||{}),estado:'hecho',monto:o.monto,fecha:o.fecha,consumoId:id}; cambio=true;
    }
  });
  return cambio?{...db,ocurr,movs,consumos}:db;
}

  return <div className="ov" onClick={onClose}><div className="sheet" role="dialog" aria-label={title} onClick={e=>e.stopPropagation()}>

const F = ({label,children}) => <div className="field"><label>{label}</label>{children}</div>;
const num = v => { const n=parseFloat(String(v).replace(/\./g,'').replace(',','.')); return isNaN(n)?0:n; };
function MontoInput({value,onChange,autoFocus}){ return <input inputMode="decimal" value={value} autoFocus={autoFocus} onChange={e=>onChange(e.target.value)} placeholder="0" />; }

function Bar({label,usado,tope,nota}){

  return <div style={{marginBottom:14}}>
    <div className="barline"><b style={{color:'var(--ink)'}}>{label}</b><span>{$(usado)} de {$(tope)}</span></div>
    <div className="bar" role="progressbar" aria-valuenow={Math.round(pct*100)} aria-valuemin="0" aria-valuemax="100"><span style={{width:Math.min(100,pct*100)+'%',background:col}}></span></div>

    <F label="Detalle (opcional)"><input value={v.desc} onChange={e=>setV({...v,desc:e.target.value})} placeholder="Ej: Acústico Bar Irlanda" /></F>
    <F label="Fecha"><input type="date" value={v.fecha} onChange={e=>setV({...v,fecha:e.target.value})} /></F>
    <div className="btns"><button className="btn pri" onClick={ok}>Guardar ingreso</button>
      {ed.id&&<button className="btn danger" onClick={()=>{let d={...db,movs:db.movs.filter(x=>x.id!==ed.id)}; if(ed.recKey){const o={...d.ocurr}; delete o[ed.recKey]; if(ed.recKey.startsWith('sueldo|')) o[ed.recKey]={estado:'omitido'}; d.ocurr=o;} save(d); onClose();}}>Eliminar</button>}</div>
    {ed.recKey&&ed.recKey.startsWith('sueldo|')&&ed.id&&<div className="muted">Si lo eliminás, ese viernes queda sin sueldo.</div>}
  </div></Sheet>;
}

function updRes(db,tid,rid,patch,rsAll){
  return {...db,tarjetas:db.tarjetas.map(t=>{ if(t.id!==tid) return t;
    let rs=[...t.resumenes]; const i=rs.findIndex(r=>r.id===rid);
    if(i<0){ const r=rsAll.find(x=>x.id===rid); rs.push({id:r.id,cierre:r.cierre,vencimiento:r.vencimiento,...patch}); }
    else rs[i]={...rs[i],...patch};
    return {...t,resumenes:rs.sort((a,b)=>a.cierre.localeCompare(b.cierre))}; })};
}

function FormConfirmar({db,save,onClose,t,r,tot,rsAll}){
  const sig=rsAll[rsAll.findIndex(x=>x.id===r.id)+1];
  const base=tot.propio-(r.ajuste||0);
  const [v,setV]=useState({total:Math.round(tot.propio),venc:r.vencimiento,sigCierre:sig?.cierre||'',sigVenc:sig?.vencimiento||''});
  const ok=()=>{ const real=num(v.total);
    let d=updRes(db,t.id,r.id,{confirmado:true,vencimiento:v.venc,ajuste:Math.round((real-base)*100)/100,estimado:false},rsAll);
    if(sig&&v.sigCierre&&v.sigVenc){ const tt=d.tarjetas.find(x=>x.id===t.id); const ex=tt.resumenes.find(x=>x.id===sig.id);
      d={...d,tarjetas:d.tarjetas.map(x=>x.id!==t.id?x:{...x,resumenes:[...x.resumenes.filter(y=>y.id!==sig.id),{...(ex||{}),id:sig.id,cierre:v.sigCierre,vencimiento:v.sigVenc}].sort((a,b)=>a.cierre.localeCompare(b.cierre))})}; }
    save(d); onClose(); };
  return <Sheet title={`Confirmar resumen ${t.nombre}`} onClose={onClose}><div className="form">
    <div className="muted">Copiá los datos del resumen que te llegó. La diferencia con lo registrado ({$(base)}) se carga como ajuste: impuestos, intereses o algo que faltó.</div>
    <F label="Total a pagar (tu parte, sin consumos de terceros)"><MontoInput value={v.total} onChange={x=>setV({...v,total:x})} autoFocus /></F>
    {tot.terceros>0&&<div className="muted">Además el resumen trae {$(tot.terceros)} de consumos de terceros.</div>}
    <F label="Vencimiento"><input type="date" value={v.venc} onChange={e=>setV({...v,venc:e.target.value})} /></F>
    {sig&&<><div className="muted" style={{marginTop:4}}>Próximo período (figura en el resumen):</div>
    <div className="two"><F label="Próximo cierre"><input type="date" value={v.sigCierre} onChange={e=>setV({...v,sigCierre:e.target.value})} /></F>
      <F label="Próximo vencimiento"><input type="date" value={v.sigVenc} onChange={e=>setV({...v,sigVenc:e.target.value})} /></F></div></>}
    <button className="btn pri" onClick={ok}>Confirmar resumen</button>
  </div></Sheet>;
}

function FormPagarResumen({db,save,onClose,t,r,tot,rsAll}){
  const [v,setV]=useState({monto:Math.round(tot.propio),cuenta:t.cuentaPago,fecha:hoyStr(),reintegro:tot.terceros>0,cuentaReint:t.cuentaPago});
  const ok=()=>{ const m=num(v.monto); if(m<0) return;
    const movs=[...db.movs]; const tercerosPagados=tot.terceros>0?tot.terceros:0;
    movs.push({id:uid(),fecha:v.fecha,tipo:'pagoResumen',monto:m+tercerosPagados,montoPropio:m,cuenta:v.cuenta,tarjeta:t.id,resumenId:r.id,desc:`Pago resumen ${t.nombre} (${fC(r.vencimiento)})`});
    if(tercerosPagados&&v.reintegro) movs.push({id:uid(),fecha:v.fecha,tipo:'reintegro',monto:tercerosPagados,cuenta:v.cuentaReint,desc:'Reintegro de terceros (consumos ajenos en la tarjeta)'});
    let d={...db,movs}; d=updRes(d,t.id,r.id,{pagado:true,fechaPago:v.fecha,montoPagado:m,saldoImpago:Math.max(0,Math.round((tot.propio-m)*100)/100)},rsAll);
    save(d); onClose(); };
  return <Sheet title={`Pagar resumen ${t.nombre}`} onClose={onClose}><div className="form">
    <div className="muted">Vence {fL(r.vencimiento)}. Tu parte: {$(tot.propio)}{tot.terceros>0?` + ${$(tot.terceros)} de terceros = ${$(tot.propio+tot.terceros)} en total`:''}.</div>
    <F label="Pago de tu parte"><MontoInput value={v.monto} onChange={x=>setV({...v,monto:x})} autoFocus /></F>
    {num(v.monto)<tot.propio&&<div className="alert d"><div className="b">Pagar menos del total genera intereses (más de 6% mensual). Lo que no pagues pasa al próximo resumen.</div></div>}
    <F label="Pagado desde"><SelMedio db={db} soloCuentas value={v.cuenta} onChange={x=>setV({...v,cuenta:x})} /></F>
    {tot.terceros>0&&<><label className="check"><input type="checkbox" checked={v.reintegro} onChange={e=>setV({...v,reintegro:e.target.checked})} /> Ya recibí la plata de los consumos de terceros</label>
      {v.reintegro&&<F label="La recibí en"><SelMedio db={db} soloCuentas value={v.cuentaReint} onChange={x=>setV({...v,cuentaReint:x})} /></F>}</>}
    <F label="Fecha de pago"><input type="date" value={v.fecha} onChange={e=>setV({...v,fecha:e.target.value})} /></F>
    <button className="btn pri" onClick={ok}>Registrar pago</button>
  </div></Sheet>;

// ================= INICIO =================
function Inicio({db,save,abrir}){
  const hoy=hoyStr(); const hoyIni=viernesDe(hoy);
  const {s,ah}=saldosReales(db,hoy);
  const total=Object.values(s).reduce((a,b)=>a+b,0); const ahorro=Object.values(ah).reduce((a,b)=>a+b,0);
  const deuda=deudaTarjetas(db,hoy).total;
  const pos=db.cuentas.map(c=>Math.max(0,s[c.id])); const sp=pos.reduce((a,b)=>a+b,0)||1;
  const recV=db.recurrentes.find(r=>r.id==='varios'), recC=db.recurrentes.find(r=>r.id==='comida');
  const pv=recV?presupuestoSemanas(db,recV,hoyIni)[hoyIni]:null, pc=recC?presupuestoSemanas(db,recC,hoyIni)[hoyIni]:null;
  const diasRest=diffD(hoy,addD(hoyIni,6))+1;
  const alerts=[];
  // tarjetas
  db.tarjetas.forEach(t=>{
    const {rs,items}=itemsTarjeta(db,t,addD(hoy,90));
    const pend=rs.filter(r=>!r.pagado);
    const sinConf=pend.find(r=>r.cierre<=hoy&&!r.confirmado);
    if(sinConf){ const tot=totalesResumen(items,sinConf.id); alerts.push({k:'c'+t.id,cls:'w',h:`Cerró el resumen de ${t.nombre}`,b:`Cargá el total real y el vencimiento que figuran en el resumen. Registrado hasta ahora: ${$(tot.propio)}.`,acc:[['Confirmar resumen',()=>abrir('confirmar',{t,r:sinConf,tot,rsAll:rs})]]}); }
    const prox=pend.find(r=>totalesResumen(items,r.id).propio>0||totalesResumen(items,r.id).terceros>0);
    if(prox){ const tot=totalesResumen(items,prox.id); const dd=diffD(hoy,prox.vencimiento);
      const disp=saldoCuentaAntes(db,t.cuentaPago,prox.vencimiento,prox.id);
      const falta=tot.propio-disp; const cls=dd<0?'d':dd===0?'d':dd<=5?'w':'i';
      alerts.push({k:'v'+t.id,cls,h:`${t.nombre}: ${$(tot.propio)} ${dd<0?`venció hace ${-dd} días`:dd===0?'vence hoy':`vence ${fL(prox.vencimiento)} (en ${dd} días)`}`,
        b:<>{tot.terceros>0&&<div>Además {$(tot.terceros)} de terceros (te los tienen que transferir).</div>}
          <div>Se paga desde {nombreMedio(db,t.cuentaPago)}: {falta>0?<b className="neg">ese día vas a tener {$(disp)}, faltan {$(falta)}. Transferí antes.</b>:<span>ese día vas a tener {$(disp)}, alcanza.</span>}</div>
          {!prox.confirmado&&<div className="mini">Monto estimado hasta que confirmes el resumen.</div>}</>,
        acc:[['Pagar',()=>abrir('pagarResumen',{t,r:prox,tot,rsAll:rs})],...(falta>0?[['Transferir',()=>abrir('transfer')]]:[])]});
    }
  });
  // vivienda: viernes más próximo al 10
  const ocs=ocurrencias(db,db.fechaInicio,addD(hoy,14)).filter(o=>o.estado==='pendiente'&&o.rec.tipo==='gasto'&&!esTarjeta(db,o.rec.medio));
  const viv=ocs.filter(o=>o.rec.grupo==='vivienda'&&diffD(hoy,o.fecha)<=6);
  if(viv.length){ const f=viv[0].fecha; const tot=viv.reduce((a,b)=>a+b.monto,0); const dd=diffD(hoy,f);
    alerts.push({k:'viv',cls:dd<0?'d':'w',h:`Alquileres y expensas: ${$(tot)} aprox.`,b:<><div>Vencen el {fC(viv[0].prog)}. Pagalos en lo posible el {fL(f)}, el viernes más próximo al 10{dd<0?' (ya pasó)':dd===0?' (hoy)':''}.</div>
      {viv.map(o=><div key={o.key} className="row"><div className="l"><div className="t">{o.rec.nombre}</div><div className="s">{o.rec.estim==='ultimo'?'aprox., según el último pago':'monto vigente'}</div></div><span className="amt">{$(o.monto)}</span><button className="btn sm" onClick={()=>abrir('pagarRec',{oc:o})}>Pagar</button></div>)}</>});
  }
  // otros fijos próximos
  ocs.filter(o=>o.rec.grupo!=='vivienda'&&diffD(hoy,o.fecha)<=3).forEach(o=>alerts.push({k:o.key,cls:o.fecha<hoy?'d':'i',h:`${o.rec.nombre}: ${$(o.monto)}${o.rec.estim==='ultimo'?' aprox.':''}`,b:`${o.fecha<hoy?'Pendiente desde':'Para'} el ${fL(o.fecha)}.`,acc:[['Pagar',()=>abrir('pagarRec',{oc:o})]]}));
  // esperados vencidos
  db.esperados.filter(e=>!e.hecho&&e.fecha<=hoy).forEach(e=>alerts.push({k:e.id,cls:'i',h:`${e.tipo==='ingreso'?'¿Cobraste':'¿Pagaste'} ${e.desc}?`,b:`${$(e.monto)} previsto para el ${fL(e.fecha)}${e.tentativo?' (a confirmar)':''}.`,
    acc:[[e.tipo==='ingreso'?'Registrar cobro':'Registrar pago',()=>abrir(e.tipo==='ingreso'?'ingreso':'pagoUnico',{inicial:e.tipo==='ingreso'?{monto:e.monto,subtipo:e.subtipo,desc:e.desc,cuenta:e.cuenta,ahorro:e.ahorro,esperado:e.id}:e})],['Cambiar fecha',()=>abrir('esperado',{e})]]}));
  // actualizaciones de alquiler
  db.recurrentes.filter(r=>r.actualizaMeses&&r.ultimaActualizacion).forEach(r=>{ const prox=addM(r.ultimaActualizacion,r.actualizaMeses); const dd=diffD(hoy,prox);
    if(dd<=10) alerts.push({k:'act'+r.id,cls:'w',h:`${r.nombre}: actualización ${dd<0?'pendiente':`en ${dd} días`}`,b:`Toca el aumento trimestral (${fC(prox)}). Cargá el nuevo valor en Recurrentes cuando lo sepas.`,acc:[['Cargar nuevo valor',()=>abrir('rec',{r})]]}); });
  // sobrante semana anterior
  if(recV){ const prev=addD(hoyIni,-7); const p=presupuestoSemanas(db,recV,hoyIni)[prev];
    if(p&&p.sobrante>0&&!db.decisiones['sobrante|'+prev]) alerts.push({k:'sob',cls:'i',h:`La semana pasada te sobraron ${$(p.sobrante)} de varios`,b:'Lo recomendable es apartarlo como ahorro.',acc:[['Apartar',()=>abrir('ahorro',{inicial:{accion:'apartar',monto:Math.round(p.sobrante),desc:'Sobrante de varios',semana:prev}})],['Ahora no',()=>save({...db,decisiones:{...db.decisiones,['sobrante|'+prev]:'omitido'}})]]}); }
  // tope de cuotas
  const ingMes=montoVigente(db.recurrentes.find(r=>r.id==='sueldo')||{montos:[]},hoy)*52/12; const tope=ingMes*(db.tope_cuotas_pct||10)/100;
  const cuotasMes=cuotasComprometidas(db,1)[0];
  if(cuotasMes&&cuotasMes.cuotas>tope) alerts.push({k:'tope',cls:'w',h:`Cuotas del próximo resumen: ${$(cuotasMes.cuotas)}`,b:`Supera el tope del ${db.tope_cuotas_pct||10}% de tu ingreso (${$(tope)}). Evitá sumar compras en cuotas.`});

  return <div>
    <div className="hero">
      <div className="lbl">Total en tus cuentas</div>
      <div className="total">{$(total)}</div>
      <div className="split" aria-hidden="true">{db.cuentas.map((c,i)=><span key={c.id} style={{width:(pos[i]/sp*100)+'%',background:c.color}}></span>)}</div>
      <div className="accs">{db.cuentas.map(c=><div key={c.id} className="acc"><div className="n"><span className="dot" style={{background:c.color}}></span>{c.nombre}</div><div className="v">{$(s[c.id])}</div>{ah[c.id]>0&&<div className="mini" style={{color:'inherit',opacity:.7}}>ahorro {$(ah[c.id])}</div>}</div>)}</div>
      <div className="sub"><span>Ahorro apartado {$(ahorro)}</span><span>Deuda tarjetas {$(deuda)}</span></div>
    </div>
    <div className="fab">
      <button onClick={()=>abrir('gasto')}><span className="ic">➖</span>Gasto</button>
      <button onClick={()=>abrir('ingreso')}><span className="ic">➕</span>Ingreso</button>
      <button onClick={()=>abrir('transfer')}><span className="ic">⇄</span>Transferir</button>
      <button onClick={()=>abrir('ahorro')}><span className="ic">🐷</span>Ahorro</button>
    </div>
    <div className="card">
      <h2>Esta semana <span className="muted">vie {fC(hoyIni)} al jue {fC(addD(hoyIni,6))}</span></h2>
      {pv&&<Bar label="Gastos varios" usado={pv.gastado} tope={pv.presupuesto} nota={pv.descuento?`${$(pv.base)} − ${$(pv.descuento)} de la semana pasada`:(pv.gastado<pv.presupuesto?`unos ${$((pv.presupuesto-pv.gastado)/diasRest)} por día hasta el jueves`:'se descuenta la próxima semana')} />}
      {pc&&<Bar label="Comida del mediodía" usado={pc.gastado} tope={pc.presupuesto} nota="" />}
      <div className="mini">Las compras con tarjeta también cuentan: la plata ya está comprometida.</div>
    </div>
    {alerts.length>0&&<div className="card"><h2>Avisos</h2>
      {alerts.map(a=><div key={a.k} className={'alert '+a.cls}><div className="h">{a.h}</div><div className="b">{a.b}</div>{a.acc&&<div className="btns" style={{marginTop:8}}>{a.acc.map(([l,fn])=><button key={l} className="btn sm" onClick={fn}>{l}</button>)}</div>}</div>)}
    </div>}
    <MetaAhorro db={db} ahorro={ahorro} />
  </div>;
}
function MetaAhorro({db,ahorro}){
  const meta=db.metaAhorro||0; if(!meta) return null;
  return <div className="card"><h2>Fondo de emergencia <span className="muted">meta {$(meta)}</span></h2>
    <div className="bar" style={{height:14}}><span style={{width:Math.min(100,ahorro/meta*100)+'%',background:'var(--ahorro)'}}></span></div>
    <div className="barline"><span>{$(ahorro)} apartado</span><span>{Math.round(ahorro/meta*100)}%</span></div></div>;
}
function cuotasComprometidas(db,n=6){
  const hoy=hoyStr(); const meses={};
  db.tarjetas.forEach(t=>{ const {rs,items}=itemsTarjeta(db,t,addD(hoy,200));
    rs.filter(r=>!r.pagado&&r.vencimiento>=hoy).forEach(r=>{ const k=r.vencimiento.slice(0,7); const it=items.filter(x=>x.resumenId===r.id&&!x.tercero);
      meses[k]=meses[k]||{mes:k,total:0,cuotas:0,por:{}}; const tot=it.reduce((a,b)=>a+b.monto,0); const cu=it.filter(x=>x.desc.match(/\(\d+\/\d+\)$/)).reduce((a,b)=>a+b.monto,0);
      meses[k].total+=tot; meses[k].cuotas+=cu; meses[k].por[t.nombre]=(meses[k].por[t.nombre]||0)+tot; }); });
  return Object.values(meses).sort((a,b)=>a.mes.localeCompare(b.mes)).slice(0,n);
}

function Movimientos({db,save,abrir}){
  const [filtro,setFiltro]=useState('todos');
  const lista=[
    ...db.movs.map(m=>({...m,kind:'mov'})),
    ...db.consumos.filter(c=>!c.previo).map(c=>({id:c.id,kind:'consumo',fecha:c.fecha,tipo:'tarjeta',monto:c.montoCuota*(c.cuotas||1),desc:c.desc,cat:c.cat,medio:c.tarjeta,cuotas:c.cuotas,tercero:c.tercero,raw:c})),
  ].filter(m=>filtro==='todos'||(filtro==='gastos'&&(m.tipo==='gasto'||m.tipo==='tarjeta'))||(filtro==='ingresos'&&m.tipo==='ingreso')||(filtro==='otros'&&!['gasto','tarjeta','ingreso'].includes(m.tipo)))
   .sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const grupos={}; lista.forEach(m=>{const w=viernesDe(m.fecha);(grupos[w]=grupos[w]||[]).push(m);});
  const signo=m=>m.tipo==='ingreso'||m.tipo==='reintegro'||(m.tipo==='ajuste'&&m.monto>0)?1:(m.tipo==='transfer'||m.tipo==='apartar'||m.tipo==='liberar')?0:-1;
  const editar=m=>{ if(m.kind==='consumo') abrir('gasto',{inicial:{kind:'consumo',id:m.id,monto:m.monto,desc:m.desc,cat:m.cat,medio:m.medio,cuotas:m.cuotas,fecha:m.fecha,tercero:m.tercero}});
    else if(m.tipo==='gasto') abrir('gasto',{inicial:{kind:'mov',id:m.id,monto:m.monto,desc:m.desc,cat:m.cat,medio:m.cuenta,fecha:m.fecha}});
    else if(m.tipo==='ingreso') abrir('ingreso',{inicial:m});
    else if(confirm('¿Eliminar este movimiento?')) save({...db,movs:db.movs.filter(x=>x.id!==m.id)}); };
  return <div>
    <div className="fab">
      <button onClick={()=>abrir('gasto')}><span className="ic">➖</span>Gasto</button>
      <button onClick={()=>abrir('ingreso')}><span className="ic">➕</span>Ingreso</button>
      <button onClick={()=>abrir('transfer')}><span className="ic">⇄</span>Transferir</button>
      <button onClick={()=>abrir('ahorro')}><span className="ic">🐷</span>Ahorro</button>
    </div>
    <div className="seg tabs-sub">{[['todos','Todos'],['gastos','Gastos'],['ingresos','Ingresos'],['otros','Movimientos']].map(([k,l])=><button key={k} className={filtro===k?'on':''} onClick={()=>setFiltro(k)}>{l}</button>)}</div>
    {!lista.length&&<div className="card"><div className="empty">Todavía no hay movimientos. Cargá el primer gasto con el botón de arriba.</div></div>}
    {Object.entries(grupos).sort((a,b)=>b[0].localeCompare(a[0])).map(([w,ms])=><div className="card" key={w}>
      <h2>Semana del vie {fC(w)} <span className="muted">{$(ms.reduce((a,m)=>a+signo(m)*m.monto,0))}</span></h2>
      {ms.map(m=><div className="row" key={m.kind+m.id} onClick={()=>editar(m)} style={{cursor:'pointer'}}>
        <div className="l"><div className="t">{m.desc}</div>
          <div className="s">{fL(m.fecha)} · {m.tipo==='transfer'?`${nombreMedio(db,m.cuenta)} → ${nombreMedio(db,m.cuentaDestino)}`:nombreMedio(db,m.medio||m.cuenta)}{m.cuotas>1?` · ${m.cuotas} cuotas`:''}{m.cat?` · ${m.cat}`:''}</div>
          <div>{m.ahorro&&<span className="chip aho">ahorro</span>} {m.tercero&&<span className="chip">de terceros</span>} {m.auto&&<span className="chip">automático</span>}</div></div>
        <span className={'amt '+(signo(m)>0?'pos':signo(m)<0?'':'muted')}>{signo(m)>0?'+':signo(m)<0?'−':''}{$(Math.abs(m.monto))}</span>
      </div>)}
    </div>)}
  </div>;
}

function Cashflow({db}){
  const [det,setDet]=useState(null);
  const cf=useMemo(()=>cashflow(db,12),[db]);

  const S=a=>a.reduce((x,y)=>x+y.monto,0);
  const filas=[
    ['Ingresos','ingresos',c=>c.det.ingresos,1],
    ['Alquileres y expensas','vivienda',c=>c.det.vivienda,-1],
    ['Fijos','fijos',c=>c.det.fijos,-1],
    ['Pagos únicos','unicos',c=>c.det.unicos,-1],
    ['Comida y varios','presup',c=>[...c.det.presup],-1],
    ['Gastos registrados','reales',c=>c.det.gastosReales,-1],
    ['Compras con tarjeta','tarjeta',c=>c.det.tarjeta,-1],
  ];
  const celda=(v,items,titulo,sign)=>{ const has=items&&items.length; const t=items?.some(x=>x.tentativo||x.estimado);
    return <td className={'tap'} onClick={()=>has&&setDet({titulo,items,sign})}>{v?<span className={sign>0?'pos':''}>{sign>0?'+':'−'}{$(Math.abs(v)).replace('−','')}{t&&<span className="muted"> ?</span>}</span>:<span className="muted">—</span>}</td>; };
  return <div>

    <div className="cfwrap"><table className="cf">
      <thead><tr><th className="stick">Semana</th>{C.map(c=><th key={c.a} className={c.i===0?'cur':''}>{fC(c.a)}–{fC(c.b)}{c.det.pagos.length?<div className="neg" style={{fontSize:10}}>vence tarjeta</div>:null}</th>)}</tr></thead>
      <tbody>
        {filas.map(([l,k,get,sg])=>{ if(!C.some(c=>get(c).length)) return null; return <tr key={k}><td className="stick">{l}</td>{C.map(c=><React.Fragment key={c.a}>{celda(S(get(c)),get(c),`${l} · ${fC(c.a)} al ${fC(c.b)}`,sg)}</React.Fragment>)}</tr>; })}
        <tr className="key sep"><td className="stick">Balance sem.</td>{C.map(c=><td key={c.a} className={(c.i===0?'cur ':'')+(c.balance<0?'neg':'pos')}>{$s(c.balance)}</td>)}</tr>
        <tr><td className="stick">Pago de resúmenes</td>{C.map(c=><React.Fragment key={c.a}>{celda(c.pagosResumen,c.det.pagos,`Pagos de resúmenes · ${fC(c.a)} al ${fC(c.b)}`,-1)}</React.Fragment>)}</tr>
        <tr><td className="stick">Deuda tarjetas</td>{C.map(c=><td key={c.a} className="tap" onClick={()=>setDet({titulo:`Deuda de tarjetas al ${fC(c.b)}`,items:db.tarjetas.map(t=>({desc:t.nombre,monto:c.deuda.por[t.id]||0})),sign:0})}>{$(c.deuda.total)}</td>)}</tr>
        <tr><td className="stick">Ahorro apartado</td>{C.map(c=><td key={c.a} style={{color:'var(--ahorro)'}}>{$(c.ahorro)}</td>)}</tr>
        <tr className="key"><td className="stick">Proyectado</td>{C.map(c=><td key={c.a} className={'tap '+(c.i===0?'cur ':'')+(c.proyectado<0?'neg':'')} onClick={()=>setDet({titulo:`Saldo proyectado al ${fC(c.b)}`,items:db.cuentas.map(x=>({desc:x.nombre,monto:c.porCuenta[x.id]})),sign:0})}>{$(c.proyectado)}{db.cuentas.some(x=>c.porCuenta[x.id]<0)&&c.proyectado>=0?<span className="neg"> !</span>:null}</td>)}</tr>
        <tr className="key"><td className="stick">Real</td>{C.map(c=><td key={c.a} className={c.i===0?'cur':''}>{c.real!==null?$(c.real):<span className="muted">—</span>}</td>)}</tr>
      </tbody></table></div>
    <div className="card" style={{marginTop:12}}>
      <h2>Cómo leerlo</h2>
      <div className="muted" style={{fontSize:13}}>
        <p><b>Balance sem.:</b> ingresos menos egresos de la semana. Las compras con tarjeta cuentan la semana en que comprás.</p>
        <p style={{marginTop:6}}><b>Pago de resúmenes:</b> plata que sale de la cuenta para pagar la tarjeta. No es gasto nuevo: baja la deuda.</p>
        <p style={{marginTop:6}}><b>Proyectado:</b> lo que vas a tener en las cuentas al jueves. Se compara con el <b>Real</b>. Un "!" avisa que alguna cuenta queda en negativo aunque el total no.</p>
      </div></div>
    {det&&<Sheet title={det.titulo} onClose={()=>setDet(null)}>
      {det.items.map((x,i)=><div className="row" key={i}><div className="l"><div className="t" style={{fontWeight:500}}>{x.desc}</div><div className="s">{x.fecha?fL(x.fecha):''}{x.cuenta?` · ${nombreMedio(db,x.cuenta)}`:''}{x.real?' · registrado':x.fecha?' · previsto':''}{x.vencido?' · atrasado':''}</div></div>
        <span className={'amt '+(det.sign>0?'pos':(det.sign===0&&x.monto<0)?'neg':'')}>{det.sign>0?'+':det.sign<0?'−':''}{det.sign===0?$(x.monto):$(Math.abs(x.monto))}</span></div>)}
      {det.items.length>1&&<div className="row"><b>Total</b><b>{$(det.items.reduce((a,b)=>a+b.monto,0))}</b></div>}
    </Sheet>}
  </div>;
}

// ================= RECURRENTES =================
function Recurrentes({db,save,abrir}){
  const hoy=hoyStr();
  const prox=rec=>{ if(rec.tipo==='presupuesto') return 'cada semana'; const o=ocurrencias(db,hoy,addD(hoy,70)).filter(x=>x.rec.id===rec.id&&x.estado==='pendiente')[0]; return o?`próximo ${fL(o.fecha)}`:''; };
  const desc=r=>{ if(r.tipo==='presupuesto') return `tope semanal${r.compensa?', compensa excesos':''}`; const f=r.frec==='semanal'?'cada viernes':r.frec==='quincenal'?'cada 2 viernes':`día ${r.dia}${r.pagoViernes?', se paga el viernes anterior':''}`; return `${f} · ${nombreMedio(db,r.medio)}${r.tipo==='gasto'&&r.estim==='ultimo'?' · aprox., último pagado':''}`; };
  const grupos=[['Ingresos',r=>r.tipo==='ingreso'],['Vivienda',r=>r.grupo==='vivienda'],['Presupuestos semanales',r=>r.tipo==='presupuesto'],['Otros gastos',r=>r.tipo==='gasto'&&r.grupo!=='vivienda']];
  const sueldo=db.recurrentes.find(r=>r.id==='sueldo');
  const prSueldo=sueldo?ocurrencias(db,hoy,addD(hoy,35)).filter(o=>o.rec.id==='sueldo'&&o.estado==='pendiente'):[];
  return <div>
    {grupos.map(([g,fn])=>{ const rs=db.recurrentes.filter(fn); if(!rs.length) return null; return <div className="card" key={g}><h2>{g}</h2>
      {rs.map(r=><div className="row" key={r.id} onClick={()=>abrir('rec',{r})} style={{cursor:'pointer',opacity:r.activo===false?.5:1}}>
        <div className="l"><div className="t">{r.nombre}</div><div className="s">{desc(r)}</div><div className="s">{prox(r)}{r.ultimaActualizacion&&r.actualizaMeses?` · próxima actualización ${fC(addM(r.ultimaActualizacion,r.actualizaMeses))}`:''}</div></div>
        <span className="amt">{r.tipo==='ingreso'?'+':''}{$(r.tipo==='presupuesto'?montoVigente(r,hoy):estimado(db,r,hoy))}</span></div>)}
    </div>; })}
    <button className="btn" style={{width:'100%',marginBottom:12}} onClick={()=>abrir('rec',{})}>+ Nuevo recurrente</button>
    {prSueldo.length>0&&<div className="card"><h2>Próximos sueldos <span className="muted">tocá para adelantar o cambiar</span></h2>
      {prSueldo.map(o=><div className="row" key={o.key} onClick={()=>abrir('moverCobro',{oc:o})} style={{cursor:'pointer'}}><div className="l"><div className="t">{fL(o.fecha)}</div>{o.ajustada&&<div className="s">original {fL(o.prog)}</div>}{o.fecha!==o.prog&&!o.ajustada&&<div className="s">feriado el {fC(o.prog)}</div>}</div><span className="amt pos">+{$(o.monto)}</span></div>)}</div>}
    <div className="card"><h2>Pagos e ingresos previstos <button className="btn sm" onClick={()=>abrir('esperado',{})}>+ Agregar</button></h2>
      {db.esperados.filter(e=>!e.hecho).sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(e=><div className="row" key={e.id} onClick={()=>abrir('esperado',{e})} style={{cursor:'pointer'}}>
        <div className="l"><div className="t">{e.desc}</div><div className="s">{fL(e.fecha)} · {nombreMedio(db,e.cuenta)} {e.tentativo&&<span className="chip est">a confirmar</span>}</div></div>
        <span className={'amt '+(e.tipo==='ingreso'?'pos':'')}>{e.tipo==='ingreso'?'+':'−'}{$(e.monto)}</span></div>)}
      {!db.esperados.filter(e=>!e.hecho).length&&<div className="empty">Nada previsto. Acá van pagos únicos (como la renovación) e ingresos esperados (shows, bonos).</div>}
    </div>
  </div>;
}

// ================= CONFIG =================
function Config({db,save,abrir,setDb}){
  const fileRef=useRef();
  const [fer,setFer]=useState('');
  const [cat,setCat]=useState('');
  const exportar=(data,nombre)=>{ const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=nombre; document.body.appendChild(a); a.click(); a.remove(); };
  return <div>
    <div className="card"><h2>Saldos</h2><div className="muted" style={{marginBottom:8}}>Si la app no coincide con tus cuentas, ajustalo acá.</div><button className="btn" onClick={()=>abrir('ajuste')}>Ajustar saldos reales</button></div>
    <div className="card"><h2>Ahorro</h2>
      <div className="row"><span className="l">Meta del fondo de emergencia</span><input style={{width:130,textAlign:'right',padding:'6px 8px',border:'1px solid var(--line)',borderRadius:8,background:'var(--surface)'}} inputMode="numeric" value={db.metaAhorro} onChange={e=>save({...db,metaAhorro:num(e.target.value)})} /></div>
      <div className="row"><span className="l">Tope de cuotas (% del ingreso mensual)</span><input style={{width:70,textAlign:'right',padding:'6px 8px',border:'1px solid var(--line)',borderRadius:8,background:'var(--surface)'}} inputMode="numeric" value={db.tope_cuotas_pct} onChange={e=>save({...db,tope_cuotas_pct:num(e.target.value)})} /></div>
    </div>
    <div className="card"><h2>Categorías de gastos varios</h2><div className="muted" style={{marginBottom:6}}>Estas cuentan para la barra semanal de $100.000.</div>
      <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:8}}>{db.catsVarios.map(c=><span key={c} className="chip" style={{fontSize:12,padding:'4px 10px'}}>{c} <button className="btn ghost sm" style={{padding:'0 0 0 4px'}} aria-label={'Quitar '+c} onClick={()=>save({...db,catsVarios:db.catsVarios.filter(x=>x!==c)})}>✕</button></span>)}</div>
      <div style={{display:'flex',gap:8}}><input value={cat} onChange={e=>setCat(e.target.value)} placeholder="Nueva categoría" style={{flex:1,padding:'8px 10px',border:'1px solid var(--line)',borderRadius:8,background:'var(--surface)'}} /><button className="btn" onClick={()=>{if(cat&&!db.catsVarios.includes(cat)){save({...db,catsVarios:[...db.catsVarios,cat]});setCat('');}}}>Agregar</button></div></div>
    <div className="card"><h2>Feriados</h2><div className="muted" style={{marginBottom:6}}>Si un viernes es feriado, el sueldo se proyecta el día hábil anterior. Revisá que estén los que publique el gobierno.</div>
      <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:8}}>{[...db.feriados].sort().filter(f=>f>=addD(hoyStr(),-30)).map(f=><span key={f} className="chip" style={{fontSize:12,padding:'4px 10px'}}>{fL(f)} {pd(f).getFullYear()} <button className="btn ghost sm" style={{padding:'0 0 0 4px'}} aria-label="Quitar" onClick={()=>save({...db,feriados:db.feriados.filter(x=>x!==f)})}>✕</button></span>)}</div>
      <div style={{display:'flex',gap:8}}><input type="date" value={fer} onChange={e=>setFer(e.target.value)} style={{flex:1,padding:'8px 10px',border:'1px solid var(--line)',borderRadius:8,background:'var(--surface)'}} /><button className="btn" onClick={()=>{if(fer&&!db.feriados.includes(fer)){save({...db,feriados:[...db.feriados,fer]});setFer('');}}}>Agregar</button></div></div>
    <div className="card"><h2>Respaldo</h2><div className="muted" style={{marginBottom:8}}>Los datos se guardan en este navegador. Para pasarlos a otro dispositivo, exportá acá e importá allá.</div>
      <div className="btns"><button className="btn" onClick={()=>exportar(db,`finanzas_jorge_${hoyStr()}.json`)}>Exportar</button>
        <button className="btn" onClick={()=>fileRef.current.click()}>Importar</button>
        <input ref={fileRef} type="file" accept=".json" style={{display:'none'}} onChange={e=>{const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>{try{const d=JSON.parse(ev.target.result); if(d.version!==13) return alert('Ese archivo es de otra versión de la app.'); setDb(d); alert('Datos importados.');}catch{alert('El archivo no se pudo leer.');}}; r.readAsText(f); e.target.value='';}} /></div></div>
    <div className="card"><h2>Empezar de nuevo</h2><div className="muted" style={{marginBottom:8}}>Vuelve a los datos del 20/10 (saldos, tarjetas y recurrentes del plan). Antes descarga un respaldo.</div>
      <button className="btn danger" onClick={()=>{if(!confirm('¿Borrar todo y volver a los datos iniciales?')) return; exportar(db,`finanzas_respaldo_${hoyStr()}.json`); setDb(autoRegistrar(datosIniciales()));}}>Restablecer</button></div>
  </div>;
}

// ================= APP =================
const TABS=[['inicio','Inicio','🏠'],['movs','Movimientos','📝'],['tarjetas','Tarjetas','💳'],['cash','Cashflow','📊'],['rec','Recurrentes','🔁'],['config','Ajustes','⚙️']];
function cargar(){ try{ const d=JSON.parse(localStorage.getItem(STORAGE_KEY)); if(d&&d.version===13) return d; }catch(e){} return null; }
function App(){
  const [db,setDbRaw]=useState(()=>autoRegistrar(cargar()||datosIniciales()));
  const [tab,setTab]=useState('inicio');
  const [modal,setModal]=useState(null);
  const [viejo,setViejo]=useState(()=>{ try{ return !!localStorage.getItem(OLD_KEY)&&!localStorage.getItem(OLD_KEY+'-respaldado'); }catch(e){ return false; } });
  const setDb=d=>setDbRaw(d);
  const save=d=>setDbRaw(autoRegistrar(d));
  useEffect(()=>{ try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(db)); }catch(e){} },[db]);
  useEffect(()=>{ const t=setInterval(()=>setDbRaw(d=>autoRegistrar(d)),60*60*1000); const v=()=>{ if(document.visibilityState==='visible') setDbRaw(d=>autoRegistrar(d)); }; document.addEventListener('visibilitychange',v); return ()=>{clearInterval(t);document.removeEventListener('visibilitychange',v);}; },[]);
  useEffect(()=>{ window.scrollTo(0,0); },[tab]);
  const abrir=(tipo,props={})=>setModal({tipo,props});
  const cerrar=()=>setModal(null);
  const mp={db,save,onClose:cerrar,...(modal?.props||{})};
  const respaldoViejo=()=>{ try{ const raw=localStorage.getItem(OLD_KEY); const b=new Blob([raw],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`finanzas_version_anterior_${hoyStr()}.json`; document.body.appendChild(a); a.click(); a.remove(); localStorage.setItem(OLD_KEY+'-respaldado','1'); }catch(e){} setViejo(false); };
  return <div className="app">
    <div className="top"><h1>Mis finanzas</h1><span className="fecha">{fL(hoyStr())}</span></div>
    {viejo&&<div className="alert i"><div className="h">Datos de la versión anterior</div><div className="b">Esta versión arranca limpia desde el 20/10. Descargá el respaldo de los datos viejos por si alguna vez los necesitás.</div><div className="btns" style={{marginTop:8}}><button className="btn sm" onClick={respaldoViejo}>Descargar respaldo</button><button className="btn sm ghost" onClick={()=>{try{localStorage.setItem(OLD_KEY+'-respaldado','1');}catch(e){} setViejo(false);}}>No hace falta</button></div></div>}
    {tab==='inicio'&&<Inicio db={db} save={save} abrir={abrir} />}
    {tab==='movs'&&<Movimientos db={db} save={save} abrir={abrir} />}
    {tab==='tarjetas'&&<Tarjetas db={db} save={save} abrir={abrir} />}
    {tab==='cash'&&<Cashflow db={db} />}
    {tab==='rec'&&<Recurrentes db={db} save={save} abrir={abrir} />}
    {tab==='config'&&<Config db={db} save={save} abrir={abrir} setDb={d=>setDbRaw(autoRegistrar(d))} />}
    {modal?.tipo==='gasto'&&<FormGasto {...mp} />}
    {modal?.tipo==='ingreso'&&<FormIngreso {...mp} />}
    {modal?.tipo==='transfer'&&<FormTransfer {...mp} />}
    {modal?.tipo==='ahorro'&&<FormAhorro {...mp} />}
    {modal?.tipo==='pagarRec'&&<FormPagarRec {...mp} />}
    {modal?.tipo==='moverCobro'&&<FormMoverCobro {...mp} />}
    {modal?.tipo==='confirmar'&&<FormConfirmar {...mp} />}
    {modal?.tipo==='pagarResumen'&&<FormPagarResumen {...mp} />}
    {modal?.tipo==='pagoUnico'&&<FormPagoUnico {...mp} e={modal.props.inicial} />}
    {modal?.tipo==='esperado'&&<FormEsperado {...mp} />}
    {modal?.tipo==='rec'&&<FormRec {...mp} />}
    {modal?.tipo==='ajuste'&&<FormAjuste {...mp} />}
    <nav className="nav"><div className="in">{TABS.map(([k,l,ic])=><button key={k} className={tab===k?'on':''} onClick={()=>setTab(k)} aria-current={tab===k?'page':undefined}><span className="ic">{ic}</span>{l}</button>)}</div></nav>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
