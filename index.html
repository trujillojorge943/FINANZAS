// ================= FECHAS =================
const pad = n => String(n).padStart(2,'0');

const pd = s => new Date(s+'T12:00:00');

const addM = (s,n) => { const d=pd(s); const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(day,last)); return ds(d); };
const dow = s => pd(s).getDay();
const diffD = (a,b) => Math.round((pd(b)-pd(a))/864e5);

// ================= MOTOR =================
const esTarjeta = (db,id) => db.tarjetas.some(t=>t.id===id);
const nombreMedio = (db,id) => (db.cuentas.find(c=>c.id===id)||db.tarjetas.find(t=>t.id===id)||{nombre:id}).nombre;
const esFeriado = (db,s) => (db.feriados||[]).includes(s);
const habilAntes = (db,s) => { let d=s; while(dow(d)===0||dow(d)===6||esFeriado(db,d)) d=addD(d,-1); return d; };
const montoVigente = (rec,fecha) => { const ms=[...(rec.montos||[])].sort((a,b)=>a.desde.localeCompare(b.desde)); let m=ms.length?ms[0].monto:0; ms.forEach(x=>{ if(x.desde<=fecha) m=x.monto; }); return m; };

// Fechas programadas de un recurrente entre a y b (inclusive)
function programadas(rec,a,b){
  const out=[];
  if(rec.frec==='semanal'||rec.frec==='quincenal'){
    let f=a; while(dow(f)!==5) f=addD(f,1);
    for(;f<=b;f=addD(f,7)){
      if(rec.frec==='quincenal'){ const w=Math.round(diffD(rec.ancla||a,f)/7); if(w%2!==0) continue; }
      out.push(f);
    }
  } else if(rec.frec==='mensual'){
    let m=a.slice(0,8)+'01';
    for(let k=0;k<24;k++){
      const venc=addM(m,k).slice(0,8)+pad(Math.min(rec.dia||10,28));
      if(venc>addD(b,40)) break;
      out.push(venc);
    }
  }
  return out;
}
// Fecha efectiva de pago de una programada
function fechaEfectiva(db,rec,prog){
  if(rec.frec==='mensual'){
    if(rec.pagoViernes){ return habilAntes(db,viernesDe(prog)); }
    return prog;
  }
  return habilAntes(db,prog);
}
function estimado(db,rec,fecha){
  if(rec.estim==='ultimo'){
    const hechos=Object.entries(db.ocurr).filter(([k,o])=>k.startsWith(rec.id+'|')&&o.estado==='hecho'&&o.monto).sort((x,y)=>x[0].localeCompare(y[0]));
    if(hechos.length) return hechos[hechos.length-1][1].monto;
  }
  return montoVigente(rec,fecha);
}
// Ocurrencias de recurrentes (no presupuestos) en [a,b], con estado
function ocurrencias(db,a,b){
  const out=[];
  db.recurrentes.filter(r=>r.activo!==false&&r.tipo!=='presupuesto').forEach(rec=>{
    programadas(rec,addD(a,-45),addD(b,10)).forEach(prog=>{
      if(prog<=db.fechaInicio && rec.frec!=='mensual') return;
      const key=rec.id+'|'+prog; const o=db.ocurr[key]||{};
      let fecha=o.fecha||fechaEfectiva(db,rec,prog);
      if(prog<db.fechaInicio && rec.frec==='mensual' && fecha<=db.fechaInicio) return;
      if(fecha<=db.fechaInicio && !o.estado) return;
      const monto=o.monto??estimado(db,rec,prog);
      let estado=o.estado||'pendiente', cobrado=0;
      if(rec.tipo==='ingreso'&&estado!=='omitido'){
        cobrado=db.movs.filter(m=>m.tipo==='ingreso'&&m.recKey===key).reduce((a,b)=>a+b.monto,0);
        estado=(o.cerrado||(o.estado==='hecho'&&o.movId&&db.movs.some(m=>m.id===o.movId))||cobrado>=monto-0.5)?'hecho':'pendiente';
      }
      out.push({key,rec,prog,fecha,monto,estado,ajustada:!!o.fecha,cobrado,resto:Math.max(0,monto-cobrado)});
    });
  });
  return out.filter(x=>x.fecha>=a&&x.fecha<=b);
}

// Resúmenes de una tarjeta (conocidos + estimados) hasta n
function resumenesDe(t,n=10){
  const rs=[...t.resumenes].sort((a,b)=>a.cierre.localeCompare(b.cierre));
  while(rs.length<n){ const l=rs[rs.length-1]; const c=addM(l.cierre,1), v=addM(l.vencimiento,1); rs.push({id:t.id+'-'+c, cierre:c, vencimiento:v, estimado:true}); }
  return rs;
}
// Items (cuotas) de cada tarjeta asignados a resúmenes
function itemsTarjeta(db,t,hasta){
  const rs=resumenesDe(t,14);
  const idx=f=>{ const i=rs.findIndex(r=>r.cierre>=f); return i<0?rs.length-1:i; };
  const items=[];
  db.consumos.filter(c=>c.tarjeta===t.id).forEach(c=>{
    const rest=(c.cuotas||1)-(c.cuotasPagadas||0); let i0=c.resumenInicial?rs.findIndex(r=>r.id===c.resumenInicial):-1; if(i0<0) i0=idx(c.fecha);
    for(let k=0;k<rest;k++){ const r=rs[i0+k]; if(!r) break;
      items.push({previo:!!c.previo, fechaCompra:c.fecha, desc:c.desc+((c.cuotas||1)>1?` (${(c.cuotasPagadas||0)+k+1}/${c.cuotas})`:''), monto:c.montoCuota, tercero:!!c.tercero, resumenId:r.id, consumoId:c.id, cat:c.cat, cuotaN:k, real:true});
    }
  });
  // recurrentes con tarjeta todavía no registrados
  ocurrencias(db,db.fechaInicio,hasta).filter(o=>o.rec.medio===t.id&&o.estado==='pendiente').forEach(o=>{
    const r=rs[idx(o.fecha)]; items.push({fechaCompra:o.fecha, desc:o.rec.nombre, monto:o.monto, resumenId:r.id, cat:o.rec.cat||'Otro', proyectado:true, key:o.key});
  });
  // ajustes de resúmenes confirmados y saldos impagos
  rs.forEach((r,i)=>{
    if(r.ajuste) items.push({fechaCompra:r.cierre, desc:'Ajuste al confirmar (impuestos, intereses, diferencias)', monto:r.ajuste, resumenId:r.id, ajuste:true});
    if(r.pagado && r.saldoImpago>0 && rs[i+1]) items.push({fechaCompra:r.vencimiento, desc:'Saldo impago del resumen anterior', monto:r.saldoImpago, resumenId:rs[i+1].id, arrastre:true});
  });
  return {rs,items};
}
function totalesResumen(items,rid){
  const it=items.filter(x=>x.resumenId===rid);
  return {propio:it.filter(x=>!x.tercero).reduce((a,b)=>a+b.monto,0), terceros:it.filter(x=>x.tercero).reduce((a,b)=>a+b.monto,0), items:it};
}

// Saldos reales
// Cajas de ahorro: valor = último valor cargado + aportes − retiros posteriores (o aportes netos si nunca se actualizó)
function estadoCaja(db,c){
  const ms=db.movs.filter(m=>m.caja===c.id&&(m.tipo==='aporte'||m.tipo==='retiro'));
  const neto=ms.reduce((a,m)=>a+(m.tipo==='aporte'?m.monto:-m.monto),0);
  const aportado=ms.filter(m=>m.tipo==='aporte').reduce((a,m)=>a+m.monto,0), retirado=ms.filter(m=>m.tipo==='retiro').reduce((a,m)=>a+m.monto,0);
  const valor=c.valor==null?neto:c.valor+ms.filter(m=>(m.ts||0)>(c.valorTs||0)).reduce((a,m)=>a+(m.tipo==='aporte'?m.monto:-m.monto),0);
  return {valor,neto,aportado,retirado,rendimiento:valor-neto,rendPct:neto>0?(valor-neto)/neto*100:0};
}
const nextTs = db => Math.max(Date.now(), ...db.movs.map(m=>m.ts||0), ...(db.cajas||[]).map(c=>c.valorTs||0)) + 1;
const totalCajas = db => (db.cajas||[]).reduce((a,c)=>a+estadoCaja(db,c).valor,0);
function aporteSugerido(db,c,fecha){
  const suel=db.recurrentes.find(r=>r.id==='sueldo');
  if(c.tipo==='jubilacion'){ const base=Math.round((suel?montoVigente(suel,fecha):0)*(c.pct||0)/100); return base+Math.min(c.reponer||0,base); }
  return c.montoSemanal||0;
}
function saldosReales(db,hasta){
  const s={}; const ah={};
  db.cuentas.forEach(c=>{ s[c.id]=c.saldoInicial; ah[c.id]=c.ahorroInicial||0; });
  db.movs.filter(m=>!hasta||m.fecha<=hasta).forEach(m=>{
    const mo=m.monto;
    if(m.tipo==='ingreso'){ s[m.cuenta]+=mo; if(m.ahorro) ah[m.cuenta]+=mo; }
    else if(m.tipo==='gasto'||m.tipo==='pagoResumen'){ s[m.cuenta]-=mo; }
    else if(m.tipo==='reintegro'){ s[m.cuenta]+=mo; }
    else if(m.tipo==='ajuste'){ s[m.cuenta]+=mo; }
    else if(m.tipo==='transfer'){ s[m.cuenta]-=mo; s[m.cuentaDestino]+=mo; if(m.ahorro){ ah[m.cuenta]-=mo; ah[m.cuentaDestino]+=mo; } }
    else if(m.tipo==='aporte'){ s[m.cuenta]-=mo; }
    else if(m.tipo==='retiro'){ s[m.cuenta]+=mo; }
  });
  return {s,ah};
}

// Gasto registrado por categorías en una semana (cuentas + tarjetas)
function gastadoSemana(db,cats,ini){
  const fin=addD(ini,6);
  const m=db.movs.filter(x=>x.tipo==='gasto'&&cats.includes(x.cat)&&x.fecha>=ini&&x.fecha<=fin).reduce((a,b)=>a+b.monto,0);
  const t=db.consumos.filter(x=>!x.tercero&&!x.previo&&cats.includes(x.cat)&&x.fecha>=ini&&x.fecha<=fin).reduce((a,b)=>a+b.montoCuota*((b.cuotas||1)-(b.cuotasPagadas||0)),0);
  return m+t;
}
const catsDe = (db,rec) => rec.usaCatsVarios ? db.catsVarios : (rec.cats||[]);
// Presupuesto semanal con compensación de excesos: devuelve mapa semana -> {base,descuento,presupuesto,gastado,exceso,sobrante}
function presupuestoSemanas(db,rec,hastaIni){
  const res={}; let carry=0; const hoyIni=viernesDe(hoyStr());
  for(let w=viernesDe(db.fechaInicio); w<=hastaIni; w=addD(w,7)){
    let base=montoVigente(rec,w);
    if(w<db.fechaInicio) base=Math.round(base*(diffD(db.fechaInicio,addD(w,6))+1)/7);
    const desc=rec.compensa?Math.min(carry,base*0.5):0; carry-=desc;
    const pres=base-desc;
    const gast=w<=hoyIni?gastadoSemana(db,catsDe(db,rec),w):0;
    const exceso=w<=hoyIni?Math.max(0,gast-pres):0;
    if(rec.compensa) carry+=exceso;
    res[w]={base,descuento:desc,presupuesto:pres,gastado:gast,exceso,sobrante:w<hoyIni?Math.max(0,pres-gast):0,pendienteCarry:carry};
  }
  return res;
}

const devuelto = (db,p) => db.movs.filter(m=>m.tipo==='ingreso'&&m.prestamoId===p.id).reduce((a,b)=>a+b.monto,0);
const pendientePrestamo = (db,p) => Math.max(0, p.monto - devuelto(db,p));
const totalTeDeben = db => (db.prestamos||[]).reduce((a,p)=>a+pendientePrestamo(db,p),0);

// ================= PROYECCIÓN =================
// Eventos futuros (desde hoy). Los vencidos sin registrar se ubican hoy.
function eventosFuturos(db,hasta){
  const hoy=hoyStr(); const ev=[]; const at=f=>f<hoy?hoy:f;
  // recurrentes (ingresos y gastos)
  ocurrencias(db,db.fechaInicio,hasta).filter(o=>o.estado==='pendiente').forEach(o=>{
    const f=at(o.fecha); if(f>hasta) return;
    if(o.rec.tipo==='ingreso') ev.push({fecha:f, tipo:'ingreso', cuenta:o.rec.medio, monto:o.resto, desc:o.rec.nombre+(o.cobrado?` (lo que falta del ${fC(o.prog)})`:o.ajustada?` (cobro movido del ${fC(o.prog)})`:` del ${fC(o.prog)}`), vencido:o.fecha<hoy, key:o.key, tentativo:o.fecha<hoy});
    else if(esTarjeta(db,o.rec.medio)) ev.push({fecha:f, tipo:'compraTarjeta', tarjeta:o.rec.medio, monto:o.monto, desc:o.rec.nombre+' ('+nombreMedio(db,o.rec.medio)+')', key:o.key});
    else ev.push({fecha:f, tipo:'gasto', grupo:o.rec.grupo==='vivienda'?'vivienda':'fijo', cuenta:o.rec.medio, monto:o.monto, desc:o.rec.nombre+(o.rec.frec==='mensual'?` (vence ${fC(o.prog)})`:''), vencido:o.fecha<hoy, key:o.key, estimado:o.rec.estim==='ultimo'});
  });
  // esperados
  db.esperados.filter(e=>!e.hecho).forEach(e=>{
    const f=at(e.fecha); if(f>hasta) return;
    if(e.tipo==='ingreso'){ ev.push({fecha:f, tipo:'ingreso', cuenta:e.cuenta, monto:e.monto, desc:e.desc, tentativo:e.tentativo, vencido:e.fecha<hoy, esperado:e.id});
      if(e.ahorro) ev.push({fecha:f, tipo:'aporte', caja:'ahorro', cuenta:e.cuenta, monto:e.monto, desc:`Aporte al ahorro (${e.desc})`, tentativo:true}); }
    else ev.push({fecha:f, tipo:'gasto', grupo:'unico', cuenta:e.cuenta, monto:e.monto, desc:e.desc, tentativo:e.tentativo, vencido:e.fecha<hoy, esperado:e.id});
  });
  // devoluciones de préstamos con fecha prevista
  (db.prestamos||[]).forEach(p=>{ const pen=pendientePrestamo(db,p); if(pen<=0||!p.fechaDevolucion) return; const f=at(p.fechaDevolucion); if(f>hasta) return;
    ev.push({fecha:f, tipo:'ingreso', cuenta:p.cuenta, monto:pen, desc:`Devolución de ${p.persona}`, tentativo:true, vencido:p.fechaDevolucion<hoy, prestamo:p.id}); });
  // presupuestos (lo que falta gastar de la semana actual + semanas futuras)
  const hoyIni=viernesDe(hoy);
  db.recurrentes.filter(r=>r.tipo==='presupuesto'&&r.activo!==false).forEach(rec=>{
    const ps=presupuestoSemanas(db,rec,viernesDe(hasta));
    Object.entries(ps).forEach(([w,p])=>{
      if(w<hoyIni) return;
      const resto=w===hoyIni?Math.max(0,p.presupuesto-p.gastado):p.presupuesto;
      const f=w===hoyIni?hoy:w;
      if(resto>0&&f<=hasta) ev.push({fecha:f, tipo:'gasto', grupo:'presupuesto', cuenta:rec.medio, monto:resto, desc:`${rec.nombre}${w===hoyIni?' (lo que queda de la semana)':''}${p.descuento?` — compensa ${$(p.descuento)}`:''}`, estimado:true});
    });
  });
  // aportes semanales previstos a las cajas
  (db.cajas||[]).forEach(c=>{
    for(let w=viernesDe(hoy); w<=viernesDe(hasta); w=addD(w,7)){
      if(db.movs.some(m=>m.tipo==='aporte'&&m.caja===c.id&&m.fecha>=w&&m.fecha<=addD(w,6))) continue;
      if((db.decisiones||{})[`aporte|${c.id}|${w}`]) continue;
      const monto=aporteSugerido(db,c,w); if(monto<=0) continue;
      const f=w<hoy?hoy:w; if(f>hasta) continue;
      ev.push({fecha:f, tipo:'aporte', caja:c.id, cuenta:c.cuentaAporte||'bbva', monto, desc:`Aporte a ${c.nombre}`, tentativo:true});
    }
  });
  // pagos de resúmenes (parte propia)
  db.tarjetas.forEach(t=>{
    const {rs,items}=itemsTarjeta(db,t,hasta);
    rs.filter(r=>!r.pagado).forEach(r=>{
      const f=at(r.vencimiento); if(f>hasta) return;
      const tot=totalesResumen(items,r.id).propio; if(tot<=0) return;
      ev.push({fecha:f, tipo:'pagoResumen', cuenta:t.cuentaPago, tarjeta:t.id, resumenId:r.id, monto:tot, desc:`Resumen ${t.nombre} (vence ${fC(r.vencimiento)})`, estimado:r.estimado||!r.confirmado, vencido:r.vencimiento<hoy});
    });
  });
  return ev.sort((a,b)=>a.fecha.localeCompare(b.fecha));
}

function deudaTarjetas(db,D,hasta){
  const hoy=hoyStr(); let total=0; const por={};
  db.tarjetas.forEach(t=>{
    const {rs,items}=itemsTarjeta(db,t,hasta||addD(D,1));
    const pagado=id=>{ const r=rs.find(x=>x.id===id); if(!r) return false; if(r.pagado) return (r.fechaPago||r.vencimiento)<=D; return D>=hoy && (r.vencimiento<hoy?hoy:r.vencimiento)<=D; };
    const v=items.filter(x=>!x.tercero&&x.fechaCompra<=D&&!pagado(x.resumenId)).reduce((a,b)=>a+b.monto,0);
    por[t.id]=v; total+=v;
  });
  return {total,por};
}

function cashflow(db,nSem=12){
  const hoy=hoyStr(); const ini=viernesDe(hoy);
  const sems=Array.from({length:nSem},(_,i)=>{const a=addD(ini,i*7);return {a,b:addD(a,6)};});
  const hasta=sems[nSem-1].b;
  const fut=eventosFuturos(db,hasta);
  const real=saldosReales(db,hoy);
  const realTotal=Object.values(real.s).reduce((a,b)=>a+b,0);
  const ahorroReal=Object.values(real.ah).reduce((a,b)=>a+b,0);
  const cols=sems.map((w,i)=>{
    const enW=f=>f>=w.a&&f<=w.b;
    const det={ingresos:[],vivienda:[],fijos:[],unicos:[],presup:[],tarjeta:[],gastosReales:[],prestamos:[],pagos:[],aportes:[]};
    // reales de la semana (hasta hoy)
    db.movs.filter(m=>enW(m.fecha)&&m.fecha<=hoy).forEach(m=>{
      if(m.tipo==='ingreso') det.ingresos.push({fecha:m.fecha,desc:m.desc+(m.ahorro?' (ahorro)':''),monto:m.monto,real:true,cuenta:m.cuenta});
      if(m.tipo==='gasto'&&m.prestamoId) det.prestamos.push({fecha:m.fecha,desc:m.desc,monto:m.monto,real:true,cuenta:m.cuenta});
      else if(m.tipo==='gasto') det.gastosReales.push({fecha:m.fecha,desc:m.desc,monto:m.monto,real:true,cuenta:m.cuenta});
      if(m.tipo==='aporte') det.aportes.push({fecha:m.fecha,desc:`${m.desc||'Aporte'} → ${(db.cajas.find(c=>c.id===m.caja)||{}).nombre||''}`,monto:m.monto,real:true,cuenta:m.cuenta});
      if(m.tipo==='retiro') det.aportes.push({fecha:m.fecha,desc:`Retiro de ${(db.cajas.find(c=>c.id===m.caja)||{}).nombre||''}${m.motivo?` (${m.motivo})`:''}`,monto:-m.monto,real:true,cuenta:m.cuenta});
      if(m.tipo==='pagoResumen') det.pagos.push({fecha:m.fecha,desc:m.desc,monto:m.montoPropio??m.monto,real:true,cuenta:m.cuenta});
      if(m.tipo==='ajuste') (m.monto>=0?det.ingresos:det.gastosReales).push({fecha:m.fecha,desc:m.desc,monto:Math.abs(m.monto),real:true,cuenta:m.cuenta});
    });
    // compras con tarjeta de la semana (reales: por fecha de compra)
    db.tarjetas.forEach(t=>{
      itemsTarjeta(db,t,hasta).items.filter(x=>!x.tercero&&!x.arrastre&&!x.proyectado&&!x.previo&&enW(x.fechaCompra)).forEach(x=>{
        det.tarjeta.push({fecha:x.fechaCompra,desc:`${x.desc} · ${t.nombre}`,monto:x.monto,real:x.fechaCompra<=hoy});
      });
    });
    // proyectados
    fut.filter(e=>enW(e.fecha)).forEach(e=>{
      const it={fecha:e.fecha,desc:e.desc,monto:e.monto,tentativo:e.tentativo,estimado:e.estimado,vencido:e.vencido,cuenta:e.cuenta};
      if(e.tipo==='ingreso') det.ingresos.push(it);
      else if(e.tipo==='compraTarjeta') det.tarjeta.push(it);
      else if(e.tipo==='aporte') det.aportes.push(it);
      else if(e.tipo==='pagoResumen') det.pagos.push(it);
      else if(e.grupo==='vivienda') det.vivienda.push(it);
      else if(e.grupo==='unico') det.unicos.push(it);
      else if(e.grupo==='presupuesto') det.presup.push(it);
      else det.fijos.push(it);
    });
    const S=a=>a.reduce((x,y)=>x+y.monto,0);
    const ingresos=S(det.ingresos), egresos=S(det.vivienda)+S(det.fijos)+S(det.unicos)+S(det.presup)+S(det.gastosReales)+S(det.prestamos)+S(det.tarjeta);
    const balance=ingresos-egresos;
    // proyectado por cuenta al cierre de la semana
    const porCuenta={...real.s};
    fut.filter(e=>e.fecha<=w.b).forEach(e=>{
      if(!e.cuenta||porCuenta[e.cuenta]===undefined) return;
      if(e.tipo==='ingreso') porCuenta[e.cuenta]+=e.monto; else if(e.tipo!=='compraTarjeta') porCuenta[e.cuenta]-=e.monto;
    });
    const proyectado=Object.values(porCuenta).reduce((a,b)=>a+b,0);
    const porCaja=Object.fromEntries((db.cajas||[]).map(c=>[c.id,estadoCaja(db,c).valor+fut.filter(e=>e.tipo==='aporte'&&e.caja===c.id&&e.fecha<=w.b).reduce((a,b)=>a+b.monto,0)]));
    const ahorro=Object.values(porCaja).reduce((a,b)=>a+b,0);
    const deuda=deudaTarjetas(db,w.b,hasta);
    return {...w,i,det,ingresos,egresos,balance,proyectado,porCuenta,porCaja,deuda,ahorro,aportes:S(det.aportes),pagosResumen:S(det.pagos),real:i===0?realTotal:null};
  });
  return {cols,real,realTotal,ahorroReal,fut};
}

// Saldo proyectado de una cuenta justo antes de una fecha (sin contar un evento)
function saldoCuentaAntes(db,cuenta,fecha,excluirResumen){
  const hoy=hoyStr(); const real=saldosReales(db,hoy).s[cuenta]||0;
  return real+eventosFuturos(db,fecha).filter(e=>e.cuenta===cuenta&&e.fecha<=fecha&&e.resumenId!==excluirResumen).reduce((a,e)=>a+(e.tipo==='ingreso'?e.monto:(e.tipo==='compraTarjeta'?0:-e.monto)),0);
}

function MontoInput({value,onChange,autoFocus}){ return <input inputMode="decimal" value={value} autoFocus={autoFocus} onChange={e=>onChange(e.target.value)} placeholder="0" />; }
function SelMedio({db,value,onChange,soloCuentas}){
  return <select value={value} onChange={e=>onChange(e.target.value)}>
    <optgroup label="Cuentas">{db.cuentas.map(c=><option key={c.id} value={c.id}>{c.nombre}</option>)}</optgroup>
    {!soloCuentas&&<optgroup label="Tarjetas de crédito">{db.tarjetas.map(t=><option key={t.id} value={t.id}>{t.nombre} (crédito)</option>)}</optgroup>}
  </select>;
}
function Bar({label,usado,tope,nota}){
  const pct=tope>0?usado/tope:0; const col=pct>1?'var(--neg)':pct>=.75?'var(--warn)':'var(--pos)';
  return <div style={{marginBottom:14}}>
    <div className="barline"><b style={{color:'var(--ink)'}}>{label}</b><span>{$(usado)} de {$(tope)}</span></div>
    <div className="bar" role="progressbar" aria-valuenow={Math.round(pct*100)} aria-valuemin="0" aria-valuemax="100"><span style={{width:Math.min(100,pct*100)+'%',background:col}}></span></div>
    <div className="barline"><span>{nota}</span><span style={{color:col,fontWeight:700}}>{usado>tope?`Te pasaste ${$(usado-tope)}`:`Quedan ${$(tope-usado)}`}</span></div>
  </div>;
}

// ================= FORMULARIOS =================
function FormGasto({db,save,onClose,inicial,abrir}){
  const ed=inicial||{};
  const [v,setV]=useState({monto:ed.monto??'',desc:ed.desc||'',cat:ed.cat||'PedidosYa',medio:ed.medio||'bbva',cuotas:ed.cuotas||1,fecha:ed.fecha||hoyStr(),tercero:!!ed.tercero});
  const tarjeta=esTarjeta(db,v.medio);
  const ok=()=>{
    const m=num(v.monto); if(m<=0) return;
    let d={...db};
    if(ed.kind==='mov') d.movs=d.movs.filter(x=>x.id!==ed.id);
    if(ed.kind==='consumo') d.consumos=d.consumos.filter(x=>x.id!==ed.id);
    if(tarjeta){ const c=Math.max(1,parseInt(v.cuotas)||1); d.consumos=[...d.consumos,{id:ed.kind==='consumo'?ed.id:uid(),tarjeta:v.medio,fecha:v.fecha,desc:v.desc||v.cat,cat:v.cat,montoCuota:Math.round(m/c*100)/100,cuotas:c,cuotasPagadas:0,tercero:v.tercero}]; }
    else d.movs=[...d.movs,{id:ed.kind==='mov'?ed.id:uid(),fecha:v.fecha,tipo:'gasto',monto:m,cuenta:v.medio,desc:v.desc||v.cat,cat:v.cat}];
    save(d); onClose();
  };
  return <Sheet title={ed.id?'Editar egreso':'Registrar egreso'} onClose={onClose}><div className="form">
    {!ed.id&&abrir&&<button className="btn sm" style={{justifySelf:'start'}} onClick={()=>abrir('prestamo')}>¿Prestaste plata? Registrala como préstamo</button>}
    <F label="Monto total"><MontoInput value={v.monto} onChange={x=>setV({...v,monto:x})} autoFocus /></F>
    <F label="Pagado con"><SelMedio db={db} value={v.medio} onChange={x=>setV({...v,medio:x})} /></F>
    {tarjeta&&<div className="two">
      <F label="Cuotas"><input inputMode="numeric" value={v.cuotas} onChange={e=>setV({...v,cuotas:e.target.value})} /></F>
      <F label="Valor de cada cuota"><input disabled value={$(num(v.monto)/Math.max(1,parseInt(v.cuotas)||1))} /></F>
    </div>}
    <F label="Categoría"><select value={v.cat} onChange={e=>setV({...v,cat:e.target.value})}>
      <optgroup label="Gastos varios (cuentan en la barra semanal)">{db.catsVarios.map(c=><option key={c}>{c}</option>)}</optgroup>
      <optgroup label="Otras">{db.catsOtras.map(c=><option key={c}>{c}</option>)}</optgroup></select></F>
    <F label="Detalle (opcional)"><input value={v.desc} onChange={e=>setV({...v,desc:e.target.value})} placeholder="Ej: PedidosYa pizza" /></F>
    <F label="Fecha"><input type="date" value={v.fecha} onChange={e=>setV({...v,fecha:e.target.value})} /></F>
    {tarjeta&&<label className="check"><input type="checkbox" checked={v.tercero} onChange={e=>setV({...v,tercero:e.target.checked})} /> Lo paga otra persona (no cuenta como egreso mío)</label>}
    <div className="btns"><button className="btn pri" onClick={ok}>Guardar egreso</button>
      {ed.id&&<button className="btn danger" onClick={()=>{let d={...db}; if(ed.kind==='mov') d.movs=d.movs.filter(x=>x.id!==ed.id); else d.consumos=d.consumos.filter(x=>x.id!==ed.id); save(d); onClose();}}>Eliminar</button>}</div>
  </div></Sheet>;
}

function FormPrestamo({db,save,onClose,p}){
  const ed=p||{};
  const [v,setV]=useState({persona:ed.persona||'',monto:ed.monto??'',cuenta:ed.cuenta||'bbva',fecha:ed.fecha||hoyStr(),fechaDevolucion:ed.fechaDevolucion||'',nota:ed.nota||''});
  const personas=[...new Set((db.prestamos||[]).map(x=>x.persona))];
  const ok=()=>{ const m=num(v.monto); if(m<=0||!v.persona.trim()) return;
    const id=ed.id||uid(); const movId=ed.movId||uid(); const persona=v.persona.trim();
    const mov={id:movId,fecha:v.fecha,tipo:'gasto',monto:m,cuenta:v.cuenta,desc:`Préstamo a ${persona}`,cat:'Préstamo',prestamoId:id};
    const pr={id,persona,monto:m,cuenta:v.cuenta,fecha:v.fecha,fechaDevolucion:v.fechaDevolucion,nota:v.nota,movId};
    save({...db,movs:[...db.movs.filter(x=>x.id!==movId),mov],prestamos:[...(db.prestamos||[]).filter(x=>x.id!==id),pr]}); onClose(); };
  const borrar=()=>{ if(!confirm('¿Eliminar el préstamo y sus devoluciones?')) return; save({...db,movs:db.movs.filter(x=>x.prestamoId!==ed.id),prestamos:db.prestamos.filter(x=>x.id!==ed.id)}); onClose(); };
  return <Sheet title={ed.id?`Préstamo a ${ed.persona}`:'Prestar plata'} onClose={onClose}><div className="form">
    <F label="¿A quién?"><input list="personas-prestamo" value={v.persona} onChange={e=>setV({...v,persona:e.target.value})} placeholder="Nombre" autoFocus={!ed.id} />
      <datalist id="personas-prestamo">{personas.map(x=><option key={x} value={x} />)}</datalist></F>
    <F label="Monto"><MontoInput value={v.monto} onChange={x=>setV({...v,monto:x})} /></F>
    <F label="Sale de"><SelMedio db={db} soloCuentas value={v.cuenta} onChange={x=>setV({...v,cuenta:x})} /></F>
    <div className="two"><F label="Fecha"><input type="date" value={v.fecha} onChange={e=>setV({...v,fecha:e.target.value})} /></F>
      <F label="Me lo devuelve (opcional)"><input type="date" value={v.fechaDevolucion} onChange={e=>setV({...v,fechaDevolucion:e.target.value})} /></F></div>
    <F label="Nota (opcional)"><input value={v.nota} onChange={e=>setV({...v,nota:e.target.value})} placeholder="Ej: para el arreglo del auto" /></F>
    <div className="muted">Cuenta como egreso esta semana. Si cargás fecha de devolución, aparece en el cashflow como ingreso previsto.</div>
    <div className="btns"><button className="btn pri" onClick={ok}>{ed.id?'Guardar cambios':'Registrar préstamo'}</button>{ed.id&&<button className="btn danger" onClick={borrar}>Eliminar</button>}</div>
  </div></Sheet>;
}
function FormDevolucion({db,save,onClose,p}){
  const pen=pendientePrestamo(db,p);
  const [v,setV]=useState({monto:Math.round(pen),cuenta:p.cuenta,fecha:hoyStr()});
  const ok=()=>{ const m=num(v.monto); if(m<=0) return;
    save({...db,movs:[...db.movs,{id:uid(),fecha:v.fecha,tipo:'ingreso',subtipo:'Devolución de préstamo',monto:m,cuenta:v.cuenta,desc:`Devolución de ${p.persona}`,prestamoId:p.id}]}); onClose(); };
  return <Sheet title={`Devolución de ${p.persona}`} onClose={onClose}><div className="form">
    <div className="muted">Le prestaste {$(p.monto)} el {fL(p.fecha)}. Pendiente: {$(pen)}.</div>
    <F label="Monto devuelto"><MontoInput value={v.monto} onChange={x=>setV({...v,monto:x})} autoFocus /></F>
    <F label="Entró en"><SelMedio db={db} soloCuentas value={v.cuenta} onChange={x=>setV({...v,cuenta:x})} /></F>
    <F label="Fecha"><input type="date" value={v.fecha} onChange={e=>setV({...v,fecha:e.target.value})} /></F>
    <div className="muted">Si te devuelve en partes, cargá cada parte cuando llegue.</div>
    <button className="btn pri" onClick={ok}>Registrar devolución</button>
  </div></Sheet>;
}
function Prestamos({db,abrir,todos}){
  const lista=(db.prestamos||[]).map(p=>({...p,pen:pendientePrestamo(db,p),dev:devuelto(db,p)})).filter(p=>todos||p.pen>0).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  if(!lista.length&&!todos) return null;
  const tot=lista.reduce((a,p)=>a+p.pen,0);
  return <div className="card"><h2>Préstamos <span className="muted">te deben {$(tot)}</span></h2>
    {lista.map(p=><div className="row" key={p.id}>
      <div className="l" style={{cursor:'pointer'}} onClick={()=>abrir('prestamo',{p})}><div className="t">{p.persona}</div>
        <div className="s">Prestado {$(p.monto)} el {fC(p.fecha)}{p.dev?` · devolvió ${$(p.dev)}`:''}{p.fechaDevolucion&&p.pen>0?` · devuelve ${fC(p.fechaDevolucion)}`:''}{p.fechaDevolucion&&p.pen>0&&p.fechaDevolucion<hoyStr()?' (atrasado)':''}</div></div>
      {p.pen>0?<><span className="amt">{$(p.pen)}</span><button className="btn sm" onClick={()=>abrir('devolucion',{p})}>Devolvió</button></>:<span className="chip" style={{background:'var(--pos-bg)',color:'var(--pos)'}}>saldado</span>}
    </div>)}
    {!lista.length&&<div className="empty">No prestaste plata todavía.</div>}
    <button className="btn sm" style={{marginTop:8}} onClick={()=>abrir('prestamo')}>+ Prestar plata</button>
  </div>;
}

const TIPOS_ING=['Sueldo','Bono laboral','Aguinaldo','Evento musical','Ingreso extra'];
const sueldosAbiertos = (db,extra) => ocurrencias(db,db.fechaInicio,addD(hoyStr(),42)).filter(o=>o.rec.tipo==='ingreso'&&(o.estado==='pendiente'||o.key===extra));
function quitarCierre(d,key){ if(!key||!d.ocurr[key]) return d; const x={...d.ocurr[key]}; delete x.estado; delete x.movId; delete x.cerrado; return {...d,ocurr:{...d.ocurr,[key]:x}}; }

function FormIngreso({db,save,onClose,inicial}){
  const ed=inicial||{};
  const abiertos=sueldosAbiertos(db,ed.recKey);
  const defKey=ed.recKey||(abiertos.find(o=>o.fecha>=addD(hoyStr(),-6))||abiertos[0]||{}).key||'';
  const [v,setV]=useState({monto:ed.monto??'',subtipo:ed.subtipo||'Evento musical',desc:ed.desc||'',cuenta:ed.cuenta||'bbva',caja:ed.ahorro?'ahorro':'',fecha:ed.fecha||hoyStr(),recKey:defKey,cerrar:false});
  const oc=v.subtipo==='Sueldo'?abiertos.find(o=>o.key===v.recKey):null;
  const restoOc=oc?oc.resto+(ed.id&&ed.recKey===oc.key?(ed.monto||0):0):0;
  const ok=()=>{ const m=num(v.monto); if(m<=0) return;
    if(v.subtipo==='Sueldo'&&abiertos.length&&!v.recKey) return alert('Elegí a qué viernes corresponde el sueldo.');
    const recKey=v.subtipo==='Sueldo'?(v.recKey||undefined):undefined;
    const mov={id:ed.id||uid(),fecha:v.fecha,tipo:'ingreso',subtipo:v.subtipo,monto:m,cuenta:v.cuenta,desc:v.desc||v.subtipo,recKey};
    let d={...db,movs:[...db.movs.filter(x=>x.id!==ed.id),mov]};
    if(v.caja&&!ed.id){ d.movs=[...d.movs,{id:uid(),ts:nextTs(db),fecha:v.fecha,tipo:'aporte',caja:v.caja,cuenta:v.cuenta,monto:m,desc:`Aporte desde ${v.desc||v.subtipo}`}]; }
    if(ed.recKey&&ed.recKey!==recKey) d=quitarCierre(d,ed.recKey);
    if(recKey&&v.cerrar) d.ocurr={...d.ocurr,[recKey]:{...(d.ocurr[recKey]||{}),cerrado:true}};
    if(ed.esperado) d.esperados=d.esperados.map(e=>e.id===ed.esperado?{...e,hecho:true,movId:mov.id}:e);
    save(d); onClose(); };
  return <Sheet title={ed.id?'Editar ingreso':'Registrar ingreso'} onClose={onClose}><div className="form">
    <F label="Tipo"><div className="seg">{TIPOS_ING.map(t=><button key={t} className={v.subtipo===t?'on':''} onClick={()=>setV({...v,subtipo:t,cuenta:t==='Sueldo'?(oc?.rec.medio||'bbva'):v.cuenta})}>{t}</button>)}</div></F>
    {v.subtipo==='Sueldo'&&<F label="¿De qué viernes es este sueldo?"><select value={v.recKey} onChange={e=>setV({...v,recKey:e.target.value})}>
      {!abiertos.length&&<option value="">Sin sueldos pendientes</option>}
      {abiertos.map(o=><option key={o.key} value={o.key}>Viernes {fC(o.prog)}{o.cobrado?` (falta ${$(o.resto)})`:` (${$(o.monto)})`}</option>)}</select></F>}
    <F label="Monto"><MontoInput value={v.monto} onChange={x=>setV({...v,monto:x})} autoFocus /></F>
    {oc&&num(v.monto)>0&&num(v.monto)<restoOc-0.5&&<div className="alert i"><div className="b" style={{marginBottom:6}}>Faltan {$(restoOc-num(v.monto))} de ese sueldo.</div>
      <label className="check"><input type="radio" checked={!v.cerrar} onChange={()=>setV({...v,cerrar:false})} /> Lo que falta lo cobro después</label>
      <label className="check"><input type="radio" checked={v.cerrar} onChange={()=>setV({...v,cerrar:true})} /> Doy este sueldo por cerrado</label></div>}
    <F label="Entra en"><SelMedio db={db} soloCuentas value={v.cuenta} onChange={x=>setV({...v,cuenta:x})} /></F>
    {!ed.id&&<F label="¿Va a alguna caja?"><select value={v.caja} onChange={e=>setV({...v,caja:e.target.value})}><option value="">No, queda disponible</option>{db.cajas.map(c=><option key={c.id} value={c.id}>Todo a {c.nombre}</option>)}</select></F>}
    <F label="Detalle (opcional)"><input value={v.desc} onChange={e=>setV({...v,desc:e.target.value})} placeholder={v.subtipo==='Sueldo'?'Ej: adelanto':'Ej: Acústico Bar Irlanda'} /></F>
    <F label="Fecha"><input type="date" value={v.fecha} onChange={e=>setV({...v,fecha:e.target.value})} /></F>
    <div className="btns"><button className="btn pri" onClick={ok}>Guardar ingreso</button>
      {ed.id&&<button className="btn danger" onClick={()=>{let d={...db,movs:db.movs.filter(x=>x.id!==ed.id)}; d=quitarCierre(d,ed.recKey); save(d); onClose();}}>Eliminar</button>}</div>
    {ed.recKey&&ed.id&&<div className="muted">Si lo eliminás, ese sueldo vuelve a quedar pendiente.</div>}
  </div></Sheet>;
}

function FormSueldo({db,save,onClose,oc,abrir}){
  const vivo=sueldosAbiertos(db,oc.key).find(o=>o.key===oc.key)||oc;
  const cobros=db.movs.filter(m=>m.tipo==='ingreso'&&m.recKey===oc.key);
  return <Sheet title={`Sueldo del ${fL(oc.prog)}`} onClose={onClose}><div className="form">
    <div className="row"><span className="l">Previsto</span><b>{$(vivo.monto)}{vivo.fecha!==vivo.prog?` · ${fL(vivo.fecha)}`:''}</b></div>
    {cobros.map(m=><div className="row" key={m.id}><span className="l">Cobrado el {fL(m.fecha)} en {nombreMedio(db,m.cuenta)}</span><span className="amt pos">+{$(m.monto)}</span></div>)}
    {vivo.estado==='pendiente'?<div className="row"><span className="l">Falta cobrar</span><b>{$(vivo.resto)}</b></div>:<div className="muted">Este sueldo está cerrado.</div>}
    <div className="btns" style={{marginTop:6}}>
      <button className="btn pri" onClick={()=>abrir('ingreso',{inicial:{subtipo:'Sueldo',recKey:oc.key,monto:Math.round(vivo.resto||vivo.monto),cuenta:oc.rec.medio,fecha:hoyStr()}})}>{vivo.fecha>hoyStr()?'Registrar adelanto':'Registrar cobro'}</button>
      <button className="btn" onClick={()=>abrir('moverCobro',{oc:vivo})}>Cambiar fecha o monto previsto</button>
      {vivo.estado==='pendiente'&&vivo.cobrado>0&&<button className="btn" onClick={()=>{save({...db,ocurr:{...db.ocurr,[oc.key]:{...(db.ocurr[oc.key]||{}),cerrado:true}}});onClose();}}>Dar por cerrado</button>}
      {vivo.estado==='pendiente'&&!vivo.cobrado&&<button className="btn danger" onClick={()=>{if(confirm('¿Este viernes no hay sueldo?')){save({...db,ocurr:{...db.ocurr,[oc.key]:{estado:'omitido'}}});onClose();}}}>Este viernes no cobro</button>}
    </div>
  </div></Sheet>;
}

function FormTransfer({db,save,onClose}){
  const [v,setV]=useState({monto:'',de:'nx',a:'bbva',fecha:hoyStr(),ahorro:false});
  const ok=()=>{ const m=num(v.monto); if(m<=0||v.de===v.a) return; save({...db,movs:[...db.movs,{id:uid(),fecha:v.fecha,tipo:'transfer',monto:m,cuenta:v.de,cuentaDestino:v.a,ahorro:v.ahorro,desc:`Transferencia ${nombreMedio(db,v.de)} → ${nombreMedio(db,v.a)}`}]}); onClose(); };
  return <Sheet title="Transferir entre cuentas" onClose={onClose}><div className="form">
    <F label="Monto"><MontoInput value={v.monto} onChange={x=>setV({...v,monto:x})} autoFocus /></F>
    <div className="two"><F label="Desde"><SelMedio db={db} soloCuentas value={v.de} onChange={x=>setV({...v,de:x})} /></F>
      <F label="Hacia"><SelMedio db={db} soloCuentas value={v.a} onChange={x=>setV({...v,a:x})} /></F></div>

    <F label="Fecha"><input type="date" value={v.fecha} onChange={e=>setV({...v,fecha:e.target.value})} /></F>
    <div className="muted">Las transferencias no cuentan como ingreso ni como egreso.</div>
    <button className="btn pri" onClick={ok}>Transferir</button>
  </div></Sheet>;
}

function FormCaja({db,save,onClose,cajaId,accion:acc0,monto:monto0,desc:desc0,semana}){
  const [cid,setCid]=useState(cajaId||'ahorro');
  const c=(db.cajas||[]).find(x=>x.id===cid)||db.cajas[0];
  const st=estadoCaja(db,c);
  const sug=aporteSugerido(db,c,hoyStr());
  const [v,setV]=useState({accion:acc0||'aportar',monto:monto0??(sug||''),cuenta:c.cuentaAporte||'bbva',fecha:hoyStr(),motivo:'',reponer:false,valor:Math.round(st.valor),nombre:c.nombre});
  const jubi=c.tipo==='jubilacion';
  const updCaja=(d,patch)=>({...d,cajas:d.cajas.map(x=>x.id===c.id?{...x,...patch}:x)});
  const ok=()=>{
    let d={...db};
    if(v.nombre.trim()&&v.nombre.trim()!==c.nombre) d=updCaja(d,{nombre:v.nombre.trim()});
    const m=num(v.monto);
    if(v.accion==='aportar'){ if(m<=0) return;
      d.movs=[...d.movs,{id:uid(),ts:nextTs(db),fecha:v.fecha,tipo:'aporte',caja:c.id,cuenta:v.cuenta,monto:m,desc:desc0||`Aporte a ${v.nombre||c.nombre}`}];
      if(jubi&&(c.reponer||0)>0){ const base=aporteSugerido(db,{...c,reponer:0},v.fecha); d=updCaja(d,{reponer:Math.max(0,(c.reponer||0)-Math.max(0,m-base))}); }
      d=updCaja(d,{cuentaAporte:v.cuenta});
      if(semana) d.decisiones={...d.decisiones,['sobrante|'+semana]:'apartado'};
    } else if(v.accion==='retirar'){ if(m<=0) return;
      if(jubi&&!v.motivo.trim()) return alert('Contá para qué la sacás. Queda registrado en la caja.');
      if(m>st.valor+1&&!confirm('Es más de lo que hay en la caja. ¿Seguir igual?')) return;
      if(jubi&&!confirm(`Vas a sacar ${$(m)} de tu ${c.nombre}. Es plata para tu jubilación: ¿seguro?`)) return;
      d.movs=[...d.movs,{id:uid(),ts:nextTs(db),fecha:v.fecha,tipo:'retiro',caja:c.id,cuenta:v.cuenta,monto:m,motivo:v.motivo.trim(),desc:`Retiro de ${v.nombre||c.nombre}`}];
      if(jubi&&v.reponer) d=updCaja(d,{reponer:(c.reponer||0)+m});
    } else if(v.accion==='valor'){ d=updCaja(d,{valor:num(v.valor),valorTs:nextTs(db),valorFecha:hoyStr()}); }
    save(d); onClose(); };
  return <Sheet title={c.nombre} onClose={onClose}><div className="form">
    {!cajaId&&<div className="seg">{db.cajas.map(x=><button key={x.id} className={cid===x.id?'on':''} onClick={()=>{setCid(x.id); const sx=aporteSugerido(db,x,hoyStr()); setV({...v,nombre:x.nombre,monto:sx||'',valor:Math.round(estadoCaja(db,x).valor),cuenta:x.cuentaAporte||v.cuenta});}}>{x.nombre}</button>)}</div>}
    <div className="caja" style={{marginBottom:0}}>
      <div className="top2"><span className="muted">Valor actual</span><span className="val" style={{color:c.color}}>{$(st.valor)}</span></div>
      <div className="barline"><span>Aportado neto {$(st.neto)}</span><span className={st.rendimiento>=0?'pos':'neg'}>{st.rendimiento?`Rendimiento ${$s(st.rendimiento)} (${st.rendPct.toFixed(1)}%)`:''}</span></div>
      {st.retirado>0&&<div className="mini">Retiraste {$(st.retirado)} en total{jubi&&c.reponer>0?` · falta reponer ${$(c.reponer)}`:''}</div>}
    </div>

// ================= LECTOR DE RESÚMENES PDF =================
const MES_ABR={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,set:9,oct:10,nov:11,dic:12};
const nAR = s => { const v=parseFloat(String(s).replace(/\$/g,'').replace(/\s/g,'').replace(/\./g,'').replace(',','.')); return isNaN(v)?0:v; };
const padP = n => String(n).padStart(2,'0');
const limpiarTxt = s => s.replace(/\s([ÁÉÍÓÚÑáéíóúñ])\s/g,'$1').replace(/\s+/g,' ').trim();
async function lineasPDF(pdfjs,data){
  const pdf=await pdfjs.getDocument({data}).promise; const L=[];
  for(let p=1;p<=pdf.numPages;p++){ const tc=await (await pdf.getPage(p)).getTextContent();
    const its=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({x:i.transform[4],y:i.transform[5],s:i.str}));
    its.sort((a,b)=>b.y-a.y||a.x-b.x); const rows=[];
    its.forEach(it=>{ const r=rows.find(r=>Math.abs(r.y-it.y)<=3); if(r) r.items.push(it); else rows.push({y:it.y,items:[it]}); });
    rows.sort((a,b)=>b.y-a.y).forEach(r=>L.push(limpiarTxt(r.items.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' '))));
  }
  return L;
}
function detectarBanco(L){ const T=L.join(' ').toUpperCase(); if(T.includes('NARANJA')) return 'naranja'; if(T.includes('BBVA')) return 'bbva'; return null; }
const ES_CARGO = /IMPUESTO|SELLOS|IVA |IVA$|PERCEPCI|DB\.RG|CR\.RG|INTERES|COMISI|CARGO POR|MANTENIMIENTO DE CUENTA|PUNITORIO/i;

function parseBBVA(L){
  const T=L.join('\n'); const TU=T.toUpperCase();
  const reD=/(\d{2})-([A-Za-z]{3})-(\d{2})/g;
  const iso=(d,m,y)=>`20${y}-${padP(MES_ABR[m.toLowerCase()]||1)}-${d}`;
  const fechasTras=(re,n)=>{ const m=re.exec(TU); if(!m) return []; const sub=T.slice(m.index); const out=[]; let x; const r=new RegExp(reD.source,'g'); while((x=r.exec(sub))&&out.length<n) out.push(iso(x[1],x[2],x[3])); return out; };
  const [cierre,vencimiento]=fechasTras(/CIERRE ACTUAL/,2);
  const otros=fechasTras(/CIERRE ANTERIOR/,4); const proxCierre=otros[2], proxVenc=otros[3], cierreAnterior=otros[0];
  let pesos=null, usd=0; const reS=/SALDO ACTUAL\s+(-?[\d.]+,\d{2})(?:\s+(-?[\d.]+,\d{2}))?/g; let m; while((m=reS.exec(T))){ pesos=nAR(m[1]); usd=m[2]?nAR(m[2]):0; }
  const consumos=[]; const cargos=[];
  let sec=null;
  L.forEach(l=>{
    const lu=l.toUpperCase();
    if(/^SUS PAGOS/i.test(l)){ sec='p'; return; }
    if(/^CONSUMOS /i.test(l)){ sec='c'; return; }
    if(lu.startsWith('TOTAL CONSUMOS')){ sec=null; return; }
    if(lu.startsWith('IMPUESTOS, CARGOS')){ sec='i'; return; }
    if(lu.startsWith('SALDO ACTUAL')||lu.startsWith('LEGALES')){ sec=null; return; }
    const mm=l.match(/^(\d{2})-([A-Za-z]{3})-(\d{2})\s+(.*?)\s+(-?[\d.]+,\d{2})$/); if(!mm||!sec) return;
    const fecha=iso(mm[1],mm[2],mm[3]); let resto=mm[4]; const monto=nAR(mm[5]);
    if(sec==='p'){ if(!/SU PAGO/i.test(resto)) cargos.push({fecha,desc:resto,monto}); return; }
    if(sec==='i'){ cargos.push({fecha,desc:resto,monto}); return; }
    const esUSD=/USD/i.test(resto);
    resto=resto.replace(/\s\d{5,7}$/,'');
    let cuota=1,cuotas=1; const c=resto.match(/C\.(\d{2})\/(\d{2})/); if(c){ cuota=+c[1]; cuotas=+c[2]; resto=resto.replace(c[0],''); }
    resto=resto.replace(/\s*[A-Z]?\d*USD\s+[\d.,]+/i,'').replace(/\s+/g,' ').trim();
    consumos.push({fecha,desc:resto,monto,cuota,cuotas,usd:esUSD?monto:0});
  });
  // tipo de cambio: base del IVA de servicios digitales / consumos en dólares
  const usdCons=consumos.reduce((a,x)=>a+x.usd,0);
  const base=(T.match(/IVA RG 4240 21%\(\s*([\d.]+,?\d*)\s*\)/)||[])[1];
  const tc=base&&usdCons?nAR(base)/usdCons:null;
  consumos.forEach(x=>{ if(x.usd){ x.monto=tc?Math.round(x.usd*tc*100)/100:0; x.nota=`U$S ${String(x.usd).replace('.',',')}${tc?` (≈ $${Math.round(tc)} por dólar)`:''}`; } });
  const total=pesos===null?null:Math.round((pesos+(usd&&tc?usd*tc:0))*100)/100;
  return {banco:'bbva',cierre,vencimiento,proxCierre,proxVenc,cierreAnterior,total,totalPesos:pesos,totalUSD:usd,tipoCambio:tc,consumos,cargos};
}

function parseNaranja(L){
  const J=L.join(' ');
  const vm=J.match(/vence el (\d{2})\/(\d{2})\/(\d{2})/i);
  const anio=vm?2000+(+vm[3]):new Date().getFullYear();
  const vencimiento=vm?`20${vm[3]}-${vm[2]}-${vm[1]}`:null;
  const tm=J.match(/total a pagar es \$\s?([\d.]+,\d{2})/i);
  const cm=J.match(/resumen actual cerr.{1,2} el (\d{2})\/(\d{2})/i);
  const conAnio=(d,mo,ref)=>{ let y=anio; if(ref&&+mo>+ref.slice(5,7)+1) y=anio-1; return `${y}-${mo}-${d}`; };
  const cierre=cm?conAnio(cm[1],cm[2],vencimiento):null;
  const pm=J.match(/pr.ximo resumen cierra el (\d{2})\/(\d{2})/i);
  const pv=J.slice(pm?pm.index:0).match(/y vence el (\d{2})\/(\d{2})\./i);
  const ajY=(d,mo)=>{ let y=anio; if(cierre&&`${y}-${mo}-${d}`<cierre) y++; return `${y}-${mo}-${d}`; };
  const proxCierre=pm?ajY(pm[1],pm[2]):null, proxVenc=pv?ajY(pv[1],pv[2]):null;
  const am=J.match(/resumen anterior cerr.{1,2} el (\d{2})\/(\d{2})/i);
  const cierreAnterior=am?conAnio(am[1],am[2],cierre||vencimiento):null;
  const consumos=[]; const cargos=[];
  L.forEach(l=>{
    const mm=l.match(/^(\d{2})\/(\d{2})\/(\d{2})\s+(.*?)\s+(-?[\d.]+,\d{2})$/); if(!mm) return;
    const fecha=`20${mm[3]}-${mm[2]}-${mm[1]}`; let resto=mm[4]; const monto=nAR(mm[5]);
    if(/PAGO EN PESOS|PAGO EN D/i.test(resto)) return;
    if(resto.startsWith('*')){ cargos.push({fecha,desc:resto.replace(/^\*/,'').trim(),monto}); return; }
    resto=resto.replace(/^(NX Virtual|Naranja X|NX Visa|NX Master\w*|NX Amex)\s+\d+\s+/i,'');
    let cuota=1,cuotas=1, debito=false;
    const c=resto.match(/\s(\d{2})\/(\d{2})$/); if(c){ cuota=+c[1]; cuotas=+c[2]; resto=resto.slice(0,c.index); }
    else { const u=resto.match(/\s(\d{2}|Z\d?|Deb\.Aut\.)$/i); if(u){ debito=/Deb/i.test(u[1]); resto=resto.slice(0,u.index); } }
    consumos.push({fecha,desc:resto.trim(),monto,cuota,cuotas,debito});
  });
  // cargos sin fecha (IVA, sellos)
  const iv=J.match(/Base Imponible \$[\d.,]+\)\s+([\d.]+,\d{2})/i); if(iv) cargos.push({fecha:cierre,desc:'IVA',monto:nAR(iv[1])});
  const se=J.match(/Impuesto de Sellos\s+([\d.]+,\d{2})/i); if(se) cargos.push({fecha:cierre,desc:'Impuesto de sellos',monto:nAR(se[1])});
  return {banco:'naranja',cierre,vencimiento,proxCierre,proxVenc,cierreAnterior,total:tm?nAR(tm[1]):null,consumos,cargos};
}
function leerResumen(L){ const b=detectarBanco(L); if(b==='naranja') return parseNaranja(L); if(b==='bbva') return parseBBVA(L); return null; }
const palabras = s => (s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>=4&&!['PEDIDOSYA','PROPINA'].includes(w));
const simil = (a,b) => { const A=palabras(a), B=palabras(b); return A.some(w=>B.includes(w)); };
function sugerirCat(desc){ const d=(desc||'').toUpperCase();
  if(/PEDIDOSYA|PEDIDOS YA|RAPPI/.test(d)) return 'PedidosYa';
  if(/FARMAC/.test(d)) return 'Farmacia';
  if(/SPOTIFY|GOOGLE|NETFLIX|YOUTUBE|APPLE|DISNEY|HBO|MAX |PRIME|TINDER|CLARO|PERSONAL|MOVISTAR|TURBO/.test(d)) return 'Suscripciones';
  if(/TICKET|ENTRADA|CINE|TEATRO/.test(d)) return 'Salidas';
  if(/CARREFOUR|DISCO|VEA|CHANGOMAS|SUPER|DIA |COTO|JUMBO/.test(d)) return 'Supermercado';
  if(/YPF|SHELL|AXION|PUMA|VOLKSWAGEN|AUTO/.test(d)) return 'Auto';
  if(/MARATHON|ROPA|ZAPAT|NIKE|ADIDAS/.test(d)) return 'Ropa';
  return 'Otros varios'; }


let pdfjsCarga=null;
function cargarPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfjsCarga) return pdfjsCarga;
  pdfjsCarga=new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload=()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; res(window.pdfjsLib); };
    sc.onerror=()=>{ pdfjsCarga=null; rej(new Error('No se pudo cargar el lector de PDF. Revisá la conexión a internet.')); }; document.head.appendChild(sc); });
  return pdfjsCarga;
}
function materializar(d,t,item,monto,rid){ const id=uid();
  return {...d, consumos:[...d.consumos,{id,tarjeta:t.id,fecha:item.fechaCompra,desc:item.desc,cat:item.cat||'Suscripciones',montoCuota:monto,cuotas:1,cuotasPagadas:0,recKey:item.key,resumenInicial:rid}],
    ocurr:{...d.ocurr,[item.key]:{...(d.ocurr[item.key]||{}),estado:'hecho',monto,fecha:item.fechaCompra,consumoId:id}}}; }
function fijarSiguiente(d,t,sigId,cierre,venc){ if(!sigId||!cierre||!venc) return d;
  return {...d,tarjetas:d.tarjetas.map(x=>{ if(x.id!==t.id) return x; const ex=x.resumenes.find(y=>y.id===sigId);
    return {...x,resumenes:[...x.resumenes.filter(y=>y.id!==sigId),{...(ex||{}),id:sigId,cierre,vencimiento:venc}].sort((a,b)=>a.cierre.localeCompare(b.cierre))}; })}; }
// Compara el PDF con lo registrado en ese resumen
function conciliar(db,t,rid,pdf){
  const {items}=itemsTarjeta(db,t,addD(hoyStr(),200));
  const app=items.filter(x=>x.resumenId===rid&&!x.ajuste&&!x.arrastre);
  const usados=new Set(); const ok=[], nuevos=[];
  pdf.consumos.forEach(pc=>{
    let best=-1, sc=1e12;
    app.forEach((a,i)=>{ if(usados.has(i)) return;
      const tol=Math.max(2,pc.monto*0.02); const dm=Math.abs(a.monto-pc.monto); const parecido=simil(a.desc,pc.desc);
      if(dm>tol&&!(a.proyectado&&parecido&&dm<=pc.monto*0.25)) return;
      const dd=pc.cuotas>1||a.previo?0:Math.min(30,Math.abs(diffD(a.fechaCompra,pc.fecha)));
      const v=dm+dd*20-(parecido?300:0); if(v<sc){ sc=v; best=i; } });
    if(best>=0){ usados.add(best); ok.push({pc,a:app[best]}); }
    else nuevos.push({pc,cat:sugerirCat(pc.desc),incluir:true,tercero:false});
  });
  // cargos que en realidad son recurrentes previstos (ej. Plan Turbo)
  const cargos=[...pdf.cargos];
  app.forEach((a,i)=>{ if(usados.has(i)||!a.proyectado) return; const j=cargos.findIndex(c=>simil(c.desc,a.desc)||Math.abs(c.monto-a.monto)<=Math.max(2,a.monto*0.02)); if(j>=0){ usados.add(i); ok.push({pc:{...cargos[j],cuota:1,cuotas:1},a,deCargo:true}); cargos.splice(j,1); } });
  const faltan=app.map((a,i)=>({a,i})).filter(x=>!usados.has(x.i)).map(({a})=>({a,accion:a.proyectado?'omitir':(a.cuotaN||0)===0&&!a.previo?'mover':'dejar'}));
  return {ok,nuevos,faltan,cargos};
}

function FormResumenPDF({db,save,onClose,t}){
  const [estado,setEstado]=useState({paso:'elegir'});
  const fileRef=useRef();
  const hoy=hoyStr();
  const leer=async f=>{
    setEstado({paso:'leyendo'});
    try{ const lib=await cargarPdfJs(); const L=await lineasPDF(lib,new Uint8Array(await f.arrayBuffer())); const pdf=leerResumen(L);
      if(!pdf||!pdf.cierre) return setEstado({paso:'error',msg:'No reconocí el formato del resumen. Por ahora la app lee los de BBVA y Naranja X. Podés confirmarlo a mano con "Confirmar resumen".'});
      const esperado=t.id==='tnx'?'naranja':t.id==='tbbva'?'bbva':null;
      const {rs}=itemsTarjeta(db,t,addD(hoy,200));
      const r=[...rs].sort((a,b)=>Math.abs(diffD(a.cierre,pdf.cierre))-Math.abs(diffD(b.cierre,pdf.cierre)))[0];
      if(!r||Math.abs(diffD(r.cierre,pdf.cierre))>10) return setEstado({paso:'error',msg:`El resumen cierra el ${fL(pdf.cierre)} y no coincide con ningún período de esta tarjeta.`});
      if(r.pagado&&r.confirmado) return setEstado({paso:'error',msg:`Ese resumen (cierre ${fC(r.cierre)}) ya está confirmado y pagado.`});
      const conc=conciliar(db,t,r.id,pdf);
      const idx=rs.findIndex(x=>x.id===r.id);
      setEstado({paso:'revisar',pdf,r,conc,rs,sig:rs[idx+1],prevCierre:pdf.cierreAnterior||rs[idx-1]?.cierre||addD(pdf.cierre,-31),
        otroBanco:esperado&&pdf.banco!==esperado,
        v:{total:pdf.total!=null?String(pdf.total).replace('.',','):'',cierre:pdf.cierre,venc:pdf.vencimiento||r.vencimiento,sigCierre:pdf.proxCierre||'',sigVenc:pdf.proxVenc||''}});
    }catch(e){ setEstado({paso:'error',msg:e.message||'No se pudo leer el archivo.'}); }
  };
  if(estado.paso!=='revisar') return <Sheet title={`Cargar resumen ${t.nombre}`} onClose={onClose}><div className="form">
    {estado.paso==='elegir'&&<><div className="muted">Elegí el PDF del resumen que te llegó. Se lee en este dispositivo, no se sube a ningún lado.</div>
      <button className="btn pri" onClick={()=>fileRef.current.click()}>Elegir PDF</button>
      <input ref={fileRef} type="file" accept="application/pdf,.pdf" style={{display:'none'}} onChange={e=>{const f=e.target.files[0]; if(f) leer(f);}} /></>}
    {estado.paso==='leyendo'&&<div className="muted">Leyendo el resumen…</div>}
    {estado.paso==='error'&&<><div className="alert d"><div className="b">{estado.msg}</div></div><button className="btn" onClick={()=>setEstado({paso:'elegir'})}>Probar con otro archivo</button></>}
  </div></Sheet>;

  const {pdf,r,conc,sig,v,prevCierre}=estado;
  const setV=x=>setEstado({...estado,v:{...v,...x}});
  const setNuevo=(i,x)=>setEstado({...estado,conc:{...conc,nuevos:conc.nuevos.map((n,j)=>j===i?{...n,...x}:n)}});
  const setFalta=(i,x)=>setEstado({...estado,conc:{...conc,faltan:conc.faltan.map((n,j)=>j===i?{...n,...x}:n)}});
  const terceros=conc.ok.filter(x=>x.a.tercero).reduce((a,x)=>a+x.pc.monto,0)+conc.nuevos.filter(n=>n.incluir&&n.tercero).reduce((a,n)=>a+n.pc.monto,0);
  const propio=num(v.total)-terceros;
  const cargosTot=conc.cargos.reduce((a,c)=>a+c.monto,0);
  const confirmar=()=>{
    let d={...db};
    conc.ok.filter(x=>x.a.proyectado).forEach(x=>{ d=materializar(d,t,x.a,x.pc.monto,r.id); });
    const nuevosC=conc.nuevos.filter(n=>n.incluir).map(n=>({id:uid(),tarjeta:t.id,fecha:n.pc.fecha,desc:n.pc.desc+(n.pc.nota?` (${n.pc.nota})`:''),cat:n.cat,montoCuota:n.pc.monto,cuotas:n.pc.cuotas||1,cuotasPagadas:(n.pc.cuota||1)-1,tercero:n.tercero,resumenInicial:r.id,previo:n.pc.fecha<=prevCierre,desdePDF:true}));
    d.consumos=[...d.consumos,...nuevosC];
    conc.faltan.forEach(f=>{
      if(f.a.proyectado){ if(f.accion==='omitir') d.ocurr={...d.ocurr,[f.a.key]:{estado:'omitido'}}; return; }
      if(f.accion==='mover'&&sig) d.consumos=d.consumos.map(c=>c.id===f.a.consumoId?{...c,resumenInicial:sig.id}:c);
      if(f.accion==='eliminar') d.consumos=d.consumos.filter(c=>c.id!==f.a.consumoId);
    });
    // ajuste: diferencia entre el total real (tu parte) y lo que queda registrado en ese resumen
    const tt=d.tarjetas.find(x=>x.id===t.id);
    const tmp=updRes(d,t.id,r.id,{ajuste:0},estado.rs);
    const {items}=itemsTarjeta(tmp,tmp.tarjetas.find(x=>x.id===t.id),addD(hoy,200));
    const base=items.filter(x=>x.resumenId===r.id&&!x.tercero&&!x.ajuste).reduce((a,b)=>a+b.monto,0);
    d=updRes(d,t.id,r.id,{confirmado:true,estimado:false,cierre:v.cierre,vencimiento:v.venc,ajuste:Math.round((propio-base)*100)/100,totalPDF:num(v.total),cargosPDF:conc.cargos},estado.rs);
    d=fijarSiguiente(d,t,sig?.id,v.sigCierre,v.sigVenc);
    save(d); onClose();
  };
  return <Sheet title={`Resumen ${t.nombre}`} onClose={onClose}><div className="form">
    {estado.otroBanco&&<div className="alert d"><div className="b">Este PDF parece de otra tarjeta. Revisá que estés cargándolo en {t.nombre}.</div></div>}
    <div className="two"><F label="Cierre"><input type="date" value={v.cierre} onChange={e=>setV({cierre:e.target.value})} /></F>
      <F label="Vencimiento"><input type="date" value={v.venc} onChange={e=>setV({venc:e.target.value})} /></F></div>
    <F label={`Total a pagar${pdf.totalUSD?` (incluye U$S ${String(pdf.totalUSD).replace('.',',')} pasados a pesos)`:''}`}><MontoInput value={v.total} onChange={x=>setV({total:x})} /></F>
    {terceros>0&&<div className="muted">Tu parte: {$(propio)} · de terceros: {$(terceros)}</div>}
    <div className="two"><F label="Próximo cierre"><input type="date" value={v.sigCierre} onChange={e=>setV({sigCierre:e.target.value})} /></F>
      <F label="Próximo vencimiento"><input type="date" value={v.sigVenc} onChange={e=>setV({sigVenc:e.target.value})} /></F></div>

    <div className="card" style={{margin:0}}><h2>✅ Coinciden con lo registrado <span className="muted">{conc.ok.length}</span></h2>
      {conc.ok.map((x,i)=><div className="row" key={i}><div className="l"><div style={{fontSize:13}}>{x.pc.desc}{x.pc.cuotas>1?` (${x.pc.cuota}/${x.pc.cuotas})`:''}</div><div className="s">{fC(x.pc.fecha)}{x.a.proyectado?' · era previsto':''}</div></div><span className="amt" style={{fontSize:13}}>{$(x.pc.monto)}</span></div>)}
      {!conc.ok.length&&<div className="empty">Ninguno.</div>}</div>

    <div className="card" style={{margin:0,background:'var(--warn-bg)',borderColor:'transparent'}}><h2>➕ En el resumen y no cargados <span className="muted">{conc.nuevos.length}</span></h2>
      {conc.nuevos.length>0&&<div className="muted" style={{marginBottom:6}}>Se agregan solos. Revisá la categoría o destildá los que no correspondan.</div>}
      {conc.nuevos.map((n,i)=><div key={i} style={{padding:'8px 0',borderBottom:'1px solid var(--line)'}}>
        <div style={{display:'flex',justifyContent:'space-between',gap:8}}><label className="check" style={{fontSize:13}}><input type="checkbox" checked={n.incluir} onChange={e=>setNuevo(i,{incluir:e.target.checked})} /> {n.pc.desc}{n.pc.cuotas>1?` (${n.pc.cuota}/${n.pc.cuotas})`:''}</label><b style={{fontSize:13,whiteSpace:'nowrap'}}>{$(n.pc.monto)}</b></div>
        <div className="mini">{fL(n.pc.fecha)}{n.pc.nota?` · ${n.pc.nota}`:''}{n.pc.fecha<=prevCierre?' · compra anterior (no cuenta en el balance de estas semanas)':''}</div>
        {n.incluir&&<div style={{display:'flex',gap:8,marginTop:6,alignItems:'center'}}><select value={n.cat} onChange={e=>setNuevo(i,{cat:e.target.value})} style={{flex:1,padding:'6px 8px',border:'1px solid var(--line)',borderRadius:8,background:'var(--surface)'}}>
          <optgroup label="Gastos varios">{db.catsVarios.map(c=><option key={c}>{c}</option>)}</optgroup><optgroup label="Otras">{db.catsOtras.map(c=><option key={c}>{c}</option>)}</optgroup></select>
          <label className="check" style={{fontSize:12}}><input type="checkbox" checked={n.tercero} onChange={e=>setNuevo(i,{tercero:e.target.checked})} /> de terceros</label></div>}
      </div>)}
      {!conc.nuevos.length&&<div className="empty">Cargaste todo. 👌</div>}</div>

    {conc.faltan.length>0&&<div className="card" style={{margin:0}}><h2>⚠️ Registrados que no figuran <span className="muted">{conc.faltan.length}</span></h2>
      {conc.faltan.map((f,i)=><div key={i} style={{padding:'8px 0',borderBottom:'1px solid var(--surface2)'}}>
        <div style={{display:'flex',justifyContent:'space-between',gap:8,fontSize:13}}><span>{f.a.desc}</span><b>{$(f.a.monto)}</b></div>
        <div className="seg" style={{marginTop:6}}>{(f.a.proyectado?[['omitir','No se cobró'],['dejar','Dejar previsto']]:[['mover','Pasa al próximo'],['dejar','Dejar'],['eliminar','Eliminar']]).map(([k,l])=><button key={k} className={f.accion===k?'on':''} onClick={()=>setFalta(i,{accion:k})}>{l}</button>)}</div>
      </div>)}</div>}

    <div className="card" style={{margin:0}}><h2>Impuestos, intereses y cargos <span className="muted">{$(cargosTot)}</span></h2>
      {conc.cargos.map((c,i)=><div className="row" key={i}><span className="l" style={{fontSize:13}}>{c.desc}</span><span className="amt" style={{fontSize:13}}>{$(c.monto)}</span></div>)}
      <div className="mini">Quedan como ajuste del resumen. Si ves intereses por mora, ojo con pagar después del vencimiento.</div></div>

    <button className="btn pri" onClick={confirmar}>Confirmar resumen</button>
  </div></Sheet>;
}

function FormConfirmar({db,save,onClose,t,r,tot,rsAll}){
  const sig=rsAll[rsAll.findIndex(x=>x.id===r.id)+1];
  const base=tot.propio-(r.ajuste||0);
  const [v,setV]=useState({total:Math.round(tot.propio),venc:r.vencimiento,sigCierre:sig?.cierre||'',sigVenc:sig?.vencimiento||''});
  const ok=()=>{ const real=num(v.total);
    let d=db; tot.items.filter(x=>x.proyectado).forEach(x=>{ d=materializar(d,t,x,x.monto,r.id); });
    d=updRes(d,t.id,r.id,{confirmado:true,vencimiento:v.venc,ajuste:Math.round((real-base)*100)/100,estimado:false},rsAll);
    if(sig&&v.sigCierre&&v.sigVenc){ const tt=d.tarjetas.find(x=>x.id===t.id); const ex=tt.resumenes.find(x=>x.id===sig.id);
      d={...d,tarjetas:d.tarjetas.map(x=>x.id!==t.id?x:{...x,resumenes:[...x.resumenes.filter(y=>y.id!==sig.id),{...(ex||{}),id:sig.id,cierre:v.sigCierre,vencimiento:v.sigVenc}].sort((a,b)=>a.cierre.localeCompare(b.cierre))})}; }
    save(d); onClose(); };
  return <Sheet title={`Confirmar resumen ${t.nombre}`} onClose={onClose}><div className="form">
    <div className="muted">Copiá los datos del resumen que te llegó. La diferencia con lo registrado ({$(base)}) se carga como ajuste: impuestos, intereses o algo que faltó.</div>
    <F label="Total a pagar (tu parte, sin consumos de terceros)"><MontoInput value={v.total} onChange={x=>setV({...v,total:x})} autoFocus /></F>
    {tot.terceros>0&&<div className="muted">Además el resumen trae {$(tot.terceros)} de consumos de terceros.</div>}
    <F label="Vencimiento"><input type="date" value={v.venc} onChange={e=>setV({...v,venc:e.target.value})} /></F>
    {sig&&<><div className="muted" style={{marginTop:4}}>Próximo período (figura en el resumen):</div>
    <div className="two"><F label="Próximo cierre"><input type="date" value={v.sigCierre} onChange={e=>setV({...v,sigCierre:e.target.value})} /></F>
      <F label="Próximo vencimiento"><input type="date" value={v.sigVenc} onChange={e=>setV({...v,sigVenc:e.target.value})} /></F></div></>}
    <button className="btn pri" onClick={ok}>Confirmar resumen</button>
  </div></Sheet>;
}

function FormPagarResumen({db,save,onClose,t,r,tot,rsAll}){
  const [v,setV]=useState({monto:Math.round(tot.propio),cuenta:t.cuentaPago,fecha:hoyStr(),reintegro:tot.terceros>0,cuentaReint:t.cuentaPago});
  const ok=()=>{ const m=num(v.monto); if(m<0) return;
    const movs=[...db.movs]; const tercerosPagados=tot.terceros>0?tot.terceros:0;
    movs.push({id:uid(),fecha:v.fecha,tipo:'pagoResumen',monto:m+tercerosPagados,montoPropio:m,cuenta:v.cuenta,tarjeta:t.id,resumenId:r.id,desc:`Pago resumen ${t.nombre} (${fC(r.vencimiento)})`});
    if(tercerosPagados&&v.reintegro) movs.push({id:uid(),fecha:v.fecha,tipo:'reintegro',monto:tercerosPagados,cuenta:v.cuentaReint,desc:'Reintegro de terceros (consumos ajenos en la tarjeta)'});
    let d={...db,movs}; d=updRes(d,t.id,r.id,{pagado:true,fechaPago:v.fecha,montoPagado:m,saldoImpago:Math.max(0,Math.round((tot.propio-m)*100)/100)},rsAll);
    save(d); onClose(); };
  return <Sheet title={`Pagar resumen ${t.nombre}`} onClose={onClose}><div className="form">
    <div className="muted">Vence {fL(r.vencimiento)}. Tu parte: {$(tot.propio)}{tot.terceros>0?` + ${$(tot.terceros)} de terceros = ${$(tot.propio+tot.terceros)} en total`:''}.</div>
    <F label="Pago de tu parte"><MontoInput value={v.monto} onChange={x=>setV({...v,monto:x})} autoFocus /></F>
    {num(v.monto)<tot.propio&&<div className="alert d"><div className="b">Pagar menos del total genera intereses (más de 6% mensual). Lo que no pagues pasa al próximo resumen.</div></div>}
    <F label="Pagado desde"><SelMedio db={db} soloCuentas value={v.cuenta} onChange={x=>setV({...v,cuenta:x})} /></F>
    {tot.terceros>0&&<><label className="check"><input type="checkbox" checked={v.reintegro} onChange={e=>setV({...v,reintegro:e.target.checked})} /> Ya recibí la plata de los consumos de terceros</label>
      {v.reintegro&&<F label="La recibí en"><SelMedio db={db} soloCuentas value={v.cuentaReint} onChange={x=>setV({...v,cuentaReint:x})} /></F>}</>}
    <F label="Fecha de pago"><input type="date" value={v.fecha} onChange={e=>setV({...v,fecha:e.target.value})} /></F>
    <button className="btn pri" onClick={ok}>Registrar pago</button>
  </div></Sheet>;
}

// ================= INICIO =================
function Inicio({db,save,abrir}){
  const hoy=hoyStr(); const hoyIni=viernesDe(hoy);
  const {s}=saldosReales(db,hoy);
  const total=Object.values(s).reduce((a,b)=>a+b,0); const ahorro=totalCajas(db);
  const deuda=deudaTarjetas(db,hoy).total;
  const pos=db.cuentas.map(c=>Math.max(0,s[c.id])); const sp=pos.reduce((a,b)=>a+b,0)||1;
  const recV=db.recurrentes.find(r=>r.id==='varios'), recC=db.recurrentes.find(r=>r.id==='comida');
  const pv=recV?presupuestoSemanas(db,recV,hoyIni)[hoyIni]:null, pc=recC?presupuestoSemanas(db,recC,hoyIni)[hoyIni]:null;
  const diasRest=diffD(hoy,addD(hoyIni,6))+1;
  const alerts=[];
  // sueldos para confirmar
  ocurrencias(db,db.fechaInicio,hoy).filter(o=>o.rec.tipo==='ingreso'&&o.estado==='pendiente'&&o.fecha<=hoy).forEach(o=>alerts.push({k:'s'+o.key,cls:'w',
    h:`¿Cobraste el sueldo del ${fL(o.prog)}?`,b:o.cobrado?`Ya cobraste ${$(o.cobrado)}. Falta ${$(o.resto)}.`:`Previsto ${$(o.resto)} en ${nombreMedio(db,o.rec.medio)}.`,
    acc:[[`Sí, ${$(o.resto)}`,()=>save({...db,movs:[...db.movs,{id:uid(),fecha:o.fecha<=hoy?o.fecha:hoy,tipo:'ingreso',subtipo:'Sueldo',monto:o.resto,cuenta:o.rec.medio,desc:'Sueldo',recKey:o.key}]})],
      ['Cobré distinto',()=>abrir('ingreso',{inicial:{subtipo:'Sueldo',recKey:o.key,monto:Math.round(o.resto),cuenta:o.rec.medio,fecha:o.fecha}})],
      ['Todavía no',()=>abrir('moverCobro',{oc:o})]]}));
  // aportes de la semana a las cajas (cuando ya cobraste)
  const cobroSemana=db.movs.some(m=>m.tipo==='ingreso'&&m.subtipo==='Sueldo'&&m.fecha>=hoyIni&&m.fecha<=addD(hoyIni,6));
  if(cobroSemana) (db.cajas||[]).forEach(c=>{ const sug=aporteSugerido(db,c,hoyIni); if(sug<=0) return;
    if(db.movs.some(m=>m.tipo==='aporte'&&m.caja===c.id&&m.fecha>=hoyIni&&m.fecha<=addD(hoyIni,6))) return;
    if((db.decisiones||{})[`aporte|${c.id}|${hoyIni}`]) return;
    alerts.push({k:'ap'+c.id,cls:'i',h:c.tipo==='jubilacion'?`Separá el ${c.pct}% para tu jubilación: ${$(sug)}`:`Separá tu ahorro de la semana: ${$(sug)}`,
      b:c.tipo==='jubilacion'&&c.reponer>0?`Incluye reposición del retiro (faltan ${$(c.reponer)}).`:`Va a ${c.nombre}.`,
      acc:[['Separar',()=>abrir('ahorro',{cajaId:c.id,accion:'aportar',monto:sug})],['Esta semana no',()=>save({...db,decisiones:{...db.decisiones,[`aporte|${c.id}|${hoyIni}`]:'omitido'}})]]}); });
  // tarjetas
  db.tarjetas.forEach(t=>{
    const {rs,items}=itemsTarjeta(db,t,addD(hoy,90));
    const pend=rs.filter(r=>!r.pagado);
    const sinConf=pend.find(r=>r.cierre<=hoy&&!r.confirmado);
    if(sinConf){ const tot=totalesResumen(items,sinConf.id); alerts.push({k:'c'+t.id,cls:'w',h:`Cerró el resumen de ${t.nombre}`,b:`Cargá el PDF cuando te llegue: la app lo compara con lo que registraste. Registrado hasta ahora: ${$(tot.propio)}.`,acc:[['Cargar PDF',()=>abrir('resumenPDF',{t})],['Confirmar a mano',()=>abrir('confirmar',{t,r:sinConf,tot,rsAll:rs})]]}); }
    const prox=pend.find(r=>totalesResumen(items,r.id).propio>0||totalesResumen(items,r.id).terceros>0);
    if(prox){ const tot=totalesResumen(items,prox.id); const dd=diffD(hoy,prox.vencimiento);
      const disp=saldoCuentaAntes(db,t.cuentaPago,prox.vencimiento,prox.id);
      const falta=tot.propio-disp; const cls=dd<0?'d':dd===0?'d':dd<=5?'w':'i';
      alerts.push({k:'v'+t.id,cls,h:`${t.nombre}: ${$(tot.propio)} ${dd<0?`venció hace ${-dd} días`:dd===0?'vence hoy':`vence ${fL(prox.vencimiento)} (en ${dd} días)`}`,
        b:<>{tot.terceros>0&&<div>Además {$(tot.terceros)} de terceros (te los tienen que transferir).</div>}
          <div>Se paga desde {nombreMedio(db,t.cuentaPago)}: {falta>0?<b className="neg">ese día vas a tener {$(disp)}, faltan {$(falta)}. Transferí antes.</b>:<span>ese día vas a tener {$(disp)}, alcanza.</span>}</div>
          {!prox.confirmado&&<div className="mini">Monto estimado hasta que confirmes el resumen.</div>}</>,
        acc:[['Pagar',()=>abrir('pagarResumen',{t,r:prox,tot,rsAll:rs})],...(falta>0?[['Transferir',()=>abrir('transfer')]]:[])]});
    }
  });
  // vivienda: viernes más próximo al 10
  const ocs=ocurrencias(db,db.fechaInicio,addD(hoy,14)).filter(o=>o.estado==='pendiente'&&o.rec.tipo==='gasto'&&!esTarjeta(db,o.rec.medio));
  const viv=ocs.filter(o=>o.rec.grupo==='vivienda'&&diffD(hoy,o.fecha)<=6);
  if(viv.length){ const f=viv[0].fecha; const tot=viv.reduce((a,b)=>a+b.monto,0); const dd=diffD(hoy,f);
    alerts.push({k:'viv',cls:dd<0?'d':'w',h:`Alquileres y expensas: ${$(tot)} aprox.`,b:<><div>Vencen el {fC(viv[0].prog)}. Pagalos en lo posible el {fL(f)}, el viernes más próximo al 10{dd<0?' (ya pasó)':dd===0?' (hoy)':''}.</div>
      {viv.map(o=><div key={o.key} className="row"><div className="l"><div className="t">{o.rec.nombre}</div><div className="s">{o.rec.estim==='ultimo'?'aprox., según el último pago':'monto vigente'}</div></div><span className="amt">{$(o.monto)}</span><button className="btn sm" onClick={()=>abrir('pagarRec',{oc:o})}>Pagar</button></div>)}</>});
  }
  // otros fijos próximos
  ocs.filter(o=>o.rec.grupo!=='vivienda'&&diffD(hoy,o.fecha)<=3).forEach(o=>alerts.push({k:o.key,cls:o.fecha<hoy?'d':'i',h:`${o.rec.nombre}: ${$(o.monto)}${o.rec.estim==='ultimo'?' aprox.':''}`,b:`${o.fecha<hoy?'Pendiente desde':'Para'} el ${fL(o.fecha)}.`,acc:[['Pagar',()=>abrir('pagarRec',{oc:o})]]}));
  // esperados vencidos
  db.esperados.filter(e=>!e.hecho&&e.fecha<=hoy).forEach(e=>alerts.push({k:e.id,cls:'i',h:`${e.tipo==='ingreso'?'¿Cobraste':'¿Pagaste'} ${e.desc}?`,b:`${$(e.monto)} previsto para el ${fL(e.fecha)}${e.tentativo?' (a confirmar)':''}.`,
    acc:[[e.tipo==='ingreso'?'Registrar cobro':'Registrar pago',()=>abrir(e.tipo==='ingreso'?'ingreso':'pagoUnico',{inicial:e.tipo==='ingreso'?{monto:e.monto,subtipo:e.subtipo,desc:e.desc,cuenta:e.cuenta,ahorro:e.ahorro,esperado:e.id}:e})],['Cambiar fecha',()=>abrir('esperado',{e})]]}));
  // devoluciones atrasadas
  (db.prestamos||[]).filter(p=>p.fechaDevolucion&&p.fechaDevolucion<=hoy&&pendientePrestamo(db,p)>0).forEach(p=>alerts.push({k:'pr'+p.id,cls:'i',h:`¿${p.persona} te devolvió la plata?`,b:`Te debe ${$(pendientePrestamo(db,p))}, quedó en devolver el ${fL(p.fechaDevolucion)}.`,acc:[['Registrar devolución',()=>abrir('devolucion',{p})],['Cambiar fecha',()=>abrir('prestamo',{p})]]}));
  // actualizaciones de alquiler
  db.recurrentes.filter(r=>r.actualizaMeses&&r.ultimaActualizacion).forEach(r=>{ const prox=addM(r.ultimaActualizacion,r.actualizaMeses); const dd=diffD(hoy,prox);
    if(dd<=10) alerts.push({k:'act'+r.id,cls:'w',h:`${r.nombre}: actualización ${dd<0?'pendiente':`en ${dd} días`}`,b:`Toca el aumento trimestral (${fC(prox)}). Cargá el nuevo valor en Recurrentes cuando lo sepas.`,acc:[['Cargar nuevo valor',()=>abrir('rec',{r})]]}); });
  // sobrante semana anterior
  if(recV){ const prev=addD(hoyIni,-7); const p=presupuestoSemanas(db,recV,hoyIni)[prev];
    if(p&&p.sobrante>0&&!db.decisiones['sobrante|'+prev]) alerts.push({k:'sob',cls:'i',h:`La semana pasada te sobraron ${$(p.sobrante)} de varios`,b:'Lo recomendable es pasarlo al ahorro.',acc:[['Pasar al ahorro',()=>abrir('ahorro',{cajaId:'ahorro',accion:'aportar',monto:Math.round(p.sobrante),desc:'Sobrante de varios',semana:prev})],['Ahora no',()=>save({...db,decisiones:{...db.decisiones,['sobrante|'+prev]:'omitido'}})]]}); }
  // tope de cuotas
  const ingMes=montoVigente(db.recurrentes.find(r=>r.id==='sueldo')||{montos:[]},hoy)*52/12; const tope=ingMes*(db.tope_cuotas_pct||10)/100;
  const cuotasMes=cuotasComprometidas(db,1)[0];
  if(cuotasMes&&cuotasMes.cuotas>tope) alerts.push({k:'tope',cls:'w',h:`Cuotas del próximo resumen: ${$(cuotasMes.cuotas)}`,b:`Supera el tope del ${db.tope_cuotas_pct||10}% de tu ingreso (${$(tope)}). Evitá sumar compras en cuotas.`});

  return <div>
    <div className="hero">
      <div className="lbl">Disponible en tus cuentas</div>
      <div className="total">{$(total)}</div>

function Cajas({db,abrir}){
  return <div className="card"><h2>Ahorros <span className="muted">{$(totalCajas(db))}</span></h2>
    {(db.cajas||[]).map(c=>{ const st=estadoCaja(db,c); return <div key={c.id} className="caja" onClick={()=>abrir('ahorro',{cajaId:c.id})} style={{cursor:'pointer'}}>
      <div className="top2"><b>{c.nombre}</b><span className="val" style={{color:c.color}}>{$(st.valor)}</span></div>
      <div className="barline"><span>{c.tipo==='jubilacion'?`${c.pct}% del sueldo cada semana`:c.montoSemanal?`${$(c.montoSemanal)} por semana`:'Sin aporte fijo'}</span>
        <span className={st.rendimiento>=0?'pos':'neg'}>{st.rendimiento?`${$s(st.rendimiento)} (${st.rendPct.toFixed(1)}%)`:''}</span></div>
      {c.valorFecha&&<div className="mini">Valor actualizado el {fL(c.valorFecha)}</div>}
      {c.tipo==='jubilacion'&&c.reponer>0&&<div className="mini warn">Falta reponer {$(c.reponer)}</div>}
    </div>; })}

  </div>;
}
function cuotasComprometidas(db,n=6){
  const hoy=hoyStr(); const meses={};
  db.tarjetas.forEach(t=>{ const {rs,items}=itemsTarjeta(db,t,addD(hoy,200));
    rs.filter(r=>!r.pagado&&r.vencimiento>=hoy).forEach(r=>{ const k=r.vencimiento.slice(0,7); const it=items.filter(x=>x.resumenId===r.id&&!x.tercero);
      meses[k]=meses[k]||{mes:k,total:0,cuotas:0,por:{}}; const tot=it.reduce((a,b)=>a+b.monto,0); const cu=it.filter(x=>x.desc.match(/\(\d+\/\d+\)$/)).reduce((a,b)=>a+b.monto,0);
      meses[k].total+=tot; meses[k].cuotas+=cu; meses[k].por[t.nombre]=(meses[k].por[t.nombre]||0)+tot; }); });
  return Object.values(meses).sort((a,b)=>a.mes.localeCompare(b.mes)).slice(0,n);
}

function Movimientos({db,save,abrir}){
  const [filtro,setFiltro]=useState('todos');
  const lista=[
    ...db.movs.map(m=>({...m,kind:'mov'})),
    ...db.consumos.filter(c=>!c.previo).map(c=>({id:c.id,kind:'consumo',fecha:c.fecha,tipo:'tarjeta',monto:c.montoCuota*(c.cuotas||1),desc:c.desc,cat:c.cat,medio:c.tarjeta,cuotas:c.cuotas,tercero:c.tercero,raw:c})),
  ].filter(m=>filtro==='todos'||(filtro==='gastos'&&(m.tipo==='gasto'||m.tipo==='tarjeta'))||(filtro==='ingresos'&&m.tipo==='ingreso')||(filtro==='otros'&&!['gasto','tarjeta','ingreso'].includes(m.tipo)))
   .sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const grupos={}; lista.forEach(m=>{const w=viernesDe(m.fecha);(grupos[w]=grupos[w]||[]).push(m);});
  const signo=m=>m.tipo==='ingreso'||m.tipo==='reintegro'||(m.tipo==='ajuste'&&m.monto>0)?1:(m.tipo==='transfer'||m.tipo==='aporte'||m.tipo==='retiro')?0:-1;
  const editar=m=>{ if(m.prestamoId){ const p=(db.prestamos||[]).find(x=>x.id===m.prestamoId); if(m.tipo==='gasto'&&p) return abrir('prestamo',{p}); if(confirm('¿Eliminar esta devolución?')) save({...db,movs:db.movs.filter(x=>x.id!==m.id)}); return; }
    if(m.kind==='consumo') abrir('gasto',{inicial:{kind:'consumo',id:m.id,monto:m.monto,desc:m.desc,cat:m.cat,medio:m.medio,cuotas:m.cuotas,fecha:m.fecha,tercero:m.tercero}});
    else if(m.tipo==='gasto') abrir('gasto',{inicial:{kind:'mov',id:m.id,monto:m.monto,desc:m.desc,cat:m.cat,medio:m.cuenta,fecha:m.fecha}});
    else if(m.tipo==='ingreso') abrir('ingreso',{inicial:m});
    else if(confirm('¿Eliminar este movimiento?')) save({...db,movs:db.movs.filter(x=>x.id!==m.id)}); };
  return <div>
    <div className="fab">
      <button onClick={()=>abrir('gasto')}><span className="ic">➖</span>Egreso</button>
      <button onClick={()=>abrir('ingreso')}><span className="ic">➕</span>Ingreso</button>
      <button onClick={()=>abrir('transfer')}><span className="ic">⇄</span>Transferir</button>
      <button onClick={()=>abrir('ahorro')}><span className="ic">🐷</span>Ahorro</button>
    </div>
    <div className="seg tabs-sub">{[['todos','Todos'],['gastos','Egresos'],['ingresos','Ingresos'],['otros','Movimientos']].map(([k,l])=><button key={k} className={filtro===k?'on':''} onClick={()=>setFiltro(k)}>{l}</button>)}</div>
    <Prestamos db={db} abrir={abrir} todos />
    {!lista.length&&<div className="card"><div className="empty">Todavía no hay movimientos. Cargá el primer egreso con el botón de arriba.</div></div>}
    {Object.entries(grupos).sort((a,b)=>b[0].localeCompare(a[0])).map(([w,ms])=><div className="card" key={w}>
      <h2>Semana del vie {fC(w)} <span className="muted">{$(ms.reduce((a,m)=>a+signo(m)*m.monto,0))}</span></h2>
      {ms.map(m=><div className="row" key={m.kind+m.id} onClick={()=>editar(m)} style={{cursor:'pointer'}}>
        <div className="l"><div className="t">{m.desc}</div>
          <div className="s">{fL(m.fecha)} · {m.tipo==='aporte'?`${nombreMedio(db,m.cuenta)} → ${(db.cajas.find(c=>c.id===m.caja)||{}).nombre}`:m.tipo==='retiro'?`${(db.cajas.find(c=>c.id===m.caja)||{}).nombre} → ${nombreMedio(db,m.cuenta)}${m.motivo?` · ${m.motivo}`:''}`:m.tipo==='transfer'?`${nombreMedio(db,m.cuenta)} → ${nombreMedio(db,m.cuentaDestino)}`:nombreMedio(db,m.medio||m.cuenta)}{m.cuotas>1?` · ${m.cuotas} cuotas`:''}{m.cat?` · ${m.cat}`:''}</div>
          <div>{m.ahorro&&<span className="chip aho">ahorro</span>} {m.prestamoId&&<span className="chip">{m.tipo==='gasto'?'préstamo':'devolución'}</span>} {m.tercero&&<span className="chip">de terceros</span>} {m.auto&&<span className="chip">automático</span>}</div></div>
        <span className={'amt '+(signo(m)>0?'pos':signo(m)<0?'':'muted')}>{signo(m)>0?'+':signo(m)<0?'−':''}{$(Math.abs(m.monto))}</span>
      </div>)}
    </div>)}
  </div>;
}

function Tarjetas({db,save,abrir}){
  const hoy=hoyStr();
  const cm=cuotasComprometidas(db,6);
  const ingMes=montoVigente(db.recurrentes.find(r=>r.id==='sueldo')||{montos:[]},hoy)*52/12; const tope=ingMes*(db.tope_cuotas_pct||10)/100;
  const maxT=Math.max(tope,...cm.map(x=>x.total),1);
  return <div>
    <button className="btn pri" style={{width:'100%',marginBottom:12}} onClick={()=>abrir('gasto',{inicial:{medio:'tbbva'}})}>Registrar compra con tarjeta</button>
    {db.tarjetas.map(t=><TarjetaCard key={t.id} db={db} save={save} abrir={abrir} t={t} />)}
    <div className="card"><h2>Comprometido por mes <span className="muted">tope {db.tope_cuotas_pct||10}%: {$(tope)}</span></h2>
      {cm.map(m=><div key={m.mes} style={{marginBottom:10}}>
        <div className="barline"><b style={{color:'var(--ink)'}}>{MESES[parseInt(m.mes.slice(5))-1]} {m.mes.slice(0,4)}</b><span>{$(m.total)}{m.cuotas?` · cuotas ${$(m.cuotas)}`:''}</span></div>
        <div className="bar" style={{position:'relative'}}><span style={{width:(m.total/maxT*100)+'%',background:m.total>tope?'var(--warn)':'var(--ink2)'}}></span></div>
        <div className="mini">{Object.entries(m.por).map(([k,v])=>`${k} ${$(v)}`).join(' · ')}</div>
      </div>)}
      <div className="mini">Incluye cuotas, cargos fijos con tarjeta y lo que ya compraste. Los meses lejanos solo muestran lo ya comprometido.</div>
    </div>
  </div>;
}
function TarjetaCard({db,save,abrir,t}){
  const hoy=hoyStr(); const [abierto,setAbierto]=useState(null);
  const {rs,items}=itemsTarjeta(db,t,addD(hoy,200));

  return <div className="card">
    <h2><span><span className="dot" style={{background:t.color}}></span>{t.nombre}</span>
      <select value={t.cuentaPago} onChange={e=>save({...db,tarjetas:db.tarjetas.map(x=>x.id===t.id?{...x,cuentaPago:e.target.value}:x)})} style={{fontSize:12,border:'1px solid var(--line)',borderRadius:8,padding:'4px 6px',background:'var(--surface)'}} aria-label="Cuenta que paga">
        {db.cuentas.map(c=><option key={c.id} value={c.id}>Paga {c.nombre}</option>)}</select></h2>
    <div className="muted" style={{marginBottom:6}}>Deuda hoy: <b style={{color:'var(--ink)'}}>{$(deudaTarjetas(db,hoy).por[t.id]||0)}</b> (incluye cuotas futuras)</div>
    <button className="btn sm" style={{marginBottom:6}} onClick={()=>abrir('resumenPDF',{t})}>📄 Cargar resumen PDF</button>
    {visibles.map(r=>{ const tot=totalesResumen(items,r.id); const est=r.estimado||!r.confirmado; const cerrado=r.cierre<=hoy;
      return <div key={r.id} style={{borderTop:'1px solid var(--surface2)',padding:'10px 0'}}>
        <div className="row" style={{border:'none',padding:0,cursor:'pointer'}} onClick={()=>setAbierto(abierto===r.id?null:r.id)}>
          <div className="l"><div className="t">Vence {fL(r.vencimiento)} {r.pagado?<span className="chip" style={{background:'var(--pos-bg)',color:'var(--pos)'}}>pagado</span>:est?<span className="chip est">{r.estimado?'fechas estimadas':'sin confirmar'}</span>:<span className="chip">confirmado</span>}</div>
            <div className="s">Cierra {fC(r.cierre)} · {tot.items.length} ítems{tot.terceros?` · terceros ${$(tot.terceros)}`:''}</div></div>
          <span className="amt">{$(tot.propio)}</span></div>
        {!r.pagado&&<div className="btns" style={{marginTop:6}}>

          {!cerrado&&<button className="btn sm ghost" onClick={()=>abrir('confirmar',{t,r,tot,rsAll:rs})}>Corregir fechas o total</button>}
          {(tot.propio>0||tot.terceros>0)&&r.cierre<=addD(hoy,40)&&<button className="btn sm" onClick={()=>abrir('pagarResumen',{t,r,tot,rsAll:rs})}>Pagar</button>}</div>}
        {abierto===r.id&&<div style={{marginTop:6}}>{tot.items.map((x,i)=><div key={i} className="row" style={{padding:'6px 0'}}>
          <div className="l"><div style={{fontSize:13}}>{x.desc} {x.tercero&&<span className="chip">terceros</span>} {x.proyectado&&<span className="chip est">previsto</span>}</div><div className="s">{x.ajuste?'ajuste':x.arrastre?'arrastre':`compra ${fC(x.fechaCompra)}`}</div></div>
          <span className="amt" style={{fontSize:13}}>{$(x.monto)}</span>
          {x.consumoId&&<button className="btn sm ghost" aria-label="Editar" onClick={()=>{const c=db.consumos.find(y=>y.id===x.consumoId); abrir('gasto',{inicial:{kind:'consumo',id:c.id,monto:c.montoCuota*(c.cuotas||1),desc:c.desc,cat:c.cat,medio:c.tarjeta,cuotas:c.cuotas,fecha:c.fecha,tercero:c.tercero}});}}>✏️</button>}
        </div>)}{!tot.items.length&&<div className="empty">Sin consumos todavía.</div>}</div>}
