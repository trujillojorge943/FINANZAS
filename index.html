// ================= CASHFLOW =================
function Cashflow({db}){
  const [det,setDet]=useState(null);
  const cf=useMemo(()=>cashflow(db,12),[db]);
  const C=cf.cols;
  const S=a=>a.reduce((x,y)=>x+y.monto,0);
  const filas=[
    ['Ingresos','ingresos',c=>c.det.ingresos,1],
    ['Alquileres y expensas','vivienda',c=>c.det.vivienda,-1],
    ['Fijos','fijos',c=>c.det.fijos,-1],
    ['Pagos únicos','unicos',c=>c.det.unicos,-1],
    ['Comida y varios','presup',c=>[...c.det.presup],-1],
    ['Egresos registrados','reales',c=>c.det.gastosReales,-1],
    ['Préstamos','prestamos',c=>c.det.prestamos,-1],
    ['Compras con tarjeta','tarjeta',c=>c.det.tarjeta,-1],
  ];
  const celda=(v,items,titulo,sign)=>{ const has=items&&items.length; const t=items?.some(x=>x.tentativo||x.estimado);
    return <td className={'tap'} onClick={()=>has&&setDet({titulo,items,sign})}>{v?<span className={sign>0?'pos':''}>{sign>0?'+':'−'}{$(Math.abs(v)).replace('−','')}{t&&<span className="muted"> ?</span>}</span>:<span className="muted">—</span>}</td>; };
  return <div>
    <div className="muted" style={{margin:'0 4px 8px'}}>Semanas de viernes a jueves, como el cobro. Tocá una celda para ver el detalle. "?" = estimado o a confirmar.</div>
    <div className="cfwrap"><table className="cf">
      <thead><tr><th className="stick">Semana</th>{C.map(c=><th key={c.a} className={c.i===0?'cur':''}>{fC(c.a)}–{fC(c.b)}{c.det.pagos.length?<div className="neg" style={{fontSize:10}}>vence tarjeta</div>:null}</th>)}</tr></thead>
      <tbody>
        {filas.map(([l,k,get,sg])=>{ if(!C.some(c=>get(c).length)) return null; return <tr key={k}><td className="stick">{l}</td>{C.map(c=><React.Fragment key={c.a}>{celda(S(get(c)),get(c),`${l} · ${fC(c.a)} al ${fC(c.b)}`,sg)}</React.Fragment>)}</tr>; })}
        <tr className="key sep"><td className="stick">Balance sem.</td>{C.map(c=><td key={c.a} className={(c.i===0?'cur ':'')+(c.balance<0?'neg':'pos')}>{$s(c.balance)}</td>)}</tr>
        <tr><td className="stick">Pago de resúmenes</td>{C.map(c=><React.Fragment key={c.a}>{celda(c.pagosResumen,c.det.pagos,`Pagos de resúmenes · ${fC(c.a)} al ${fC(c.b)}`,-1)}</React.Fragment>)}</tr>
        <tr><td className="stick">Deuda tarjetas</td>{C.map(c=><td key={c.a} className="tap" onClick={()=>setDet({titulo:`Deuda de tarjetas al ${fC(c.b)}`,items:db.tarjetas.map(t=>({desc:t.nombre,monto:c.deuda.por[t.id]||0})),sign:0})}>{$(c.deuda.total)}</td>)}</tr>
        <tr><td className="stick">Aportes a cajas</td>{C.map(c=><React.Fragment key={c.a}>{celda(c.aportes,c.det.aportes,`Aportes y retiros · ${fC(c.a)} al ${fC(c.b)}`,-1)}</React.Fragment>)}</tr>
        {(db.cajas||[]).map(cj=><tr key={cj.id}><td className="stick" style={{color:cj.color}}>{cj.nombre}</td>{C.map(c=><td key={c.a} style={{color:cj.color}}>{$(c.porCaja[cj.id])}</td>)}</tr>)}
        <tr className="key"><td className="stick">Proyectado</td>{C.map(c=><td key={c.a} className={'tap '+(c.i===0?'cur ':'')+(c.proyectado<0?'neg':'')} onClick={()=>setDet({titulo:`Saldo proyectado al ${fC(c.b)}`,items:db.cuentas.map(x=>({desc:x.nombre,monto:c.porCuenta[x.id]})),sign:0})}>{$(c.proyectado)}{db.cuentas.some(x=>c.porCuenta[x.id]<0)&&c.proyectado>=0?<span className="neg"> !</span>:null}</td>)}</tr>
        <tr className="key"><td className="stick">Real</td>{C.map(c=><td key={c.a} className={c.i===0?'cur':''}>{c.real!==null?$(c.real):<span className="muted">—</span>}</td>)}</tr>
      </tbody></table></div>
    <div className="card" style={{marginTop:12}}>
      <h2>Cómo leerlo</h2>
      <div className="muted" style={{fontSize:13}}>
        <p><b>Balance sem.:</b> ingresos menos egresos de la semana (los préstamos que das cuentan como egreso y las devoluciones como ingreso). Las compras con tarjeta cuentan la semana en que comprás.</p>
        <p style={{marginTop:6}}><b>Pago de resúmenes:</b> plata que sale de la cuenta para pagar la tarjeta. No es un egreso nuevo: baja la deuda.</p>
        <p style={{marginTop:6}}><b>Aportes a cajas:</b> plata que pasás al ahorro o a la caja jubilación. Sale de las cuentas pero sigue siendo tuya, así que no cuenta como egreso.</p>
        <p style={{marginTop:6}}><b>Proyectado:</b> lo que vas a tener en las cuentas al jueves. Se compara con el <b>Real</b>. Un "!" avisa que alguna cuenta queda en negativo aunque el total no.</p>
      </div></div>
    {det&&<Sheet title={det.titulo} onClose={()=>setDet(null)}>
      {det.items.map((x,i)=><div className="row" key={i}><div className="l"><div className="t" style={{fontWeight:500}}>{x.desc}</div><div className="s">{x.fecha?fL(x.fecha):''}{x.cuenta?` · ${nombreMedio(db,x.cuenta)}`:''}{x.real?' · registrado':x.fecha?' · previsto':''}{x.vencido?' · atrasado':''}</div></div>
        <span className={'amt '+(det.sign>0?'pos':(det.sign===0&&x.monto<0)?'neg':'')}>{det.sign>0?'+':det.sign<0?'−':''}{det.sign===0?$(x.monto):$(Math.abs(x.monto))}</span></div>)}
      {det.items.length>1&&<div className="row"><b>Total</b><b>{$(det.items.reduce((a,b)=>a+b.monto,0))}</b></div>}
    </Sheet>}
  </div>;
}

// ================= RECURRENTES =================
function Recurrentes({db,save,abrir}){
  const hoy=hoyStr();
  const prox=rec=>{ if(rec.tipo==='presupuesto') return 'cada semana'; const o=ocurrencias(db,hoy,addD(hoy,70)).filter(x=>x.rec.id===rec.id&&x.estado==='pendiente')[0]; return o?`próximo ${fL(o.fecha)}`:''; };
  const desc=r=>{ if(r.tipo==='presupuesto') return `tope semanal${r.compensa?', compensa excesos':''}`; const f=r.frec==='semanal'?'cada viernes':r.frec==='quincenal'?'cada 2 viernes':`día ${r.dia}${r.pagoViernes?', se paga el viernes anterior':''}`; return `${f} · ${nombreMedio(db,r.medio)}${r.tipo==='gasto'&&r.estim==='ultimo'?' · aprox., último pagado':''}`; };
  const grupos=[['Ingresos',r=>r.tipo==='ingreso'],['Vivienda',r=>r.grupo==='vivienda'],['Presupuestos semanales',r=>r.tipo==='presupuesto'],['Otros egresos',r=>r.tipo==='gasto'&&r.grupo!=='vivienda']];
  const sueldo=db.recurrentes.find(r=>r.id==='sueldo');
  const prSueldo=sueldo?sueldosAbiertos(db).filter(o=>o.rec.id==='sueldo').slice(0,7):[];
  return <div>
    {grupos.map(([g,fn])=>{ const rs=db.recurrentes.filter(fn); if(!rs.length) return null; return <div className="card" key={g}><h2>{g}</h2>
      {rs.map(r=><div className="row" key={r.id} onClick={()=>abrir('rec',{r})} style={{cursor:'pointer',opacity:r.activo===false?.5:1}}>
        <div className="l"><div className="t">{r.nombre}</div><div className="s">{desc(r)}</div><div className="s">{prox(r)}{r.ultimaActualizacion&&r.actualizaMeses?` · próxima actualización ${fC(addM(r.ultimaActualizacion,r.actualizaMeses))}`:''}</div></div>
        <span className="amt">{r.tipo==='ingreso'?'+':''}{$(r.tipo==='presupuesto'?montoVigente(r,hoy):estimado(db,r,hoy))}</span></div>)}
    </div>; })}
    <button className="btn" style={{width:'100%',marginBottom:12}} onClick={()=>abrir('rec',{})}>+ Nuevo recurrente</button>
    {prSueldo.length>0&&<div className="card"><h2>Sueldos <span className="muted">tocá para cobrar, adelantar o mover</span></h2>
      {prSueldo.map(o=><div className="row" key={o.key} onClick={()=>abrir('sueldo',{oc:o})} style={{cursor:'pointer'}}><div className="l"><div className="t">{fL(o.fecha)} {o.fecha<hoy&&<span className="chip est">sin confirmar</span>}</div>{o.ajustada&&<div className="s">original {fL(o.prog)}</div>}{o.fecha!==o.prog&&!o.ajustada&&<div className="s">feriado el {fC(o.prog)}</div>}{o.cobrado>0&&<div className="s">cobrado {$(o.cobrado)} · falta {$(o.resto)}</div>}</div><span className="amt pos">+{$(o.resto)}</span></div>)}</div>}
    <div className="card"><h2>Pagos e ingresos previstos <button className="btn sm" onClick={()=>abrir('esperado',{})}>+ Agregar</button></h2>
      {db.esperados.filter(e=>!e.hecho).sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(e=><div className="row" key={e.id} onClick={()=>abrir('esperado',{e})} style={{cursor:'pointer'}}>
        <div className="l"><div className="t">{e.desc}</div><div className="s">{fL(e.fecha)} · {nombreMedio(db,e.cuenta)} {e.tentativo&&<span className="chip est">a confirmar</span>}</div></div>
        <span className={'amt '+(e.tipo==='ingreso'?'pos':'')}>{e.tipo==='ingreso'?'+':'−'}{$(e.monto)}</span></div>)}
      {!db.esperados.filter(e=>!e.hecho).length&&<div className="empty">Nada previsto. Acá van pagos únicos (como la renovación) e ingresos esperados (shows, bonos).</div>}
    </div>
  </div>;
}

  </div>;
}

const NUBE_KEY='jorge-finanzas-nube';
function leerNube(){ try{ return JSON.parse(localStorage.getItem(NUBE_KEY))||{}; }catch(e){ return {}; } }
function escribirNube(n){ try{ localStorage.setItem(NUBE_KEY,JSON.stringify(n)); }catch(e){} }
async function llamarNube(url,body){
  const r=await fetch(url,{method:'POST',body:JSON.stringify(body)});
  const txt=await r.text(); try{ return JSON.parse(txt); }catch(e){ return {ok:false,error:'La URL no responde como la app web de Apps Script. Revisá que sea la URL que termina en /exec.'}; }
}
// Instalación como app
let eventoInstalar=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); eventoInstalar=e; window.dispatchEvent(new Event('puede-instalar')); });
const esInstalada=()=>window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;

function SeccionNube({nube,sync,conectar,desconectar,subir,bajar}){
  const [v,setV]=useState({url:nube.url||'',token:nube.token||''});
  const estado={off:'Sin conectar',ok:'Sincronizado',guardando:'Guardando…',error:'Error',conflicto:'Hay cambios en otro dispositivo'}[sync.estado]||'';
  return <div className="card"><h2>Sincronizar con Google Drive <span className={'sync '+(sync.estado==='ok'?'ok':sync.estado==='error'?'err':sync.estado==='conflicto'?'conf':'')}>{estado}</span></h2>
    <div className="muted" style={{marginBottom:8}}>Los datos se guardan en un archivo de tu Drive y se ven iguales en el celular y en la compu. Este dispositivo igual guarda una copia por si no hay conexión.</div>
    {nube.url?<>
      <div className="row"><span className="l">Último guardado en la nube</span><span className="muted">{nube.ultima?new Date(nube.ultima).toLocaleString('es-AR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—'}</span></div>
      {sync.msg&&<div className="alert d" style={{marginTop:8}}><div className="b">{sync.msg}</div></div>}
      <div className="btns" style={{marginTop:8}}><button className="btn" onClick={()=>subir(false)}>Guardar ahora</button><button className="btn" onClick={bajar}>Traer de la nube</button><button className="btn danger" onClick={desconectar}>Desconectar</button></div>
    </>:<div className="form">
      <F label="URL de la app web (termina en /exec)"><input value={v.url} onChange={e=>setV({...v,url:e.target.value.trim()})} placeholder="https://script.google.com/macros/s/.../exec" /></F>
      <F label="Clave"><input value={v.token} onChange={e=>setV({...v,token:e.target.value.trim()})} placeholder="La que aparece en la planilla, hoja Conexión" /></F>
      <button className="btn pri" onClick={()=>{ if(v.url.startsWith('https://script.google.com/')&&v.token) conectar(v.url,v.token); else alert('Revisá la URL (tiene que empezar con https://script.google.com/) y la clave.'); }}>Conectar</button>
    </div>}
  </div>;
}
function SeccionInstalar(){
  const [puede,setPuede]=useState(!!eventoInstalar);
  useEffect(()=>{ const f=()=>setPuede(true); window.addEventListener('puede-instalar',f); return ()=>window.removeEventListener('puede-instalar',f); },[]);
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  return <div className="card"><h2>App en el celular</h2>
    {esInstalada()?<div className="muted">Ya la estás usando como app instalada.</div>:
     puede?<><div className="muted" style={{marginBottom:8}}>Instalala para abrirla desde un ícono, a pantalla completa.</div><button className="btn pri" onClick={async()=>{ eventoInstalar.prompt(); await eventoInstalar.userChoice; eventoInstalar=null; setPuede(false); }}>Instalar app</button></>:
     ios?<div className="muted">En Safari tocá el botón Compartir y elegí <b>Agregar a inicio</b>.</div>:
     <div className="muted">En Chrome abrí el menú ⋮ y elegí <b>Instalar app</b> o <b>Agregar a la pantalla principal</b>.</div>}
  </div>;
}

const TABS=[['inicio','Inicio','🏠'],['movs','Movimientos','📝'],['tarjetas','Tarjetas','💳'],['cash','Cashflow','📊'],['rec','Recurrentes','🔁'],['config','Ajustes','⚙️']];
function migrarCajas(d){
  if(d.cajas) return d;
  const movs=[]; d.movs.forEach(m=>{
    if(m.tipo==='apartar') movs.push({...m,tipo:'aporte',caja:/jubil/i.test(m.desc||'')?'jubi':'ahorro',ts:1});
    else if(m.tipo==='liberar') movs.push({...m,tipo:'retiro',caja:'ahorro',ts:1});
    else if(m.tipo==='ingreso'&&m.ahorro){ movs.push({...m,ahorro:false}); movs.push({id:m.id+'-ap',fecha:m.fecha,tipo:'aporte',caja:'ahorro',cuenta:m.cuenta,monto:m.monto,desc:'Aporte desde '+(m.desc||'ingreso'),ts:1}); }
    else if(m.tipo==='transfer'&&m.ahorro) movs.push({...m,ahorro:false});
    else movs.push(m);
  });
  const cuentas=d.cuentas.some(c=>c.id==='ef')?d.cuentas:[...d.cuentas,{id:'ef',nombre:'Efectivo',color:'var(--ef)',saldoInicial:6000}];
  return {...d,movs,cuentas,cajas:CAJAS_INIT};
}
function migrar(d){ if(!d) return d; d=migrarCajas(d); const catsOtras=(d.catsOtras||CATS_OTRAS).includes('Suscripciones')?(d.catsOtras||CATS_OTRAS):[...(d.catsOtras||CATS_OTRAS).slice(0,4),'Suscripciones',...(d.catsOtras||CATS_OTRAS).slice(4)]; return {...d, prestamos:d.prestamos||[], catsOtras, tema:d.tema||'claro'}; }
function cargar(){ try{ const d=JSON.parse(localStorage.getItem(STORAGE_KEY)); if(d&&d.version===13) return migrar(d); }catch(e){} return null; }
try{ const d0=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'); document.documentElement.setAttribute('data-theme',d0.tema==='oscuro'?'dark':'light'); }catch(e){ document.documentElement.setAttribute('data-theme','light'); }
function App(){
  const [db,setDbRaw]=useState(()=>migrar(cargar()||datosIniciales()));
  const [tab,setTab]=useState('inicio');
  const [modal,setModal]=useState(null);
  const [viejo,setViejo]=useState(()=>{ try{ return !!localStorage.getItem(OLD_KEY)&&!localStorage.getItem(OLD_KEY+'-respaldado'); }catch(e){ return false; } });
  const setDb=d=>setDbRaw(d);
  const save=d=>setDbRaw(autoRegistrar(d));
  const [nube,setNube]=useState(leerNube);
  const [sync,setSync]=useState(()=>({estado:leerNube().url?'ok':'off'}));
  const nubeRef=useRef(nube); const dbRef=useRef(db); dbRef.current=db;
  const deRemoto=useRef(false); const montado=useRef(false); const timer=useRef(null); const enCurso=useRef(false);
  const actNube=p=>{ const n={...nubeRef.current,...p}; nubeRef.current=n; escribirNube(n); setNube(n); };
  const aplicarRemoto=r=>{ deRemoto.current=true; setDbRaw(autoRegistrar(migrar(r.data))); actNube({rev:r.rev,dirty:false,ultima:r.updatedAt||new Date().toISOString()}); setSync({estado:'ok'}); };
  const subir=async(force=false)=>{
    const n=nubeRef.current; if(!n.url||!n.token) return; if(enCurso.current){ clearTimeout(timer.current); timer.current=setTimeout(()=>subir(force),1500); return; }
    enCurso.current=true; setSync({estado:'guardando'});
    try{ const r=await llamarNube(n.url,{action:'save',token:n.token,baseRev:n.rev||0,force,data:dbRef.current});
      if(r.ok){ actNube({rev:r.rev,dirty:false,ultima:new Date().toISOString()}); setSync({estado:'ok'}); }
      else if(r.conflict) setSync({estado:'conflicto',remoto:r});
      else setSync({estado:'error',msg:r.error||'No se pudo guardar en la nube.'}); }
    catch(e){ setSync({estado:'error',msg:'Sin conexión. Los cambios quedan en este dispositivo y se suben cuando vuelva.'}); }
    enCurso.current=false; };
  const bajar=async()=>{
    const n=nubeRef.current; if(!n.url||!n.token) return;
    try{ const r=await llamarNube(n.url,{action:'load',token:n.token});
      if(!r.ok){ setSync({estado:'error',msg:r.error||'No se pudo leer la nube.'}); return; }
      if(!r.data){ subir(true); return; }
      if((r.rev||0)>(n.rev||0)){ if(n.dirty) setSync({estado:'conflicto',remoto:r}); else aplicarRemoto(r); }
      else { setSync({estado:'ok'}); if(n.dirty) subir(); } }
    catch(e){ setSync({estado:'error',msg:'Sin conexión. Se usa la copia de este dispositivo.'}); } };
  const conectar=(url,token)=>{ actNube({url,token,rev:0,dirty:true}); setSync({estado:'guardando'}); bajar(); };
  const desconectar=()=>{ if(!confirm('¿Desconectar la sincronización? Los datos quedan en este dispositivo y en tu Drive.')) return; nubeRef.current={}; escribirNube({}); setNube({}); setSync({estado:'off'}); };
  useEffect(()=>{
    try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(db)); }catch(e){}
    if(!montado.current){ montado.current=true; return; }
    if(deRemoto.current){ deRemoto.current=false; return; }
    if(!nubeRef.current.url) return;
    actNube({dirty:true}); clearTimeout(timer.current); timer.current=setTimeout(()=>subir(),2000);
  },[db]);
  useEffect(()=>{ if(nubeRef.current.url) bajar(); const v=()=>{ if(document.visibilityState==='visible'&&nubeRef.current.url) bajar(); }; const on=()=>{ if(nubeRef.current.url) bajar(); }; document.addEventListener('visibilitychange',v); window.addEventListener('online',on); return ()=>{document.removeEventListener('visibilitychange',v);window.removeEventListener('online',on);}; },[]);
  useEffect(()=>{ const t=setInterval(()=>setDbRaw(d=>autoRegistrar(d)),60*60*1000); const v=()=>{ if(document.visibilityState==='visible') setDbRaw(d=>autoRegistrar(d)); }; document.addEventListener('visibilitychange',v); return ()=>{clearInterval(t);document.removeEventListener('visibilitychange',v);}; },[]);
  useEffect(()=>{ window.scrollTo(0,0); },[tab]);
  useEffect(()=>{ const osc=db.tema==='oscuro'; document.documentElement.setAttribute('data-theme',osc?'dark':'light'); const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content',osc?'#0F1724':'#16233A'); },[db.tema]);
  const abrir=(tipo,props={})=>setModal({tipo,props});
  const cerrar=()=>setModal(null);
  const mp={db,save,onClose:cerrar,abrir,...(modal?.props||{})};
  const respaldoViejo=()=>{ try{ const raw=localStorage.getItem(OLD_KEY); const b=new Blob([raw],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`finanzas_version_anterior_${hoyStr()}.json`; document.body.appendChild(a); a.click(); a.remove(); localStorage.setItem(OLD_KEY+'-respaldado','1'); }catch(e){} setViejo(false); };
  return <div className="app">
    <div className="top"><h1><Logo />JENT <span className="marca">Finanzas</span></h1><span style={{display:'flex',gap:8,alignItems:'center'}}>{sync.estado!=='off'&&<button className={'sync '+(sync.estado==='ok'?'ok':sync.estado==='error'?'err':sync.estado==='conflicto'?'conf':'')} onClick={()=>setTab('config')}>{sync.estado==='ok'?'☁︎ al día':sync.estado==='guardando'?'☁︎ guardando…':sync.estado==='conflicto'?'⚠ revisar':'⚠ sin nube'}</button>}<span className="fecha">{fL(hoyStr())}</span></span></div>
    {sync.estado==='conflicto'&&<div className="alert w"><div className="h">Hay cambios hechos en otro dispositivo</div><div className="b">La nube tiene datos más nuevos{sync.remoto?.updatedAt?` (del ${new Date(sync.remoto.updatedAt).toLocaleString('es-AR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})})`:''} y en este dispositivo también hay cambios sin subir. Elegí con cuáles te quedás.</div>
      <div className="btns" style={{marginTop:8}}><button className="btn sm pri" onClick={()=>aplicarRemoto(sync.remoto)}>Usar los de la nube</button><button className="btn sm" onClick={()=>subir(true)}>Quedarme con los de acá</button></div></div>}
    {viejo&&<div className="alert i"><div className="h">Datos de la versión anterior</div><div className="b">Esta versión arranca limpia desde el 20/10. Descargá el respaldo de los datos viejos por si alguna vez los necesitás.</div><div className="btns" style={{marginTop:8}}><button className="btn sm" onClick={respaldoViejo}>Descargar respaldo</button><button className="btn sm ghost" onClick={()=>{try{localStorage.setItem(OLD_KEY+'-respaldado','1');}catch(e){} setViejo(false);}}>No hace falta</button></div></div>}
    {tab==='inicio'&&<Inicio db={db} save={save} abrir={abrir} />}
    {tab==='movs'&&<Movimientos db={db} save={save} abrir={abrir} />}
    {tab==='tarjetas'&&<Tarjetas db={db} save={save} abrir={abrir} />}
    {tab==='cash'&&<Cashflow db={db} />}
    {tab==='rec'&&<Recurrentes db={db} save={save} abrir={abrir} />}
    {tab==='config'&&<Config db={db} save={save} abrir={abrir} setDb={d=>setDbRaw(autoRegistrar(d))} nubeProps={{nube,sync,conectar,desconectar,subir,bajar}} />}
    {modal?.tipo==='gasto'&&<FormGasto {...mp} />}
    {modal?.tipo==='ingreso'&&<FormIngreso {...mp} />}
    {modal?.tipo==='transfer'&&<FormTransfer {...mp} />}
    {modal?.tipo==='ahorro'&&<FormCaja {...mp} />}
    {modal?.tipo==='pagarRec'&&<FormPagarRec {...mp} />}
    {modal?.tipo==='moverCobro'&&<FormMoverCobro {...mp} />}
    {modal?.tipo==='confirmar'&&<FormConfirmar {...mp} />}
    {modal?.tipo==='pagarResumen'&&<FormPagarResumen {...mp} />}
    {modal?.tipo==='pagoUnico'&&<FormPagoUnico {...mp} e={modal.props.inicial} />}
    {modal?.tipo==='esperado'&&<FormEsperado {...mp} />}
    {modal?.tipo==='rec'&&<FormRec {...mp} />}
    {modal?.tipo==='ajuste'&&<FormAjuste {...mp} />}
    {modal?.tipo==='prestamo'&&<FormPrestamo {...mp} />}
    {modal?.tipo==='sueldo'&&<FormSueldo {...mp} />}
    {modal?.tipo==='resumenPDF'&&<FormResumenPDF {...mp} />}
    {modal?.tipo==='devolucion'&&<FormDevolucion {...mp} />}
    <nav className="nav"><div className="in">{TABS.map(([k,l,ic])=><button key={k} className={tab===k?'on':''} onClick={()=>setTab(k)} aria-current={tab===k?'page':undefined}><span className="ic">{ic}</span>{l}</button>)}</div></nav>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
