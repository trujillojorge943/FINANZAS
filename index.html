    --surface2: #F7F5F0;
    --border: #E5E2DB;
    --text: #1A1916;
    --text2: #6B6860;
    --text3: #A8A59E;

  body {

  .app { max-width: 520px; margin: 0 auto; padding: 0 12px 88px; }

  .page { display: none; padding-top: 16px; }
  .page.active { display: block; }

  .card { 
    background: var(--surface);

  .card-title {

  .row-label { color: var(--text2); flex: 1; font-size: 14px; }

  .alert-info { background: var(--accent-light); color: var(--accent); border: 1px solid #B8C9F5; }

function fmtDate(s) { return s ? s.split('-').reverse().join('/') : '-'; }
function fmtDateShort(s) { if (!s) return ''; const p = s.split('-'); return p[2]+'/'+p[1]; }
function diasHasta(f) {
  const h = new Date(); h.setHours(0,0,0,0);
  const t = new Date(f+'T12:00:00'); t.setHours(0,0,0,0);
  const d = Math.round((t-h)/864e5);
  return d===0?'Hoy':d<0?'Vencido':`En ${d}d`;
}
function getLunes(offset) {
  const hoy = new Date(); hoy.setHours(12,0,0,0);
  const lun = new Date(hoy);
  lun.setDate(hoy.getDate() - (hoy.getDay()===0?6:hoy.getDay()-1));
  lun.setDate(lun.getDate() + offset*7);
  return lun.toISOString().split('T')[0];
}
function getDomingo(lunes) {
  const d = new Date(lunes+'T12:00:00'); d.setDate(d.getDate()+6);
  return d.toISOString().split('T')[0];
}
function getViernes(lunes) {
  const d = new Date(lunes+'T12:00:00'); d.setDate(d.getDate()+4);
  return d.toISOString().split('T')[0];
}
function inRange(fecha, lunes, domingo) {
  const f = new Date(fecha+'T12:00:00');
  const l = new Date(lunes+'T12:00:00');
  const d = new Date(domingo+'T12:00:00');
  return f>=l && f<=d;
}
function getViernesActual() {
  const d = new Date();
  d.setHours(12,0,0,0);
  const dow = d.getDay();
  const diff = (5-dow+7)%7||7;
  d.setDate(d.getDate()+diff);
  return d.toISOString().split('T')[0];
}

  try { const d = localStorage.getItem(STORAGE_KEY); return d ? JSON.parse(d) : null; } catch { return null; }

function exportData(data) {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `finanzas_jorge_${today}.json`; a.click();

  const r = new FileReader();
  r.onload = e => { try { callback(JSON.parse(e.target.result)); } catch { alert('Archivo inválido'); } };
  r.readAsText(file);

function agruparPorSemana(items, fechaKey='fecha') {
  const grupos = {};
  items.forEach(item => {
    const fecha = new Date(item[fechaKey]+'T12:00:00');
    const lunes = new Date(fecha);
    lunes.setDate(fecha.getDate() - (fecha.getDay()===0?6:fecha.getDay()-1));
    const key = lunes.toISOString().split('T')[0];
    if(!grupos[key]) grupos[key] = [];
    grupos[key].push(item);
  });
  return Object.entries(grupos).sort((a,b)=>b[0].localeCompare(a[0]));
}
function semanaLabel(lunesStr) {
  const l = new Date(lunesStr+'T12:00:00');
  const d = new Date(lunesStr+'T12:00:00'); d.setDate(d.getDate()+6);
  return `${d.getDate()}/${d.getMonth()+1} al ${l.getDate()}/${l.getMonth()+1}`;
}

function Dashboard({cuentas, vencimientos, gastosVariables, ingresosExtra, presupuestoVar, gastosFijos, setGastosFijos, gastosSemPagados, sueldosCobrados, naranja, bbvaTarjeta}) {
  const bbvaCuenta = cuentas.find(c=>c.nombre==='BBVA');
  const saldo = bbvaCuenta ? bbvaCuenta.saldo : 0;
  const sc = saldo<0?'#A32D2D':saldo<200000?'#854F0B':'#185FA5';

  // Calcular total de tarjetas dinámicamente
  const totalNaranja = totalTarjeta(naranja,false);
  const totalBBVA = totalTarjeta(bbvaTarjeta,false);

  // Para cada tarjeta: si tiene pago registrado para el resumen actual → mostrar próximo vencimiento
  const getVencTarjeta = (tarjeta, nombre) => {
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    const tienePagoActual = (tarjeta.pagos||[]).length > 0;

    // Si hay historial y el vencimiento del último resumen no pasó y no está pagado → mostrarlo
    const ultimoH = (tarjeta.historial||[]).length > 0 ? tarjeta.historial[tarjeta.historial.length-1] : null;
    if(ultimoH && !tienePagoActual) {
      const vencD = new Date(ultimoH.vencimiento+'T12:00:00');
      if(vencD >= hoy) {
        return {nombre, fecha: ultimoH.vencimiento, monto: ultimoH.total||ultimoH.saldoBase, tipo:'gasto', pagado: false};
      }
    }

    // Si el pago actual ya está hecho o el vencimiento pasó → mostrar próximo resumen
    if(tienePagoActual || (ultimoH && new Date(ultimoH.vencimiento+'T12:00:00') < hoy)) {
      const totalProximo = totalTarjeta(tarjeta,false);
      if(totalProximo <= 0) return null;
      return {nombre, fecha: tarjeta.vencimiento, monto: totalProximo, tipo:'gasto', pagado: false};
    }

    // Sin historial — mostrar resumen actual
    if(tienePagoActual) return null;
    const totalActual = totalTarjeta(tarjeta,false);
    if(totalActual <= 0) return null;
    return {nombre, fecha: tarjeta.vencimiento, monto: totalActual, tipo:'gasto', pagado: false};
  };
  const vencNaranja = getVencTarjeta(naranja, 'Naranja X');
  const vencBBVA = getVencTarjeta(bbvaTarjeta, 'BBVA Visa');
  const vencTarjetas = [vencNaranja, vencBBVA].filter(Boolean);
  const vencSinTarjetas = vencimientos.filter(v=>!v.nombre.toLowerCase().includes('naranja')&&!v.nombre.toLowerCase().includes('bbva'));
  const sorted = [...vencTarjetas,...vencSinTarjetas].filter(x=>!x.pagado).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha)).slice(0,5);
  return (
    <div>

      <div className="metric-grid">
        <div className="metric"><div className="metric-label">Saldo disponible</div><div className="metric-value" style={{color:sc}}>{fmt(saldo)}</div></div>
      </div>

      {saldo<0 && <div className="alert alert-danger">⚠️ Saldo negativo. Revisá tus gastos.</div>}
    
      <div className="card">
        <div className="card-title">Próximos vencimientos</div>
        {sorted.length===0 && <div style={{color:'#78716c',fontSize:13}}>Sin vencimientos pendientes.</div>}
        {sorted.map(v=>(
          <div key={v.id} className="row">
            <div className="row-label">{v.nombre}<br/><span style={{fontSize:11,color:'#a8a29e'}}>{fmtDate(v.fecha)} · {diasHasta(v.fecha)}</span></div>
            <span className="row-val" style={{color:v.tipo==='ingreso'?'#3B6D11':'#A32D2D'}}>{v.tipo==='ingreso'?'+':''}{fmt(v.monto)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ---- VARIABLES ----
function Variables({gastosVariables, setGastosVariables, categorias, setCategorias, gastosSem, cuentas, setCuentas, naranja, setNaranja, bbva, setBbva}) {
  const [showAdd, setShowAdd] = useState(false);
  const [editId, setEditId] = useState(null);
  const [editVals, setEditVals] = useState({});
  const [newV, setNewV] = useState({desc:'', cat:categorias[0]||'Otro', monto:'', fecha:today, cuenta:'BBVA'});
  const [showAllGastos, setShowAllGastos] = useState(false);
  const [filtroCat, setFiltroCat] = useState('todas');
  const [filtroEstado, setFiltroEstado] = useState('todos');
  const [filtroPeriodo, setFiltroPeriodo] = useState('todo');
  const [showFiltros, setShowFiltros] = useState(false);
  const excluidos = (gastosSem||[]).map(g=>g.desc.toLowerCase());
  const esExcluido = desc => excluidos.some(e=>desc.toLowerCase().includes(e));
  const getPeriodoRange = (periodo) => {
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    if(periodo==='dia') {
      return [hoy.toISOString().split('T')[0], hoy.toISOString().split('T')[0]];
    } else if(periodo==='semana') {
      const lun = new Date(hoy); lun.setDate(hoy.getDate()-(hoy.getDay()===0?6:hoy.getDay()-1));
      const dom = new Date(lun); dom.setDate(lun.getDate()+6);
      return [lun.toISOString().split('T')[0], dom.toISOString().split('T')[0]];
    } else if(periodo==='mes') {
      const ini = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
      const fin = new Date(hoy.getFullYear(), hoy.getMonth()+1, 0);
      return [ini.toISOString().split('T')[0], fin.toISOString().split('T')[0]];
    }
    return [null, null];
  };
  const [desde, hasta] = getPeriodoRange(filtroPeriodo);
  const gastosFiltrados = gastosVariables.filter(g => {
    if(filtroCat!=='todas' && g.cat!==filtroCat) return false;
    if(filtroEstado==='pagado' && !g.pagado) return false;
    if(filtroEstado==='pendiente' && g.pagado) return false;
    if(desde && g.fecha < desde) return false;
    if(hasta && g.fecha > hasta) return false;
    return true;
  });
  const total = gastosVariables.reduce((a,b)=>a+b.monto,0);
  const totalFiltrado = gastosFiltrados.reduce((a,b)=>a+b.monto,0);
  const hayFiltros = filtroCat!=='todas'||filtroEstado!=='todos'||filtroPeriodo!=='todo';

  return (
    <div>
      <div className="card">
        <div className="card-title">Registrar gasto <BtnAdd onClick={()=>setShowAdd(!showAdd)} /></div>
        {showAdd && (
          <Modal title="Registrar gasto" onClose={()=>setShowAdd(false)}>
            <MFormRow label="Descripción"><input value={newV.desc} onChange={e=>setNewV({...newV,desc:e.target.value})} placeholder="Ej: Cena" /></MFormRow>
            <MFormRow label="Categoría">
              <select value={newV.cat} onChange={e=>setNewV({...newV,cat:e.target.value})}>
                {categorias.map(c=><option key={c} value={c}>{c}</option>)}
              </select>
            </MFormRow>

              <option value="Efectivo">💵 Efectivo</option>

            {newV.cuenta==='Tarjeta' && (
              <div>

                  <option value="z">Cuotas sin interés</option>
                </select></MFormRow>
                {newV.pago==='z' && <MFormRow label="Cuotas"><select value={newV.cuotas||'3'} onChange={e=>setNewV({...newV,cuotas:e.target.value})}>
                  <option value="2">2</option><option value="3">3</option><option value="6">6</option><option value="12">12</option>
                </select></MFormRow>}
                {newV.pago==='z' && newV.monto && <div className="alert alert-info" style={{marginBottom:8,fontSize:12}}>1ra cuota: <strong>{fmt(Math.round(parseFloat(newV.monto)/parseInt(newV.cuotas||3)))}</strong></div>}
                {newV.fecha>(newV.tarjeta==='naranja'?naranja.cierre:bbva.cierre) && <div className="alert alert-warning" style={{marginBottom:8,fontSize:12}}>📅 Fecha posterior al cierre → próximo resumen</div>}
              </div>
            )}
            {newV.desc && esExcluido(newV.desc) && <div className="alert alert-warning" style={{marginBottom:8,fontSize:12}}>⚠️ Este gasto está en Semanales.</div>}
            <div className="modal-actions">
              <button className="btn-save" onClick={()=>{
                if(!newV.desc||!newV.monto||esExcluido(newV.desc)) return;
                const monto = parseFloat(newV.monto);
                if(newV.cuenta==='Tarjeta') {
                  const esCuotas = newV.pago==='z';
                  const cuotas = esCuotas ? parseInt(newV.cuotas||3) : 1;
                  const montoCuota = esCuotas ? Math.round(monto/cuotas) : monto;
                  const tarjetaObj = newV.tarjeta==='naranja' ? naranja : bbva;
                  const setTarjetaFn = newV.tarjeta==='naranja' ? setNaranja : setBbva;
                  const esProximo = newV.fecha > tarjetaObj.cierre;
                  const nuevoConsumo = {id:Date.now(),desc:newV.desc,cat:newV.cat,montoTotal:monto,montoCuota,cuotas,esCuotas,fecha:newV.fecha,esProximo};
                  setTarjetaFn({...tarjetaObj, consumosNuevos:[...tarjetaObj.consumosNuevos, nuevoConsumo]});
                } else {
                  setGastosVariables([{id:Date.now(),desc:newV.desc,cat:newV.cat,monto,fecha:newV.fecha,cuenta:newV.cuenta||'BBVA',pagado:false},...gastosVariables]);
                }
                setNewV({desc:'',cat:categorias[0]||'Otro',monto:'',fecha:today,cuenta:'BBVA'});
                setShowAdd(false);
              }}>Guardar</button>
              <button className="btn-cancel" onClick={()=>setShowAdd(false)}>Cancelar</button>
            </div>
          </Modal>

                <select style={{fontSize:12,padding:'6px 10px',border:'1.5px solid var(--border)',borderRadius:8,flex:1}} value={filtroEstado} onChange={e=>setFiltroEstado(e.target.value)}>

function Ingresos({ingresosExtra, setIngresosExtra, tiposIngreso, cuentas, setCuentas}) {
  const [showAdd, setShowAdd] = useState(false);
  const [filtro, setFiltro] = useState('todos');

  const [editVals, setEditVals] = useState({});
  const [newI, setNewI] = useState({desc:'', tipo:'sueldo', monto:'', fecha:today, cuenta:'BBVA'});
  const [showAllIng, setShowAllIng] = useState(false);

  const getPeriodoRange = (periodo) => {
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    if(periodo==='dia') return [hoy.toISOString().split('T')[0], hoy.toISOString().split('T')[0]];
    if(periodo==='semana') {
      const lun = new Date(hoy); lun.setDate(hoy.getDate()-(hoy.getDay()===0?6:hoy.getDay()-1));
      const dom = new Date(lun); dom.setDate(lun.getDate()+6);
      return [lun.toISOString().split('T')[0], dom.toISOString().split('T')[0]];
    }
    if(periodo==='mes') {
      const ini = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
      const fin = new Date(hoy.getFullYear(), hoy.getMonth()+1, 0);
      return [ini.toISOString().split('T')[0], fin.toISOString().split('T')[0]];
    }
    return [null, null];
  };
  const [desde, hasta] = getPeriodoRange(filtroPeriodo);

  const filtrados = ingresosExtra.filter(x => {
    if(filtro!=='todos' && x.tipo!==filtro) return false;
    if(desde && x.fecha < desde) return false;
    if(hasta && x.fecha > hasta) return false;
    return true;
  });
  const totalFiltrado = filtrados.reduce((a,b)=>a+b.monto,0);
  const totalSueldos = ingresosExtra.filter(x=>x.tipo==='sueldo').reduce((a,b)=>a+b.monto,0);
  const totalShows = ingresosExtra.filter(x=>x.tipo==='show').reduce((a,b)=>a+b.monto,0);
  const totalTrabajos = ingresosExtra.filter(x=>x.tipo==='trabajo').reduce((a,b)=>a+b.monto,0);

  return (
    <div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:12}}>
        <div className="metric"><div className="metric-label">Sueldos</div><div className="metric-value" style={{color:'#3B6D11',fontSize:15}}>{fmt(totalSueldos)}</div></div>
        <div className="metric"><div className="metric-label">Shows</div><div className="metric-value" style={{color:'#3B6D11',fontSize:15}}>{fmt(totalShows)}</div></div>
        <div className="metric"><div className="metric-label">Trabajos</div><div className="metric-value" style={{color:'#3B6D11',fontSize:15}}>{fmt(totalTrabajos)}</div></div>
      </div>

      <div className="card">
        <div className="card-title">Registrar ingreso <BtnAdd onClick={()=>setShowAdd(!showAdd)} /></div>
        {showAdd && (
          <FormBox>
            <FormRow label="Tipo">
              <select value={newI.tipo} onChange={e=>setNewI({...newI,tipo:e.target.value})}>

              </select>
            </FormRow>
            <FormRow label="Descripción"><input value={newI.desc} onChange={e=>setNewI({...newI,desc:e.target.value})} placeholder="Ej: Sueldo semana 1" /></FormRow>
            <FormRow label="Monto"><input type="number" value={newI.monto} onChange={e=>setNewI({...newI,monto:e.target.value})} /></FormRow>
            <FormRow label="Fecha"><input type="date" value={newI.fecha} onChange={e=>setNewI({...newI,fecha:e.target.value})} /></FormRow>
            <FormRow label="Cuenta"><select value={newI.cuenta||'BBVA'} onChange={e=>setNewI({...newI,cuenta:e.target.value})}>
              {cuentas.map(c=><option key={c.id} value={c.nombre}>{c.icono} {c.nombre}</option>)}
              <option value="Efectivo">💵 Efectivo</option>
            </select></FormRow>
            <div style={{display:'flex',gap:8,marginTop:8}}>
              <button className="btn-save" onClick={()=>{
                if(!newI.monto) return;
                setIngresosExtra([{id:Date.now(),desc:newI.desc||newI.tipo,tipo:newI.tipo,monto:parseFloat(newI.monto),fecha:newI.fecha,cobrado:false,cuenta:newI.cuenta||'BBVA'},...ingresosExtra]);
                setNewI({desc:'',tipo:'sueldo',monto:'',fecha:today});
                setShowAdd(false);
              }}>Guardar</button>
              <button className="btn-cancel" onClick={()=>setShowAdd(false)}>Cancelar</button>
            </div>
          </FormBox>
        )}

        <div className="tab-pills" style={{marginTop:12}}>
          {['todos','sueldo','show','trabajo'].map(f=>(
            <button key={f} className={`tab-pill ${filtro===f?'active':''}`} onClick={()=>setFiltro(f)}>

        <div style={{display:'flex',gap:6,marginBottom:10}}>
          {['todo','dia','semana','mes'].map(p=>(

              {p==='todo'?'Todo':p==='dia'?'Hoy':p==='semana'?'Semana':'Mes'}

            <span style={{fontSize:13,color:'var(--success)',fontWeight:600}}>{filtrados.length} ingreso{filtrados.length!==1?'s':''}</span>
            <span style={{fontSize:16,fontWeight:700,color:'var(--success)',fontFamily:'DM Mono,monospace'}}>+{fmt(totalFiltrado)}</span>
          </div>
        )}

        {filtrados.length===0 && <div style={{fontSize:13,color:'#a8a29e',padding:'8px 0'}}>Sin ingresos.</div>}
        {(showAllIng ? filtrados : filtrados.slice(0,10)).map(g=>(
          <div key={g.id}>
            {editId===g.id ? (
              <FormBox>
                <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
                  <input style={{flex:1,minWidth:100,fontSize:13,padding:'6px 8px',border:'1px solid #e7e5e4',borderRadius:6}} value={editVals.desc||''} onChange={e=>setEditVals({...editVals,desc:e.target.value})} />
                  <input type="number" style={{width:110,fontSize:13,padding:'6px 8px',border:'1px solid #e7e5e4',borderRadius:6}} value={editVals.monto||''} onChange={e=>setEditVals({...editVals,monto:e.target.value})} />
                  <input type="date" style={{fontSize:13,padding:'6px 8px',border:'1px solid #e7e5e4',borderRadius:6}} value={editVals.fecha||''} onChange={e=>setEditVals({...editVals,fecha:e.target.value})} />
                  <button className="btn-save" onClick={()=>{setIngresosExtra(ingresosExtra.map(x=>x.id===g.id?{...x,desc:editVals.desc,monto:parseFloat(editVals.monto),fecha:editVals.fecha||x.fecha}:x));setEditId(null);}}>Guardar</button>
                  <button className="btn-cancel" onClick={()=>setEditId(null)}>Cancelar</button>
                </div>
              </FormBox>
            ) : (
              <div className="row">
                <div style={{display:'flex',alignItems:'center',gap:8,flex:1}}>
                  <Tilde checked={!!g.cobrado} onClick={()=>{
                    if(g._procesando) return;
                    const nuevoCobrado = !g.cobrado;
                    const updated = ingresosExtra.map(x=>x.id===g.id?{...x,cobrado:nuevoCobrado}:x);
                    setIngresosExtra(updated);
                    const cuenta = g.cuenta||'BBVA';
                    const delta = nuevoCobrado ? g.monto : -g.monto;
                    setCuentas(prev=>prev.map(c=>c.nombre===cuenta?{
                      ...c,
                      saldo: c.saldo+delta,
                      movimientos: !nuevoCobrado
                        ? (c.movimientos||[]).filter(m=>m.refId!==g.id)
                        : [{id:Date.now(),refId:g.id,desc:g.desc,monto:g.monto,tipo:'ingreso',fecha:g.fecha},...(c.movimientos||[])]
                    }:c));
                  }} />
                  <div style={{opacity:g.cobrado?0.5:1}}>
                    <span style={{textDecoration:g.cobrado?'line-through':'none'}}><Badge text={g.tipo==='sueldo'?'Sueldo':g.tipo==='show'?'Show':'Trabajo'} color={g.tipo==='sueldo'?'info':g.tipo==='show'?'success':'purple'} /> {g.desc}</span>
                    <br/><span style={{fontSize:11,color:'#a8a29e'}}>{g.fecha} · </span>
                    <select style={{fontSize:11,border:'none',background:'transparent',color:'#185FA5',cursor:'pointer'}} value={g.cuenta||'BBVA'} onChange={e=>setIngresosExtra(ingresosExtra.map(x=>x.id===g.id?{...x,cuenta:e.target.value}:x))}>
                      {cuentas.map(c=><option key={c.id} value={c.nombre}>{c.nombre}</option>)}
                      <option value="Efectivo">Efectivo</option>
                    </select>
                  </div>

                <div style={{display:'flex',alignItems:'center',gap:4}}>
                  <span className="row-val" style={{color:g.cobrado?'#a8a29e':'#3B6D11'}}>+{fmt(g.monto)}</span>

                  <button className="btn-icon" onClick={()=>setIngresosExtra(ingresosExtra.filter(x=>x.id!==g.id))}>🗑</button>
                </div>
              </div>
            )}
          </div>
        ))}
        {filtrados.length > 10 && <button className="btn-add" style={{width:'100%',marginTop:8}} onClick={()=>setShowAllIng(!showAllIng)}>{showAllIng ? '▲ Ver menos' : `▼ Ver todos (${filtrados.length})`}</button>}
      </div>
    </div>
  );
}

// ---- PROYECCION (v12: basada en datos) ----
function addDays(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().split('T')[0];}
function addMonths(s,n){const d=new Date(s+'T12:00:00');d.setMonth(d.getMonth()+n);return d.toISOString().split('T')[0];}
function viernesAntesDe(fecha){const d=new Date(fecha+'T12:00:00');while(d.getDay()!==5)d.setDate(d.getDate()-1);return d.toISOString().split('T')[0];}
function totalTarjeta(t, incluirTerceros=true){
  const base=(t.consumosBase||[]).filter(c=>incluirTerceros||!c.tercero).reduce((a,b)=>a+b.monto,0);
  const nuevos=(t.consumosNuevos||[]).filter(c=>!c.esProximo&&(incluirTerceros||!c.tercero)).reduce((a,b)=>a+b.montoCuota,0);
  return (t.saldoBase||0)+base+nuevos;
}

function construirEventos({desde, hasta, sueldoCfg, ingresosExtra, vencFijos, vencimientos, gastosSem, naranja, bbva}){
  const ev=[]; // {fecha, grupo, desc, monto(+/-), tentativo}
  const dentro=f=>f>desde&&f<=hasta;
  // Sueldo semanal automático (cada viernes) con ajustes (adelantos)
  if(sueldoCfg&&sueldoCfg.activo){
    const ajustes=sueldoCfg.ajustes||[];
    let f=addDays(desde,1); while(new Date(f+'T12:00:00').getDay()!==5) f=addDays(f,1);
    for(;f<=hasta;f=addDays(f,7)){
      const yaCargado=ingresosExtra.some(x=>x.tipo==='sueldo'&&x.fecha===f);
      if(yaCargado) continue;
      const aj=ajustes.find(a=>a.original===f);
      const fechaReal=aj?aj.nueva:f;
      if(dentro(fechaReal)) ev.push({fecha:fechaReal,grupo:'ingreso',desc:aj?`Sueldo (adelanto del ${fmtDateShort(f)})`:'Sueldo',monto:sueldoCfg.monto});
    }
  }
  // Ingresos cargados (los shows van al ahorro y no suman al disponible)
  ingresosExtra.filter(x=>dentro(x.fecha)).forEach(x=>{
    if(x.tipo==='show') ev.push({fecha:x.fecha,grupo:'show',desc:x.desc+(x.cobrado?' ✓':''),monto:x.monto,tentativo:x.tentativo});
    else ev.push({fecha:x.fecha,grupo:'ingreso',desc:x.desc,monto:x.monto,tentativo:x.tentativo});
  });
  // Fijos mensuales: se pagan el viernes anterior o igual al día de vencimiento
  (vencFijos||[]).forEach(v=>{
    if(v.activo===false) return;
    for(let k=0;k<4;k++){
      const base=new Date(desde+'T12:00:00'); base.setDate(1); base.setMonth(base.getMonth()+k);
      const dia=String(Math.min(v.dia,28)).padStart(2,'0');
      const venc=base.toISOString().slice(0,8)+dia;
      const mes=venc.slice(0,7);
      if(v.pagado&&v.mesPago===mes) continue;
      const fp=v.viernesAntes===false?venc:viernesAntesDe(venc);
      if(dentro(fp)) ev.push({fecha:fp,grupo:'fijo',desc:`${v.nombre} (vence ${fmtDateShort(venc)})`,monto:-v.monto});
    }
  });
  // Pagos únicos / vencimientos cargados
  (vencimientos||[]).filter(v=>!v.pagado&&dentro(v.fecha)).forEach(v=>{
    ev.push({fecha:v.fecha,grupo:'unico',desc:v.nombre+(v.tentativo?' (a confirmar)':''),monto:v.tipo==='ingreso'?v.monto:-v.monto,tentativo:v.tentativo});
  });
  // Gastos semanales recurrentes (se cuentan el viernes)
  (gastosSem||[]).forEach(g=>{
    if(g.activo===false) return;
    const cada=g.cadaSemanas||1;
    let f=addDays(desde,1); while(new Date(f+'T12:00:00').getDay()!==5) f=addDays(f,1);
    for(;f<=hasta;f=addDays(f,7)){
      if(cada>1&&g.desde){const dif=Math.round((new Date(f+'T12:00:00')-new Date(g.desde+'T12:00:00'))/(7*864e5));if(dif<0||dif%cada!==0)continue;}
      ev.push({fecha:f,grupo:'semanal',desc:g.desc,monto:-g.monto});
    }
  });
  // Tarjetas: próximo resumen + estimación de los siguientes con cuotas pendientes
  [[naranja,'Naranja X','naranja'],[bbva,'BBVA','bbva']].forEach(([t,nombre,grupo])=>{
    if(!t||!t.vencimiento) return;
    const total=totalTarjeta(t,false);
    if(dentro(t.vencimiento)&&total>0) ev.push({fecha:t.vencimiento,grupo,desc:`${nombre} vence ${fmtDateShort(t.vencimiento)}`,monto:-total});
    for(let k=1;k<=3;k++){
      const f=addMonths(t.vencimiento,k);
      const cuotas=(t.consumosBase||[]).filter(c=>c.esCuotaFutura&&!c.tercero&&(c.cuotasRestantes||0)>k).reduce((a,b)=>a+(b.montoCuota||b.monto),0)
        +(t.consumosNuevos||[]).filter(c=>c.esCuotas&&!c.tercero&&(c.cuotas||1)>k).reduce((a,b)=>a+b.montoCuota,0)
        +(t.fijosMensuales||0);
      if(dentro(f)&&cuotas>0) ev.push({fecha:f,grupo,desc:`${nombre} ~${fmtDateShort(f)} (estimado: cuotas y fijos)`,monto:-cuotas,tentativo:true});
    }
  });
  return ev;
}

function Proyeccion({naranja, bbva, cuentas, saldoInicialProy, setSaldoInicialProy, fechaSaldoProy, setFechaSaldoProy, ingresosExtra, vencimientos, vencFijos, gastosSem, gastosVariables, sueldoCfg, variosSemanal}) {
  const [tooltip, setTooltip] = useState(null);
  const [editSaldo, setEditSaldo] = useState(false);
  const [vals, setVals] = useState({saldo:saldoInicialProy||0, fecha:fechaSaldoProy||today});
  const hoy = new Date(); hoy.setHours(0,0,0,0);

  const desde = fechaSaldoProy || addDays(today,-1);
  const saldoIni = saldoInicialProy ?? (cuentas.find(c=>c.nombre==='BBVA')?.saldo || 0);
  const semanas = Array.from({length:12},(_,i)=>{const l=(()=>{const d=new Date(desde+'T12:00:00');d.setDate(d.getDate()-(d.getDay()===0?6:d.getDay()-1)+i*7);return d.toISOString().split('T')[0];})();return {lunes:l,domingo:getDomingo(l)};});
  const hasta = semanas[semanas.length-1].domingo;
  const eventos = construirEventos({desde, hasta, sueldoCfg, ingresosExtra, vencFijos, vencimientos, gastosSem, naranja, bbva});

  const filas = [
    {grupo:'ingreso', label:'💰 Sueldo e ingresos', color:'#3B6D11', bg:'white'},
    {grupo:'fijo', label:'🏠 Fijos del mes', color:'#854F0B', bg:'#FFF7ED'},
    {grupo:'unico', label:'📌 Pagos únicos', color:'#854F0B', bg:'#FFF7ED'},
    {grupo:'semanal', label:'🍽 Semanales', color:'#854F0B', bg:'#FFF7ED'},
    {grupo:'varios', label:'🛒 Gastos varios', color:'#854F0B', bg:'#FFF7ED'},
    {grupo:'naranja', label:'💳 Naranja X', color:'#A32D2D', bg:'white'},
    {grupo:'bbva', label:'💳 BBVA', color:'#A32D2D', bg:'#FAFAF9'},
  ];

  // Gastos varios: presupuesto semanal, o lo registrado si fue mayor (sin tarjeta)
  const variosSemana = sem => {
    const reg = gastosVariables.filter(x=>x.cuenta!=='Tarjeta'&&inRange(x.fecha,sem.lunes,sem.domingo)&&x.fecha>desde).reduce((a,b)=>a+b.monto,0);
    const dias = Math.max(0, Math.round((new Date(sem.domingo+'T12:00:00')-new Date(Math.max(new Date(sem.lunes+'T12:00:00'), new Date(addDays(desde,1)+'T12:00:00'))))/864e5)+1);
    const presu = Math.round((variosSemanal||0)*Math.min(7,dias)/7);
    const m = Math.max(reg, presu);
    return m>0?[{fecha:sem.domingo,grupo:'varios',desc:reg>presu?'Gastos varios registrados':'Presupuesto gastos varios',monto:-m}]:[];
  };
  const evSemana = sem => [...eventos.filter(e=>inRange(e.fecha,sem.lunes,sem.domingo)), ...variosSemana(sem)];

  const show = (e, items) => { if(!items.length) return; setTooltip({items}); };
  let acum = saldoIni;
  const proyectados = semanas.map(sem=>{ const d=evSemana(sem).filter(e=>e.grupo!=='show').reduce((a,b)=>a+b.monto,0); acum+=d; return {d, saldo:acum}; });
  const ahorroShows = eventos.filter(e=>e.grupo==='show').reduce((a,b)=>a+b.monto,0);
  const minimo = Math.min(...proyectados.map(p=>p.saldo));
  const saldoReal = cuentas.find(c=>c.nombre==='BBVA')?.saldo;

  return (
    <div>
      <div className="card">
        <div className="card-title">Punto de partida</div>
        {!editSaldo ? (
          <div className="row">
            <span className="row-label">Saldo al {fmtDate(desde)}</span>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <span style={{fontWeight:700}}>{fmt(saldoIni)}</span>
              <button className="btn-icon" onClick={()=>{setVals({saldo:saldoIni,fecha:desde});setEditSaldo(true);}}>✏️</button>
            </div>
          </div>
        ) : (
          <FormBox>
            <FormRow label="Saldo disponible"><input type="number" value={vals.saldo} onChange={e=>setVals({...vals,saldo:e.target.value})} /></FormRow>
            <FormRow label="A la fecha"><input type="date" value={vals.fecha} onChange={e=>setVals({...vals,fecha:e.target.value})} /></FormRow>
            <div style={{display:'flex',gap:8,marginTop:8}}>
              <button className="btn-save" onClick={()=>{setSaldoInicialProy(parseFloat(vals.saldo)||0);setFechaSaldoProy(vals.fecha);setEditSaldo(false);}}>Guardar</button>
              <button className="btn-cancel" onClick={()=>setEditSaldo(false)}>Cancelar</button>
            </div>
          </FormBox>
        )}
        <div style={{fontSize:12,color:'#78716c',marginTop:8}}>
          Punto más bajo: <b style={{color:minimo<0?'#A32D2D':'#185FA5'}}>{fmt(minimo)}</b>
          {ahorroShows>0 && <> · Shows al ahorro: <b style={{color:'#3B6D11'}}>{fmt(ahorroShows)}</b></>}
        </div>
      </div>

      <div className="proj-wrap">
        <table className="proj-table">
          <thead>
            <tr>
              <td className="sticky-col-header">Concepto</td>
              {semanas.map((sem,i)=>{
                const alert=evSemana(sem).some(e=>e.grupo==='naranja'||e.grupo==='bbva');
                return <td key={i} style={{textAlign:'center',color:alert?'#A32D2D':'#57534e'}}>
                  {fmtDateShort(sem.lunes)}<br/><span style={{fontSize:10,fontWeight:400,color:'#a8a29e'}}>al {fmtDateShort(sem.domingo)}</span>{alert&&<><br/>🔴</>}
                </td>;
              })}
            </tr>
          </thead>
          <tbody>
            {filas.map(f=>(
              <tr key={f.grupo} style={{background:f.bg}}>
                <td className="sticky-col" style={{background:f.bg,color:f.color,fontSize:11,fontWeight:600}}>{f.label}</td>
                {semanas.map((sem,i)=>{
                  const its=evSemana(sem).filter(e=>e.grupo===f.grupo);
                  const tot=its.reduce((a,b)=>a+b.monto,0);
                  const tent=its.some(e=>e.tentativo);
                  return <td key={i} style={{textAlign:'center',color:tot===0?'#d6d3d1':tot>0?'#3B6D11':f.color,fontWeight:tot!==0?600:400,cursor:its.length?'pointer':'default'}}
                    onClick={e=>show(e,its.map(x=>({desc:`${fmtDateShort(x.fecha)} · ${x.desc}`,monto:Math.abs(x.monto),signo:x.monto>0?'+':'-',color:x.monto>0?'#3B6D11':'#A32D2D'})))}>
                    {tot===0?'—':<>{tot>0?'+':'-'}{fmt(Math.abs(tot))}{tent&&<span style={{color:'#a8a29e'}}> ?</span>}</>}
                  </td>;
                })}
              </tr>
            ))}
            <tr style={{background:'#F2F8EC'}}>
              <td className="sticky-col" style={{background:'#F2F8EC',color:'#3B6D11',fontSize:11,fontWeight:600}}>🎸 Shows → ahorro</td>
              {semanas.map((sem,i)=>{
                const its=evSemana(sem).filter(e=>e.grupo==='show'); const tot=its.reduce((a,b)=>a+b.monto,0);
                return <td key={i} style={{textAlign:'center',color:tot?'#3B6D11':'#d6d3d1',cursor:its.length?'pointer':'default'}} onClick={e=>show(e,its.map(x=>({desc:`${fmtDateShort(x.fecha)} · ${x.desc}`,monto:x.monto,signo:'+',color:'#3B6D11'})))}>{tot?`+${fmt(tot)}`:'—'}</td>;
              })}
            </tr>
            <tr style={{borderTop:'2px solid #44403c',background:'#F0EEE8'}}>
              <td className="sticky-col" style={{background:'#F0EEE8',fontWeight:700}}>Balance sem.</td>
              {proyectados.map((p,i)=><td key={i} style={{textAlign:'center',color:p.d>=0?'#3B6D11':'#A32D2D',fontWeight:700,background:'#F0EEE8'}}>{p.d>=0?'+':''}{fmt(p.d)}</td>)}
            </tr>
            <tr style={{background:'#EAF3DE'}}>
              <td className="sticky-col" style={{background:'#EAF3DE',fontWeight:700,fontSize:12}}>📊 Proyectado</td>
              {proyectados.map((p,i)=>{const c=p.saldo<0?'#A32D2D':p.saldo<100000?'#854F0B':'#185FA5';return <td key={i} style={{textAlign:'center',color:c,fontWeight:700,background:p.saldo<0?'#FCEBEB':'#EAF3DE'}}>{fmt(p.saldo)}</td>;})}
            </tr>
            <tr style={{background:'#E6F1FB'}}>
              <td className="sticky-col" style={{background:'#E6F1FB',fontWeight:700,fontSize:12}}>✅ Real</td>
              {semanas.map((sem,i)=>{
                const actual=sem.lunes<=today&&sem.domingo>=today;
                return <td key={i} style={{textAlign:'center',color:actual?'#185FA5':'#d6d3d1',fontWeight:700,background:'#E6F1FB'}}>{actual&&saldoReal!==undefined?fmt(saldoReal):'—'}</td>;
              })}
            </tr>
          </tbody>
        </table>
      </div>
      <div style={{fontSize:11,color:'#a8a29e',padding:'8px 4px'}}>Tocá una celda para ver el detalle. "?" = monto estimado o a confirmar. Los shows van al ahorro y no suman al disponible.</div>

    {tooltip && (
      <div onClick={()=>setTooltip(null)} style={{position:'fixed',top:0,left:0,right:0,bottom:0,zIndex:1000,background:'rgba(0,0,0,0.3)'}}>
        <div onClick={e=>e.stopPropagation()} style={{position:'fixed',left:'50%',top:'50%',transform:'translate(-50%,-50%)',background:'white',borderRadius:14,padding:16,minWidth:240,maxWidth:320,boxShadow:'0 8px 32px rgba(0,0,0,0.2)',zIndex:1001}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
            <span style={{fontSize:13,fontWeight:700,color:'#44403c'}}>Detalle</span>
            <button onClick={()=>setTooltip(null)} style={{background:'none',border:'none',cursor:'pointer',fontSize:18,color:'#78716c',lineHeight:1}}>✕</button>
          </div>
          {tooltip.items.map((item,i)=>(
            <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:i<tooltip.items.length-1?'1px solid #F5F4F0':'none'}}>
              <span style={{fontSize:13,color:'#57534e',flex:1,marginRight:8}}>{item.desc}</span>
              <span style={{fontSize:13,fontWeight:600,color:item.color||'#57534e',whiteSpace:'nowrap'}}>{item.signo||''}{fmt(item.monto)}</span>
            </div>
          ))}
        </div>
      </div>
    )}
    </div>
  );
}

    }));
    setTransfer({origen:'',destino:'',monto:'',desc:'Transferencia'});

function Reporte({gastosVariables, ingresosExtra, naranja, bbva, cuentas}) {
  const [tipo, setTipo] = useState('gastos'); // 'gastos' | 'ingresos'
  const [agrup, setAgrup] = useState('semana'); // 'semana' | 'mes'

  // Get all periods (last 8 weeks or last 6 months)
  const getPeriodos = () => {
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    if(agrup==='semana') {
      // Start from current monday
      const lunActual = new Date(hoy);
      lunActual.setDate(hoy.getDate() - (hoy.getDay()===0?6:hoy.getDay()-1));
      return Array.from({length:13},(_,i)=>{
        const lun = new Date(lunActual); lun.setDate(lunActual.getDate() + i*7);
        const dom = new Date(lun); dom.setDate(lun.getDate()+6);
        return {
          key: lun.toISOString().split('T')[0],
          label: `${lun.getDate()}/${lun.getMonth()+1}`,
          desde: lun.toISOString().split('T')[0],
          hasta: dom.toISOString().split('T')[0],
        };
      });
    } else {
      // Start from current month + 12
      return Array.from({length:13},(_,i)=>{
        const d = new Date(hoy.getFullYear(), hoy.getMonth()+i, 1);
        const fin = new Date(d.getFullYear(), d.getMonth()+1, 0);
        const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
        return {
          key: `${d.getFullYear()}-${d.getMonth()}`,
          label: `${meses[d.getMonth()]} ${d.getFullYear().toString().slice(2)}`,
          desde: d.toISOString().split('T')[0],
          hasta: fin.toISOString().split('T')[0],
        };
      });
    }
  };

  const periodos = getPeriodos();

  // Get rows (categories or types)
  const items = tipo==='gastos' ? gastosVariables : ingresosExtra;
  const getLabel = item => tipo==='gastos' ? item.cat : (item.tipo==='sueldo'?'Sueldo':item.tipo==='show'?'Show':'Trabajo');
  const labels = [...new Set(items.map(getLabel))].filter(Boolean);

  // Get value for cell
  const getCellVal = (label, periodo) => {
    return items
      .filter(x => getLabel(x)===label && x.fecha>=periodo.desde && x.fecha<=periodo.hasta)
      .reduce((a,b)=>a+b.monto,0);
  };
  const getColTotal = (periodo) => items.filter(x=>x.fecha>=periodo.desde&&x.fecha<=periodo.hasta).reduce((a,b)=>a+b.monto,0);
  const getRowTotal = (label) => items.filter(x=>getLabel(x)===label).reduce((a,b)=>a+b.monto,0);
  const grandTotal = items.reduce((a,b)=>a+b.monto,0);

  const isGasto = tipo==='gastos';
  const colorVal = isGasto ? 'var(--danger)' : 'var(--success)';
  const signo = isGasto ? '-' : '+';

  return (
    <div>
      <div style={{display:'flex',gap:8,marginBottom:12}}>
        <div className="tab-pills" style={{marginBottom:0}}>
          <button className={`tab-pill ${tipo==='gastos'?'active':''}`} onClick={()=>setTipo('gastos')}>➖ Gastos</button>
          <button className={`tab-pill ${tipo==='ingresos'?'active':''}`} onClick={()=>setTipo('ingresos')}>💰 Ingresos</button>
        </div>
        <div className="tab-pills" style={{marginBottom:0,marginLeft:'auto'}}>
          <button className={`tab-pill ${agrup==='semana'?'active':''}`} onClick={()=>setAgrup('semana')}>Sem.</button>
          <button className={`tab-pill ${agrup==='mes'?'active':''}`} onClick={()=>setAgrup('mes')}>Mes</button>
        </div>
      </div>

      <div style={{overflowX:'auto',WebkitOverflowScrolling:'touch',margin:'0 -12px'}}>
        <table style={{borderCollapse:'collapse',minWidth:600,fontSize:12,width:'100%'}}>
          <thead>
            <tr style={{background:'var(--surface2)'}}>
              <td style={{padding:'10px 12px',fontWeight:700,color:'var(--text2)',position:'sticky',left:0,background:'var(--surface2)',zIndex:1,minWidth:110}}>Categoría</td>
              {periodos.map(p=>(
                <td key={p.key} style={{padding:'10px 8px',textAlign:'center',fontWeight:700,color:'var(--text2)',whiteSpace:'nowrap'}}>{p.label}</td>
              ))}
              <td style={{padding:'10px 8px',textAlign:'center',fontWeight:700,color:'var(--text)'}}>Total</td>
            </tr>
          </thead>
          <tbody>
            {labels.map((label,li)=>(
              <tr key={label} style={{background:li%2===0?'white':'var(--surface2)'}}>
                <td style={{padding:'8px 12px',fontWeight:600,position:'sticky',left:0,background:li%2===0?'white':'var(--surface2)',zIndex:1}}>{label}</td>
                {periodos.map(p=>{
                  const val = getCellVal(label, p);
                  return <td key={p.key} style={{padding:'8px',textAlign:'center',color:val>0?colorVal:'var(--text3)',fontWeight:val>0?600:400,fontFamily:'DM Mono,monospace'}}>
                    {val>0?`${signo}${fmt(val)}`:'—'}
                  </td>;
                })}
                <td style={{padding:'8px',textAlign:'center',fontWeight:700,color:colorVal,fontFamily:'DM Mono,monospace'}}>{signo}{fmt(getRowTotal(label))}</td>
              </tr>
            ))}
            {labels.length===0 && (
              <tr><td colSpan={periodos.length+2} style={{padding:20,textAlign:'center',color:'var(--text3)'}}>Sin datos</td></tr>
            )}
          </tbody>
          <tfoot>
            <tr style={{borderTop:'2px solid var(--border)',background:'var(--surface2)'}}>
              <td style={{padding:'10px 12px',fontWeight:700,position:'sticky',left:0,background:'var(--surface2)',zIndex:1}}>Total</td>
              {periodos.map(p=>{
                const val = getColTotal(p);
                return <td key={p.key} style={{padding:'10px 8px',textAlign:'center',fontWeight:700,color:val>0?colorVal:'var(--text3)',fontFamily:'DM Mono,monospace'}}>
                  {val>0?`${signo}${fmt(val)}`:'—'}
                </td>;
              })}
              <td style={{padding:'10px 8px',textAlign:'center',fontWeight:700,color:colorVal,fontFamily:'DM Mono,monospace'}}>{signo}{fmt(grandTotal)}</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  );
}

function TarjetaCard({tarjeta, setTarjeta, categorias, gastosVariables, setGastosVariables, cuentas, setCuentas}) {
  const [showAdd, setShowAdd] = useState(false);
  const [showEdit, setShowEdit] = useState(false);
  const [showHistorial, setShowHistorial] = useState(false);
  const [showPago, setShowPago] = useState(false);
  const [pagoVals, setPagoVals] = useState({monto:'', cuenta:'BBVA', fecha:today});
  const [editHeader, setEditHeader] = useState({cierre:tarjeta.cierre,vencimiento:tarjeta.vencimiento,saldoBase:tarjeta.saldoBase});
  const [newC, setNewC] = useState({desc:'',monto:'',fecha:today,pago:'1',cuotas:'3',cat:categorias[0]||'Otro'});

  useEffect(()=>{
    const hoy=new Date(); hoy.setHours(0,0,0,0);
    const cierre=new Date(tarjeta.cierre+'T12:00:00');
    if(hoy>cierre && tarjeta.consumosBase.length>0){
      const proximosCuotas=tarjeta.consumosNuevos.filter(c=>c.esProximo);
      const historialEntry={id:Date.now(),cierre:tarjeta.cierre,vencimiento:tarjeta.vencimiento,saldoBase:tarjeta.saldoBase,consumos:[...tarjeta.consumosBase,...tarjeta.consumosNuevos.filter(c=>!c.esProximo)],total:tarjeta.saldoBase+tarjeta.consumosNuevos.filter(c=>!c.esProximo).reduce((a,b)=>a+b.montoCuota,0)};
      const nextCierre=(()=>{const d=new Date(tarjeta.cierre+'T12:00:00');d.setMonth(d.getMonth()+1);return d.toISOString().split('T')[0];})();
      const nextVenc=(()=>{const d=new Date(tarjeta.vencimiento+'T12:00:00');d.setMonth(d.getMonth()+1);return d.toISOString().split('T')[0];})();
      const cuotasFuturas=tarjeta.consumosNuevos.filter(c=>!c.esProximo&&c.esCuotas&&c.cuotas>1).map(c=>({desc:c.desc+` (cuota 2/${c.cuotas})`,monto:c.montoCuota,fecha:nextCierre,esCuotaFutura:true,cuotasRestantes:c.cuotas-1,montoCuota:c.montoCuota}));
      const cuotasBaseRestantes=(tarjeta.consumosBase||[]).filter(c=>c.esCuotaFutura&&c.cuotasRestantes>1).map(c=>({...c,desc:c.desc.replace(/cuota \d+/,`cuota ${parseInt(c.desc.match(/cuota (\d+)/)?.[1]||1)+1}`),cuotasRestantes:c.cuotasRestantes-1,fecha:nextCierre}));
      const nextConsumosBase=[...proximosCuotas.map(c=>({desc:c.desc+(c.esCuotas?` (cuota 2/${c.cuotas})`:''),monto:c.montoCuota,fecha:c.fecha})),...cuotasFuturas,...cuotasBaseRestantes];
      setTarjeta({...tarjeta,cierre:nextCierre,vencimiento:nextVenc,saldoBase:0,consumosBase:nextConsumosBase,consumosNuevos:[],historial:[...(tarjeta.historial||[]),historialEntry]});
    }
  },[]);

  const actuales=tarjeta.consumosNuevos.filter(c=>!c.esProximo);
  const proximos=tarjeta.consumosNuevos.filter(c=>c.esProximo);
  const totalConsumosBase=tarjeta.consumosBase.reduce((a,b)=>a+b.monto,0);
  const totalNuevosActual=actuales.reduce((a,b)=>a+b.montoCuota,0);
  const totalNuevosProximo=proximos.reduce((a,b)=>a+b.montoCuota,0);
  const saldoTotal=tarjeta.saldoBase+totalConsumosBase+totalNuevosActual;
  const disp=Math.max(0,tarjeta.limite-saldoTotal);
  const pct=Math.min(100,Math.round(saldoTotal/tarjeta.limite*100));
  const barColor=pct>=80?'#A32D2D':pct>=50?'#854F0B':'#3B6D11';

  const addConsumo=()=>{
    if(!newC.desc||!newC.monto) return;
    const monto=parseFloat(newC.monto);
    const esCuotas=newC.pago==='z';
    const cuotas=esCuotas?parseInt(newC.cuotas):1;
    const montoCuota=esCuotas?Math.round(monto/cuotas):monto;
    const esProximo=newC.fecha>tarjeta.cierre;
    setTarjeta({...tarjeta,consumosNuevos:[...tarjeta.consumosNuevos,{id:Date.now(),desc:newC.desc,cat:newC.cat,montoTotal:monto,montoCuota,cuotas,esCuotas,fecha:newC.fecha,esProximo}]});
    setNewC({desc:'',monto:'',fecha:today,pago:'1',cuotas:'3',cat:categorias[0]||'Otro'});
    setShowAdd(false);
  };

  return (
    <div>
      <div className="card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
          <div>
            <div style={{fontWeight:700,fontSize:15}}>{tarjeta.nombre}</div>
            <div style={{fontSize:11,color:'#a8a29e',marginTop:2}}>Cierra {fmtDate(tarjeta.cierre)} · Vence {fmtDate(tarjeta.vencimiento)}</div>
            {tarjeta.usd&&<div style={{fontSize:11,color:'#a8a29e'}}>{tarjeta.usd}</div>}
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:22,fontWeight:700,color:'#A32D2D'}}>{fmt(saldoTotal)}</div>
            <div style={{fontSize:11,color:'#a8a29e'}}>Límite: {fmt(tarjeta.limite)}</div>
            <button style={{fontSize:11,color:'#185FA5',background:'none',border:'none',cursor:'pointer',marginTop:2}} onClick={()=>setShowEdit(!showEdit)}>✏️ Editar</button>
          </div>
        </div>
        {showEdit&&(
          <FormBox>
            <FormRow label="Cierre"><input type="date" value={editHeader.cierre} onChange={e=>setEditHeader({...editHeader,cierre:e.target.value})} /></FormRow>
            <FormRow label="Vencimiento"><input type="date" value={editHeader.vencimiento} onChange={e=>setEditHeader({...editHeader,vencimiento:e.target.value})} /></FormRow>
            <FormRow label="Saldo base"><input type="number" value={editHeader.saldoBase} onChange={e=>setEditHeader({...editHeader,saldoBase:parseFloat(e.target.value)||0})} /></FormRow>
            <div style={{display:'flex',gap:8,marginTop:8}}><button className="btn-save" onClick={()=>{setTarjeta({...tarjeta,...editHeader});setShowEdit(false);}}>Guardar</button><button className="btn-cancel" onClick={()=>setShowEdit(false)}>Cancelar</button></div>
          </FormBox>
        )}
        <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'#78716c',marginBottom:4,marginTop:8}}>
          <span>Disponible: <strong style={{color:disp<50000?'#854F0B':'#3B6D11'}}>{fmt(disp)}</strong></span>
          <span>Usado: <strong style={{color:barColor}}>{pct}%</strong></span>
        </div>
        <div className="progress-bg"><div className="progress-bar" style={{width:`${pct}%`,background:barColor}} /></div>
      </div>

      <div className="card">
        <div className="card-title">Resumen actual <Badge text={`Cierra ${fmtDate(tarjeta.cierre)}`} color="warning" /></div>
        {tarjeta.consumosBase.map((c,i)=>(
          <div key={i} className="row">
            <div className="row-label">{c.desc}<br/><span style={{fontSize:11,color:'#a8a29e'}}>{fmtDate(c.fecha)}</span></div>
            <span className="row-val" style={{color:c.monto<0?'#3B6D11':'#A32D2D'}}>{c.monto<0?'+':''}{fmt(Math.abs(c.monto))}</span>
          </div>
        ))}
        {actuales.map(c=>(
          <div key={c.id}>
            <div className="row">
              <div className="row-label"><Badge text={c.esCuotas?`${c.cuotas}c`:'nuevo'} color={c.esCuotas?'warning':'new'} /> {c.desc}<br/><span style={{fontSize:11,color:'#a8a29e'}}>{c.esCuotas?`Cuota 1/${c.cuotas}: ${fmt(c.montoCuota)}`:fmtDate(c.fecha)}</span></div>
              <div style={{display:'flex',alignItems:'center',gap:4}}>
                <span className="row-val" style={{color:'#185FA5'}}>{fmt(c.montoCuota)}</span>
                <button className="btn-icon" onClick={()=>setTarjeta({...tarjeta,consumosNuevos:tarjeta.consumosNuevos.filter(x=>x.id!==c.id)})}>🗑</button>
              </div>
            </div>
          </div>
        ))}
        <div className="total-row"><span style={{fontWeight:600}}>Total resumen actual</span><span style={{fontWeight:700,color:'#A32D2D',fontSize:15}}>{fmt(totalConsumosBase+totalNuevosActual)}</span></div>
      </div>

      {proximos.length>0&&(
        <div className="card">
          <div className="card-title">Próximo resumen <Badge text="posterior al cierre" color="info" /></div>
          {proximos.map(c=>(
            <div key={c.id} className="row">
              <div className="row-label"><Badge text="próximo" color="info" /> {c.desc}<br/><span style={{fontSize:11,color:'#a8a29e'}}>{fmtDate(c.fecha)}</span></div>
              <div style={{display:'flex',alignItems:'center',gap:4}}>
                <span className="row-val" style={{color:'#185FA5'}}>{fmt(c.montoCuota)}</span>
                <button className="btn-icon" onClick={()=>setTarjeta({...tarjeta,consumosNuevos:tarjeta.consumosNuevos.filter(x=>x.id!==c.id)})}>🗑</button>
              </div>
            </div>
          ))}
          <div className="total-row"><span style={{fontWeight:600}}>Total próximo resumen</span><span style={{fontWeight:700,color:'#185FA5',fontSize:15}}>{fmt(totalNuevosProximo)}</span></div>
        </div>
      )}

      {(tarjeta.historial||[]).length>0&&(
        <div className="card">
          <div className="card-title" style={{cursor:'pointer'}} onClick={()=>setShowHistorial(!showHistorial)}>
            📋 Historial ({(tarjeta.historial||[]).length}) {showHistorial?'▲':'▼'}
          </div>
          {showHistorial&&(tarjeta.historial||[]).slice().reverse().map(h=>(
            <div key={h.id} style={{marginBottom:14,paddingBottom:14,borderBottom:'1px solid #F5F4F0'}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
                <div><div style={{fontWeight:600,fontSize:13}}>Resumen {fmtDate(h.cierre)}</div><div style={{fontSize:11,color:'#a8a29e'}}>Venció {fmtDate(h.vencimiento)}</div></div>
                <div style={{fontWeight:700,color:'#A32D2D',fontSize:15}}>{fmt(h.total||h.saldoBase)}</div>
              </div>
              {(h.consumos||[]).map((c,i)=>(
                <div key={i} className="row" style={{fontSize:12}}>
                  <span style={{color:'#78716c',flex:1}}>{c.desc}</span>
                  <span style={{fontWeight:600,color:c.monto<0?'#3B6D11':'#A32D2D'}}>{c.monto<0?'+':''}{fmt(Math.abs(c.monto))}</span>
                </div>
              ))}
            </div>
          ))}
        </div>
      )}

      <div className="card">
        <div className="card-title">Pagar tarjeta</div>
        {!showPago ? (
          <button className="btn-save" style={{width:'100%'}} onClick={()=>setShowPago(true)}>💳 Registrar pago</button>
        ) : (
          <FormBox>
            <div style={{fontSize:13,marginBottom:8}}>Total resumen actual: <strong style={{color:'#A32D2D'}}>{fmt(saldoTotal)}</strong></div>
            <FormRow label="Monto"><input type="number" value={pagoVals.monto} onChange={e=>setPagoVals({...pagoVals,monto:e.target.value})} placeholder={String((() => { const hoy=new Date(); hoy.setHours(0,0,0,0); const vD=new Date(tarjeta.vencimiento+"T12:00:00"); const uH=(tarjeta.historial||[]).length>0?tarjeta.historial[tarjeta.historial.length-1]:null; return uH&&hoy<=vD?(uH.total||uH.saldoBase):saldoTotal; })())} /></FormRow>
            <FormRow label="Cuenta origen"><select value={pagoVals.cuenta} onChange={e=>setPagoVals({...pagoVals,cuenta:e.target.value})}>
              {cuentas.map(c=><option key={c.id} value={c.nombre}>{c.icono} {c.nombre}</option>)}
            </select></FormRow>
            <FormRow label="Fecha"><input type="date" value={pagoVals.fecha} onChange={e=>setPagoVals({...pagoVals,fecha:e.target.value})} /></FormRow>
            <div style={{display:'flex',gap:8,marginTop:8}}>
              <button className="btn-save" onClick={()=>{
                const hoy = new Date(); hoy.setHours(0,0,0,0);
                const vencD = new Date(tarjeta.vencimiento+'T12:00:00');
                const ultimoH = (tarjeta.historial||[]).length>0 ? tarjeta.historial[tarjeta.historial.length-1] : null;
                const montoDefault = ultimoH && hoy<=vencD ? (ultimoH.total||ultimoH.saldoBase) : saldoTotal;
                const monto = parseFloat(pagoVals.monto)||montoDefault;
                const pagoId = Date.now();
                setCuentas(cuentas.map(c=>c.nombre===pagoVals.cuenta?{
                  ...c,
                  saldo: c.saldo-monto,
                  movimientos: [{id:pagoId,desc:`Pago ${tarjeta.nombre}`,monto,tipo:'egreso',fecha:pagoVals.fecha},...(c.movimientos||[])]
                }:c));
                setTarjeta({...tarjeta, pagos:[{id:pagoId,monto,cuenta:pagoVals.cuenta,fecha:pagoVals.fecha},...(tarjeta.pagos||[])]});
                setShowPago(false);
                setPagoVals({monto:'',cuenta:cuentas[0]?.nombre||'BBVA',fecha:today});
              }}>Confirmar pago</button>
              <button className="btn-cancel" onClick={()=>setShowPago(false)}>Cancelar</button>
            </div>
          </FormBox>
        )}
      </div>

      {(tarjeta.pagos||[]).length > 0 && (
        <div className="card">
          <div className="card-title">Pagos realizados</div>
          {(tarjeta.pagos||[]).map(p=>(
            <div key={p.id} className="row">
              <div className="row-label">
                Pago {tarjeta.nombre}
                <br/><span style={{fontSize:11,color:'#a8a29e'}}>{p.fecha} · desde {p.cuenta}</span>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:4}}>
                <span className="row-val" style={{color:'#3B6D11'}}>-{fmt(p.monto)}</span>
                <button className="btn-icon" onClick={()=>{
                  // Revertir saldo de la cuenta
                  setCuentas(cuentas.map(c=>c.nombre===p.cuenta?{
                    ...c,
                    saldo: c.saldo+p.monto,
                    movimientos: (c.movimientos||[]).filter(m=>m.id!==p.id)
                  }:c));
                  // Eliminar pago de tarjeta
                  setTarjeta({...tarjeta, pagos:(tarjeta.pagos||[]).filter(x=>x.id!==p.id)});
                }}>🗑</button>
              </div>
            </div>
          ))}
        </div>
      )}

      <div className="card">
        <div className="card-title">Agregar consumo <BtnAdd onClick={()=>setShowAdd(!showAdd)} /></div>
        {showAdd&&(
          <Modal title={`Consumo — ${tarjeta.nombre}`} onClose={()=>setShowAdd(false)}>
            <MFormRow label="Descripción"><input value={newC.desc} onChange={e=>setNewC({...newC,desc:e.target.value})} placeholder="Ej: Supermercado" /></MFormRow>
            <MFormRow label="Monto total"><input type="number" value={newC.monto} onChange={e=>setNewC({...newC,monto:e.target.value})} placeholder="0" /></MFormRow>
            <MFormRow label="Fecha"><input type="date" value={newC.fecha} onChange={e=>setNewC({...newC,fecha:e.target.value})} /></MFormRow>
            <MFormRow label="Categoría"><select value={newC.cat} onChange={e=>setNewC({...newC,cat:e.target.value})}>{categorias.map(c=><option key={c} value={c}>{c}</option>)}</select></MFormRow>
            <MFormRow label="Forma de pago"><select value={newC.pago} onChange={e=>setNewC({...newC,pago:e.target.value})}><option value="1">Un pago</option><option value="z">En cuotas sin interés</option></select></MFormRow>
            {newC.pago==='z'&&<MFormRow label="Cuotas"><select value={newC.cuotas} onChange={e=>setNewC({...newC,cuotas:e.target.value})}><option value="2">2</option><option value="3">3</option><option value="6">6</option><option value="12">12</option></select></MFormRow>}
            {newC.pago==='z'&&newC.monto&&<div className="alert alert-info" style={{marginBottom:8,fontSize:12}}>1ra cuota: <strong>{fmt(Math.round(parseFloat(newC.monto)/parseInt(newC.cuotas)))}</strong></div>}
            {newC.fecha>tarjeta.cierre&&<div className="alert alert-warning" style={{marginBottom:8,fontSize:12}}>📅 Fecha posterior al cierre → próximo resumen</div>}
            <div className="modal-actions"><button className="btn-save" onClick={addConsumo}>Guardar</button><button className="btn-cancel" onClick={()=>setShowAdd(false)}>Cancelar</button></div>
          </Modal>
        )}
        {!showAdd&&<div style={{fontSize:12,color:'#a8a29e'}}>Los consumos posteriores al cierre van al próximo resumen automáticamente.</div>}
      </div>
    </div>
  );
}

function Tarjetas({naranja, setNaranja, bbva, setBbva, categorias, gastosVariables, setGastosVariables, cuentas, setCuentas}) {
  const [tab, setTab] = useState('naranja');
  return (
    <div>
      <div className="tab-pills">
        <button className={`tab-pill ${tab==='naranja'?'active':''}`} onClick={()=>setTab('naranja')}>Naranja X</button>
        <button className={`tab-pill ${tab==='bbva'?'active':''}`} onClick={()=>setTab('bbva')}>BBVA Visa</button>
      </div>
      {tab==='naranja' && <TarjetaCard tarjeta={naranja} setTarjeta={setNaranja} categorias={categorias} gastosVariables={gastosVariables} setGastosVariables={setGastosVariables} cuentas={cuentas} setCuentas={setCuentas} />}
      {tab==='bbva' && <TarjetaCard tarjeta={bbva} setTarjeta={setBbva} categorias={categorias} gastosVariables={gastosVariables} setGastosVariables={setGastosVariables} cuentas={cuentas} setCuentas={setCuentas} />}
    </div>
  );
}

// ---- APP ----
const TABS = [
  {id:'dashboard', label:'Inicio', icon:'🏠'},
  {id:'variables', label:'Gastos', icon:'➖'},
  {id:'ingresos', label:'Ingresos', icon:'💰'},
  {id:'proyeccion', label:'Proy.', icon:'📊'},
  {id:'cuentas', label:'Cuentas', icon:'🏦'},
  {id:'tarjetas', label:'Tarjetas', icon:'💳'},
  {id:'reporte', label:'Reporte', icon:'📋'},
  {id:'config', label:'Config.', icon:'⚙️'},
];

function App() {
  const [tab, setTab] = useState('dashboard');
  const [saldoBase, setSaldoBase] = useState(442000);
  const [gastosFijos, setGastosFijos] = useState(GASTOS_FIJOS_INIT);
  const [gastosSem, setGastosSem] = useState(GASTOS_SEM_INIT);
  const [gastosSemPagados, setGastosSemPagados] = useState([]);
  const [vencimientos, setVencimientos] = useState(VENC_INIT);
  const [vencFijos, setVencFijos] = useState(VENC_FIJOS_INIT);
  const [gastosVariables, setGastosVariables] = useState([]);
  const [ingresosExtra, setIngresosExtra] = useState(INGRESOS_INIT);
  const [sueldosCobrados, setSueldosCobrados] = useState([]);
  const [presupuestoVar, setPresupuestoVar] = useState(300000);
  const [categorias, setCategorias] = useState(CATS_INIT);
  const [tiposIngreso, setTiposIngreso] = useState(['Sueldo','Show','Trabajo particular']);
  const [cuentas, setCuentas] = useState(CUENTAS_INIT);
  const [saldoInicialProy, setSaldoInicialProy] = useState(null);
  const [fechaSaldoProy, setFechaSaldoProy] = useState(null);
  const [sueldoCfg, setSueldoCfg] = useState({monto:430000, activo:true, ajustes:[]});
  const [variosSemanal, setVariosSemanal] = useState(100000);
  const [naranja, setNaranja] = useState(NARANJA_INIT);
  const [bbva, setBbva] = useState(BBVA_INIT);
  const importRef = useRef();
  const isFirstRender = useRef(true);

  // Load from localStorage on mount
  useEffect(()=>{
    const d = loadFromStorage();
    if(d){
      if(d.saldoBase!==undefined) setSaldoBase(d.saldoBase);
      if(d.gastosFijos) setGastosFijos(d.gastosFijos);
      if(d.gastosSem) setGastosSem(d.gastosSem);
      if(d.gastosSemPagados) setGastosSemPagados(d.gastosSemPagados);
      if(d.vencimientos) setVencimientos(d.vencimientos);
      if(d.vencFijos) setVencFijos(d.vencFijos);
      if(d.gastosVariables) setGastosVariables(d.gastosVariables);
      if(d.ingresosExtra) setIngresosExtra(d.ingresosExtra);
      if(d.sueldosCobrados) setSueldosCobrados(d.sueldosCobrados);
      if(d.presupuestoVar) setPresupuestoVar(d.presupuestoVar);
      if(d.categorias) setCategorias(d.categorias);
      if(d.naranja) setNaranja(d.naranja);
      if(d.bbva) setBbva(d.bbva);
      if(d.cuentas) setCuentas(d.cuentas);
      if(d.tiposIngreso) setTiposIngreso(d.tiposIngreso);
      if(d.fechaSaldoProy) setFechaSaldoProy(d.fechaSaldoProy);
      if(d.sueldoCfg) setSueldoCfg(d.sueldoCfg);
      if(d.variosSemanal!==undefined) setVariosSemanal(d.variosSemanal);
      if(d.saldoInicialProy!==undefined && d.saldoInicialProy!==null) setSaldoInicialProy(d.saldoInicialProy);
      else if(d.cuentas) { const b=d.cuentas.find(c=>c.nombre==='BBVA'); if(b) setSaldoInicialProy(b.saldo); }
    }
    isFirstRender.current = false;
  },[]);

  // Save to localStorage on every change
  useEffect(()=>{
    if(isFirstRender.current) return;
    const data = {saldoBase,gastosFijos,gastosSem,gastosSemPagados,vencimientos,vencFijos,gastosVariables,ingresosExtra,sueldosCobrados,presupuestoVar,categorias,tiposIngreso,naranja,bbva,cuentas,saldoInicialProy,fechaSaldoProy,sueldoCfg,variosSemanal};
    saveToStorage(data);
  },[saldoBase,gastosFijos,gastosSem,gastosSemPagados,vencimientos,vencFijos,gastosVariables,ingresosExtra,sueldosCobrados,presupuestoVar,categorias,tiposIngreso,naranja,bbva,cuentas,saldoInicialProy,fechaSaldoProy,sueldoCfg,variosSemanal]);

  const getAllData = () => ({saldoBase,gastosFijos,gastosSem,gastosSemPagados,vencimientos,vencFijos,gastosVariables,ingresosExtra,sueldosCobrados,presupuestoVar,categorias,tiposIngreso,naranja,bbva,cuentas,saldoInicialProy,fechaSaldoProy,sueldoCfg,variosSemanal});

  const handleImport = (data) => {
    if(data.saldoBase!==undefined) setSaldoBase(data.saldoBase);
    if(data.gastosFijos) setGastosFijos(data.gastosFijos);
    if(data.gastosSem) setGastosSem(data.gastosSem);
    if(data.gastosSemPagados) setGastosSemPagados(data.gastosSemPagados);
    if(data.vencimientos) setVencimientos(data.vencimientos);
    if(data.vencFijos) setVencFijos(data.vencFijos);
    if(data.gastosVariables) setGastosVariables(data.gastosVariables);
    if(data.ingresosExtra) setIngresosExtra(data.ingresosExtra);
    if(data.sueldosCobrados) setSueldosCobrados(data.sueldosCobrados);
    if(data.presupuestoVar) setPresupuestoVar(data.presupuestoVar);
    if(data.categorias) setCategorias(data.categorias);
    if(data.naranja) setNaranja(data.naranja);
    if(data.bbva) setBbva(data.bbva);
    if(data.cuentas) setCuentas(data.cuentas);
    if(data.tiposIngreso) setTiposIngreso(data.tiposIngreso);
    if(data.saldoInicialProy!==undefined&&data.saldoInicialProy!==null) setSaldoInicialProy(data.saldoInicialProy);
    if(data.fechaSaldoProy) setFechaSaldoProy(data.fechaSaldoProy);
    if(data.sueldoCfg) setSueldoCfg(data.sueldoCfg);
    if(data.variosSemanal!==undefined) setVariosSemanal(data.variosSemanal);
    if(data.silencioso) return;
    alert('✓ Datos importados correctamente');
  };

  const cargarPlan = () => {
    if(!confirm('Esto actualiza saldo, sueldo, fijos, semanales, pagos únicos y los próximos resúmenes de BBVA y Naranja con el plan de octubre 2026. El historial, los gastos registrados y los ingresos anteriores se mantienen. ¿Continuar?')) return;
    const plan = planOctubre2026({cuentas,vencimientos,ingresosExtra,bbva,naranja});
    handleImport({...plan, silencioso:true});
    alert('✓ Plan cargado. Revisá la pestaña Proy.');
  };

  const saldo = saldoBase
    + ingresosExtra.filter(x=>x.cobrado).reduce((a,b)=>a+b.monto,0)
    + sueldosCobrados.reduce((a,b)=>a+b.monto,0)
    - gastosVariables.reduce((a,b)=>a+b.monto,0)
    - gastosSemPagados.reduce((a,b)=>a+b.monto,0)
    - vencimientos.filter(x=>x.pagado&&x.tipo==='gasto').reduce((a,b)=>a+b.monto,0)
    - gastosFijos.filter(x=>x.pagado).reduce((a,b)=>a+b.monto,0);

  return (
    <div className="app">
      <div className="header">
        <h1>💸 Mis Finanzas</h1>
        <div className="io-btns">
          <button className="io-btn" onClick={()=>exportData(getAllData())}>⬇ Exportar</button>
          <button className="io-btn" onClick={()=>importRef.current.click()}>⬆ Importar</button>
          <input ref={importRef} type="file" accept=".json" style={{display:'none'}} onChange={e=>{if(e.target.files[0])importData(e.target.files[0],handleImport);e.target.value='';}} />
        </div>
      </div>

      {TABS.map(t=>(
        <div key={t.id} id={`page-${t.id}`} className={`page ${tab===t.id?'active':''}`}>
          {tab==='dashboard' && t.id==='dashboard' && <Dashboard cuentas={cuentas} vencimientos={vencimientos} gastosVariables={gastosVariables} ingresosExtra={ingresosExtra} presupuestoVar={presupuestoVar} gastosFijos={gastosFijos} setGastosFijos={setGastosFijos} gastosSemPagados={gastosSemPagados} sueldosCobrados={sueldosCobrados} naranja={naranja} bbvaTarjeta={bbva} />}
          {tab==='variables' && t.id==='variables' && <Variables gastosVariables={gastosVariables} setGastosVariables={setGastosVariables} categorias={categorias} setCategorias={setCategorias} gastosSem={gastosSem} cuentas={cuentas} setCuentas={setCuentas} naranja={naranja} setNaranja={setNaranja} bbva={bbva} setBbva={setBbva} />}
          {tab==='ingresos' && t.id==='ingresos' && <Ingresos ingresosExtra={ingresosExtra} setIngresosExtra={setIngresosExtra} tiposIngreso={tiposIngreso} cuentas={cuentas} setCuentas={setCuentas} />}
          {tab==='proyeccion' && t.id==='proyeccion' && <Proyeccion naranja={naranja} bbva={bbva} cuentas={cuentas} saldoInicialProy={saldoInicialProy} setSaldoInicialProy={setSaldoInicialProy} fechaSaldoProy={fechaSaldoProy} setFechaSaldoProy={setFechaSaldoProy} ingresosExtra={ingresosExtra} vencimientos={vencimientos} vencFijos={vencFijos} gastosSem={gastosSem} gastosVariables={gastosVariables} sueldoCfg={sueldoCfg} variosSemanal={variosSemanal} />}
          {tab==='cuentas' && t.id==='cuentas' && <Cuentas cuentas={cuentas} setCuentas={setCuentas} />}
          {tab==='tarjetas' && t.id==='tarjetas' && <Tarjetas naranja={naranja} setNaranja={setNaranja} bbva={bbva} setBbva={setBbva} categorias={categorias} gastosVariables={gastosVariables} setGastosVariables={setGastosVariables} cuentas={cuentas} setCuentas={setCuentas} />}
          {tab==='reporte' && t.id==='reporte' && <Reporte gastosVariables={gastosVariables} ingresosExtra={ingresosExtra} naranja={naranja} bbva={bbva} cuentas={cuentas} />}
          {tab==='config' && t.id==='config' && <Configuracion categorias={categorias} setCategorias={setCategorias} tiposIngreso={tiposIngreso} setTiposIngreso={setTiposIngreso} sueldoCfg={sueldoCfg} setSueldoCfg={setSueldoCfg} variosSemanal={variosSemanal} setVariosSemanal={setVariosSemanal} vencFijos={vencFijos} setVencFijos={setVencFijos} gastosSem={gastosSem} setGastosSem={setGastosSem} onCargarPlan={cargarPlan} />}
        </div>
      ))}

      <nav className="nav">
        {TABS.map(t=>(
          <button key={t.id} className={`nav-btn ${tab===t.id?'active':''}`} onClick={()=>setTab(t.id)}>
            <span style={{fontSize:18}}>{t.icon}</span>
            <span>{t.label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
